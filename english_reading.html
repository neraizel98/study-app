<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>영어 독해</title><link rel="stylesheet" href="styles.css">
    <style>
        #toggleQuizTranslation{margin:0 0 14px;padding:10px 16px;min-height:44px;border:1px solid #8b9fe8;border-radius:12px;background:#27334f;color:#e4eaff;font:inherit;cursor:pointer}#toggleQuizTranslation:focus-visible{outline:3px solid #fde68a;outline-offset:3px}#quizTranslation{margin:0 0 18px;line-height:1.75;color:#cbd9ef}#quizTranslation p{margin:8px 0}#quizTranslation strong{color:#e5dcff}
        :root{--er:#60a5fa;--er2:#a78bfa}body{min-height:100vh;background:radial-gradient(circle at top,#1e3a5f,#0b1120 55%,#050814);color:#e5eefb}.shell{width:min(1060px,94%);margin:auto;padding:28px 0 70px}.nav,.passage-head,.quiz-head{display:flex;justify-content:space-between;gap:14px;align-items:center}.nav a{color:#dbeafe;text-decoration:none}.hero,.card{border:1px solid #2d405d;border-radius:22px;background:rgba(15,23,42,.9);padding:clamp(20px,4vw,36px)}.hero{margin:22px 0;background:linear-gradient(135deg,rgba(59,130,246,.2),rgba(167,139,250,.13))}.hero h1{margin:5px 0}.muted{color:#a9bad0}.tabs,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.tabs button,.actions button,.choice{border:1px solid #3b4b65;background:#111b2c;color:#f8fafc;border-radius:12px;padding:12px 16px;cursor:pointer}.tabs .active,.primary{background:linear-gradient(135deg,var(--er),var(--er2))!important;color:#07111f!important;font-weight:900}.tabs button:disabled{opacity:.42;cursor:not-allowed}.notice{padding:13px 15px;border-radius:12px;background:rgba(96,165,250,.1);color:#bfdbfe}.passage{margin:20px 0;padding:24px;background:#fffdf7;color:#172033;border-radius:16px;font:1.08rem/1.95 Georgia,serif}.passage p{margin:.45rem 0}.translation{display:block;color:#64748b;font:0.9rem/1.6 system-ui;margin-left:1.2rem}.translation[hidden]{display:none}.study-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.study-box{padding:17px;border-radius:14px;background:#101b2d}.study-box h3{margin-top:0}.quiz-question{font-size:1.3rem;margin:24px 0}.choices{display:grid;gap:11px}.choice{text-align:left}.choice.correct{border-color:#34d399;background:rgba(16,185,129,.18)}.choice.wrong{border-color:#fb7185;background:rgba(244,63,94,.15)}.feedback{margin-top:18px;padding:16px;border-radius:12px;background:#101b2d}.evidence{border-left:4px solid #fbbf24;padding-left:12px;color:#fde68a}.modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(2,6,23,.84);padding:20px;z-index:20}.modal[hidden],[hidden]{display:none!important}.modal-inner{width:min(470px,94vw);background:#111b2c;border:1px solid #3b4b65;border-radius:22px;padding:28px;text-align:center}@media(max-width:680px){.study-grid{grid-template-columns:1fr}.passage-head{align-items:flex-start;flex-direction:column}}
    </style>
    <style>
        .shell a,.shell a:visited{color:#8cddff;text-decoration:underline;text-underline-offset:3px}.shell a:hover{color:#fff0a8}.shell a:focus-visible,.word-controls button:focus-visible{outline:3px solid #fde68a;outline-offset:3px}#vocabulary{list-style:none;padding:0}#vocabulary li{padding:12px 0;border-bottom:1px solid #30415a}.word-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.word-controls a{margin-right:auto}.word-controls button{min-height:44px;padding:8px 12px;border:1px solid #6f91bd;border-radius:10px;background:#203650;color:#f1f7ff;font:inherit;cursor:pointer}.word-meaning{margin-top:8px;color:#fef3c7}
        .audio-icon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:44px;height:44px;padding:10px!important;border:1px solid #72c8ed!important;border-radius:50%!important;background:linear-gradient(145deg,#21466a,#172c47)!important;color:#a6e5ff!important;cursor:pointer;box-shadow:0 3px 12px #02061755}.audio-icon svg{width:22px;height:22px}.audio-icon.playing{background:#94e4ff!important;color:#10243a!important;box-shadow:0 0 0 4px #7dd3fc33}.reading-word{margin-right:auto}.audio-icon:focus-visible{outline:3px solid #fde68a;outline-offset:3px}
        body{display:block}.shell{min-width:0}#studyTimerBar .stb-inner{flex-wrap:wrap}#studyTimerBar .stb-label,#studyTimerBar .stb-remain{white-space:normal;min-width:0;flex-shrink:1}.passage,.study-box,.notice{overflow-wrap:anywhere}.study-box ul{padding-left:20px}
    </style>
</head>
<body><main class="shell">
    <nav class="nav"><a href="english.html">← 영어 단어</a><a href="index.html">🏠 홈</a></nav>
    <header class="hero"><div class="muted">ENGLISH READING</div><h1>영어 독해</h1><p>문장 근거를 찾아 읽고, 단어와 문법을 함께 연결해요.</p></header>
    <div id="studyTimerBar" aria-live="polite"></div>
    <div id="levelTabs" class="tabs" aria-label="학년 선택"></div><div id="unitTabs" class="tabs" aria-label="단원 선택"></div>
    <p id="adaptiveNotice" class="notice" role="status"></p><p id="recommendationNotice" class="notice" role="status"></p>
    <section id="studyPanel" class="card">
        <div class="passage-head"><div><span id="passageMeta" class="muted"></span><h2 id="passageTitle"></h2></div><button id="listenPassage" class="audio-icon" type="button" aria-label="지문 전체 듣기 또는 정지" title="지문 듣기 · 다시 누르면 정지" aria-pressed="false"></button><button id="toggleTranslation">한국어 뜻 보기</button></div>
        <div id="studyPassage" class="passage"></div>
        <div class="study-grid"><article class="study-box"><h3>핵심 단어</h3><ul id="vocabulary"></ul></article><article class="study-box"><h3>문법 포인트</h3><div id="grammarNotes"></div><div id="grammarLinks"></div></article></div>
        <div class="actions"><button id="prevPassage">← 이전 지문</button><button id="nextPassage">다음 지문 →</button><button id="practiceQuiz" class="primary">이 지문 연습</button><button id="freshAssessment" class="primary">미학습 지문 평가</button></div>
    </section>
    <section id="quizPanel" class="card" hidden>
        <div class="quiz-head"><span id="quizProgress"></span><strong id="quizScore"></strong></div><h2 id="quizPassageTitle"></h2><div id="quizPassage" class="passage"></div>
        <h3 id="quizQuestion" class="quiz-question"></h3>
        <button id="toggleQuizTranslation" type="button" aria-expanded="false" aria-controls="quizTranslation" hidden>번역 보기</button>
        <div id="quizTranslation" class="feedback" hidden></div>
        <div id="quizChoices" class="choices"></div><div id="quizFeedback" class="feedback" hidden></div>
        <div class="actions"><button id="showHint">근거 힌트</button><button id="nextQuestion" class="primary" hidden>다음 문제</button><button id="backToStudy">학습으로 돌아가기</button></div>
    </section>
    <section id="resultModal" class="modal" hidden><div class="modal-inner"><h2>독해 결과</h2><p id="resultScore"></p><p id="initialScoreNote"></p><p id="resultMessage"></p><div class="actions"><button id="retryWrong" class="primary">틀린 문제 다시 풀기</button><button id="closeResult">학습으로 돌아가기</button><a href="report.html">통합 성적표</a></div></div></section>
</main>
<script src="utils.js"></script><script src="storage-keys.js"></script><script src="storage-events.js"></script><script src="schema-migrations.js"></script><script src="durable-store.js"></script><script src="local-repository.js"></script><script src="app-bootstrap.js"></script>
<script src="report.js?v=20260930-shared-subjects"></script><script src="study-timer.js?v=20260930-shared-subjects"></script><script src="firebase-config.js"></script><script src="firebase-client.js"></script><script src="firestore-repository.js?v=20260930-shared-subjects"></script><script src="partition-repository.js"></script><script src="firebase-sync.js?v=20260930-shared-subjects"></script><script src="notification-client.js"></script><script src="in-app-study-request.js"></script>
<script src="VocabEng.js"></script><script src="EnglishGrammarData.js"></script><script src="EnglishReadingData.js?v=20260930-shared-subjects"></script><script src="EnglishReadingPolicy.js?v=20260930-shared-subjects"></script><script src="EnglishReadingApp.js?v=20260930-shared-subjects"></script><script src="parent-scope-guard.js?v=20260930-shared-subjects"></script><script src="version-check.js"></script>
