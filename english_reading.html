    <style>
        #toggleQuizTranslation{margin:0 0 14px;padding:10px 16px;min-height:44px;border:1px solid #23845c;border-radius:12px;background:#ffffff;color:#2b2620;font:inherit;cursor:pointer}#toggleQuizTranslation:focus-visible{outline:3px solid #b28f00;outline-offset:3px}#quizTranslation{margin:0 0 18px;line-height:1.75;color:#2b2620}#quizTranslation p{margin:8px 0}#quizTranslation strong{color:#2b2620}
        :root{--er:#23845c;--er2:#7041fb}body{min-height:100vh;background:radial-gradient(circle at top,#ecf5ef,#fbf7ef 55%,#fbf7ef);color:#2b2620}.shell{width:min(1060px,94%);margin:auto;padding:28px 0 70px}.nav,.passage-head,.quiz-head{display:flex;justify-content:space-between;gap:14px;align-items:center}.nav a{color:#2b2620;text-decoration:none}.hero,.card{border:1px solid #ddd2bf;border-radius:22px;background:#ffffff;padding:clamp(20px,4vw,36px)}.hero{margin:22px 0;background:linear-gradient(135deg,rgba(35,132,92,0.18),rgba(112,65,251,0.13))}.hero h1{margin:5px 0}.muted{color:#6e6559}.tabs,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.tabs button,.actions button,.choice{border:1px solid #ddd2bf;background:#ffffff;color:#2b2620;border-radius:12px;padding:12px 16px;cursor:pointer}.tabs .active,.primary{background:linear-gradient(135deg,var(--er),var(--er2))!important;color:#ffffff!important;font-weight:900}.tabs button:disabled{opacity:.42;cursor:not-allowed}.notice{padding:13px 15px;border-radius:12px;background:rgba(35,132,92,0.1);color:#23845c}.passage{margin:20px 0;padding:24px;background:#ffffff;color:#2b2620;border-radius:16px;font:1.08rem/1.95 Georgia,serif}.passage p{margin:.45rem 0}.translation{display:block;color:#968c7e;font:0.9rem/1.6 system-ui;margin-left:1.2rem}.translation[hidden]{display:none}.study-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.study-box{padding:17px;border-radius:14px;background:#ffffff}.study-box h3{margin-top:0}.quiz-question{font-size:1.3rem;margin:24px 0}.choices{display:grid;gap:11px}.choice{text-align:left}.choice.correct{border-color:#20a574;background:rgba(10,160,111,0.18)}.choice.wrong{border-color:#fe3e5a;background:rgba(249,58,91,0.15)}.feedback{margin-top:18px;padding:16px;border-radius:12px;background:#ffffff}.evidence{border-left:4px solid #be8900;padding-left:12px;color:#8f7200}.modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(43,38,32,0.45);padding:20px;z-index:20}.modal[hidden],[hidden]{display:none!important}.modal-inner{width:min(470px,94vw);background:#ffffff;border:1px solid #ddd2bf;border-radius:22px;padding:28px;text-align:center}@media(max-width:680px){.study-grid{grid-template-columns:1fr}.passage-head{align-items:flex-start;flex-direction:column}}
    </style>
    <style>
        .shell a,.shell a:visited{color:#23845c;text-decoration:underline;text-underline-offset:3px}.shell a:hover{color:#8a7200}.shell a:focus-visible,.word-controls button:focus-visible{outline:3px solid #b28f00;outline-offset:3px}#vocabulary{list-style:none;padding:0}#vocabulary li{padding:12px 0;border-bottom:1px solid #ddd2bf}.word-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.word-controls a{margin-right:auto}.word-controls button{min-height:44px;padding:8px 12px;border:1px solid #6d91bf;border-radius:10px;background:#ffffff;color:#2b2620;font:inherit;cursor:pointer}.word-meaning{margin-top:8px;color:#8f7200}
        .audio-icon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:44px;height:44px;padding:10px!important;border:1px solid #23845c!important;border-radius:50%!important;background:linear-gradient(145deg,#ecf5ef,#ffffff)!important;color:#23845c!important;cursor:pointer;box-shadow:0 3px 12px rgba(43,38,32,0.105)}.audio-icon svg{width:22px;height:22px}.audio-icon.playing{background:#23845c!important;color:#ffffff!important;box-shadow:0 0 0 4px rgba(35,132,92,0.07)}.reading-word{margin-right:auto}.audio-icon:focus-visible{outline:3px solid #b28f00;outline-offset:3px}
        body{display:block}.shell{min-width:0}#studyTimerBar .stb-inner{flex-wrap:wrap}#studyTimerBar .stb-label,#studyTimerBar .stb-remain{white-space:normal;min-width:0;flex-shrink:1}.passage,.study-box,.notice{overflow-wrap:anywhere}.study-box ul{padding-left:20px}

<link rel="stylesheet" href="today-flow.css?v=20261014-redesign"><link rel="stylesheet" href="theme.css?v=20261020-korean-vocab">
    <style>
        /* 학습 화면: 단어 학습 화면과 같은 카드·알약 버튼 언어로 맞춘다 */
        .notice{margin:0 0 8px;font-size:.92rem}.notice:empty{display:none}
        #studyPanel .passage-head{align-items:flex-start}#studyPanel .passage-head h2{margin:6px 0 0;font-size:1.5rem}
        .passage-tools{display:flex;align-items:center;gap:10px;flex-shrink:0}
        .peek-status{padding:7px 13px;border:1px solid var(--card-border);border-radius:999px;background:#ffffff;color:var(--text-sub);font-size:.82rem;font-weight:600;white-space:nowrap}
        .peek-btn{flex-shrink:0;align-self:center;min-height:32px;padding:0 12px;border:1px solid #e3d3a8;border-radius:999px;background:#fff8e6;color:#7a5f00;font:700 .78rem var(--font);cursor:pointer}.peek-btn:hover{background:#fdeec4}.peek-btn:disabled{opacity:.35;cursor:not-allowed}.peek-btn:focus-visible{outline:3px solid #b28f00;outline-offset:3px}
        #studyPanel .passage,#quizPanel .passage{padding:18px 20px;border:1px solid var(--card-border);background:#faf6ee;font:1.05rem/1.7 var(--font)}
        .passage .passage-line{display:flex;gap:12px;align-items:flex-start;margin:0;padding:8px 0}.passage .passage-line+.passage-line{border-top:1px dashed #e6dccb}
        .line-no{flex:0 0 26px;height:26px;margin-top:1px;border-radius:50%;background:rgba(35,132,92,.12);color:var(--accent);font-size:.8rem;font-weight:800;line-height:26px;text-align:center}
        .line-text{flex:1;min-width:0}.passage .translation{margin:4px 0 0;color:var(--text-sub);font:.9rem/1.6 var(--font)}
        #studyPanel .study-grid{margin-top:18px;align-items:start}
        #studyPanel .study-box{border:1px solid var(--card-border);background:#ffffff;box-shadow:var(--ss-shadow)}
        #studyPanel .study-box h3{margin:0 0 6px;font-size:.8rem;font-weight:800;letter-spacing:.5px;color:var(--text-sub)}
        #vocabulary{margin:0}#vocabulary li{padding:10px 0;border-bottom:1px solid #f1eadc}#vocabulary li:last-child{border-bottom:0}
        .word-controls{gap:8px}.word-controls .reading-word{margin-right:0;font-size:1.05rem;color:var(--text)}
        .shell .word-controls a.word-book-link{margin-right:auto;padding:2px 9px;border-radius:999px;background:rgba(35,132,92,.08);color:var(--accent);font-size:.74rem;font-weight:700;text-decoration:none}
        .word-controls:not(:has(.word-book-link)) .reading-word{margin-right:auto}
        .word-controls button.meaning-btn{min-height:38px;padding:0 14px;border:1px solid var(--card-border);border-radius:999px;color:var(--text-sub);font-size:.84rem;font-weight:600}
        .word-controls button.meaning-btn[aria-expanded="true"]{border-color:var(--accent);background:rgba(35,132,92,.08);color:var(--accent)}
        .word-controls .audio-icon{width:38px;height:38px;padding:8px!important}.word-controls .audio-icon svg{width:18px;height:18px}
        .word-meaning{margin:8px 0 0;padding:8px 12px;border-radius:10px;background:#fff8e6;color:#7a5f00;font-size:.92rem}
        #grammarNotes p{margin:6px 0 12px;padding:12px 14px;border-left:3px solid var(--accent);border-radius:0 10px 10px 0;background:#f6f9f6;line-height:1.6}#grammarNotes b{display:block;margin-bottom:2px;color:var(--text)}#grammarNotes br{display:none}
        #grammarLinks{display:flex;flex-wrap:wrap;gap:8px}.shell #grammarLinks a{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border:1px solid var(--accent);border-radius:999px;color:var(--accent);font-size:.85rem;font-weight:700;text-decoration:none}.shell #grammarLinks a::before{content:"📘";margin-right:6px}.shell #grammarLinks a:hover{background:rgba(35,132,92,.08)}
        #studyPanel .actions button{border-radius:12px;font-weight:700}
        @media(max-width:680px){#studyPanel .passage-head{flex-direction:row;align-items:flex-start}.passage-tools{flex-direction:column-reverse;align-items:flex-end;gap:8px}}

<body><main class="shell">

    <header class="hero"><div class="muted">ENGLISH READING</div><h1>영어 독해</h1><p>문장 근거를 찾아 읽고, 단어와 문법을 함께 연결해요.</p></header>
    <div id="studyTimerBar" aria-live="polite"></div>
    <div id="levelTabs" class="tabs" aria-label="독해 레벨 선택"></div>
    <div id="gradeTabs" class="tabs" aria-label="학년 선택" hidden></div>
    <div id="unitTabs" class="tabs" aria-label="단원 선택"></div>
    <label for="passageSelect">지문 선택</label>
    <select id="passageSelect" style="display:block;width:100%;max-width:620px;padding:12px;margin:8px 0 18px;border:1px solid #ddd2bf;border-radius:12px;background:#fff;color:#2b2620;font:inherit"></select>
    <p id="adaptiveNotice" class="notice" role="status"></p><p id="recommendationNotice" class="notice" role="status"></p>
    <section id="studyPanel" class="card">
        <div class="passage-head"><div><span id="passageMeta" class="muted"></span><h2 id="passageTitle"></h2></div><div class="passage-tools"><span id="peekStatus" class="peek-status" title="막히는 문장만 지문당 2문장까지 해석을 볼 수 있어요"></span><button id="listenPassage" class="audio-icon" type="button" aria-label="지문 전체 듣기 또는 정지" title="지문 듣기 · 다시 누르면 정지" aria-pressed="false"></button></div></div>
        <div id="studyPassage" class="passage"></div>
        <div class="study-grid"><article class="study-box"><h3><span aria-hidden="true">📚</span> 핵심 단어</h3><ul id="vocabulary"></ul></article><article class="study-box"><h3><span aria-hidden="true">✏️</span> 문법 포인트</h3><div id="grammarNotes"></div><div id="grammarLinks"></div></article></div>
        <div class="actions"><button id="prevPassage">← 이전 지문</button><button id="nextPassage">다음 지문 →</button><button id="practiceQuiz" class="primary">이 지문 연습</button><button id="freshAssessment" class="primary">미학습 지문 평가</button></div>
    </section>
    <section id="quizPanel" class="card" hidden>
        <div class="quiz-head"><span id="quizProgress"></span><strong id="quizScore"></strong></div><h2 id="quizPassageTitle"></h2><div id="quizPassage" class="passage"></div>
        <h3 id="quizQuestion" class="quiz-question"></h3>
        <button id="toggleQuizTranslation" type="button" aria-expanded="false" aria-controls="quizTranslation" hidden>번역 보기</button>
        <div id="quizTranslation" class="feedback" hidden></div>
        <div id="quizChoices" class="choices"></div><div id="quizFeedback" class="feedback" hidden></div>
        <div class="actions"><button id="showHint">근거 힌트</button><button id="nextQuestion" class="primary" hidden>다음 문제</button><button id="backToStudy">학습으로 돌아가기</button></div>
    </section>
    <section id="resultModal" class="modal" hidden><div class="modal-inner"><h2>독해 결과</h2><p id="resultScore"></p><p id="initialScoreNote"></p><p id="resultMessage"></p><div class="actions"><button id="retryWrong" class="primary">틀린 문제 다시 풀기</button><button id="closeResult">학습으로 돌아가기</button><a href="report.html">통합 성적표</a></div></div></section>
</main>
