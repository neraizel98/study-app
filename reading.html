    <style>
        :root{--reading:#fe0126;--reading2:#b17003}
        body{min-height:100vh;background:radial-gradient(circle at top,#ffffff 0,#ffffff 48%,#fbf7ef 100%);color:var(--text)}
        .reading-shell{width:min(1050px,94%);margin:0 auto;padding:28px 0 70px}.top-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top-nav a{color:#2b2620;text-decoration:none}
        .hero{padding:28px;border-radius:24px;background:linear-gradient(135deg,rgba(254,62,90,0.18),rgba(197,125,3,0.12));border:1px solid rgba(254,62,90,0.364);box-shadow:0 20px 50px rgba(43,38,32,0.077)}.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,48px)}.hero p{margin:0;color:#2b2620}
        .mode-toggle{display:flex;justify-content:center;gap:10px;margin:22px 0 8px}.mode-toggle .mode-btn{border:1px solid #ddd2bf;background:#ffffff;color:#2b2620;border-radius:14px;padding:13px 24px;font-weight:800;cursor:pointer}
        .unit-tabs,.lesson-tabs,.level-selector,.grade-selector{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;padding:14px 2px}.grade-selector{padding:0 2px 5px}.unit-tabs{padding-top:20px}.lesson-tabs{padding-bottom:20px}.unit-btn,.lesson-btn,.level-btn,.grade-btn{border:1px solid #ddd2bf;background:#ffffff;color:#2b2620;padding:11px 16px;border-radius:999px;cursor:pointer}.active{background:linear-gradient(135deg,var(--reading),var(--reading2))!important;color:#ffffff!important;border-color:transparent!important;font-weight:800}
        .card{background:#ffffff;border:1px solid #ddd2bf;border-radius:22px;padding:clamp(20px,4vw,38px);line-height:1.75}.card>.label{margin-bottom:6px}.card h2{margin:0 0 18px;line-height:1.35}.card h3{margin:28px 0 14px;line-height:1.45}.label{color:#eb001d;font-weight:900}.principle{font-size:1.18rem;line-height:1.85;padding:19px 20px;border-left:4px solid var(--reading);background:rgba(254,62,90,0.08);border-radius:12px;margin:0 0 24px}.rules{display:grid;gap:13px;list-style:none;padding:0}.rules li{padding:15px 17px;border-radius:12px;background:#ffffff;line-height:1.7}.study-examples{display:grid;gap:18px}.study-example{padding:20px;border-radius:15px;background:rgba(197,125,3,0.08);border:1px solid rgba(207,131,3,0.26)}.study-example strong{display:block;color:#956c00;margin-bottom:12px;line-height:1.5}.study-example-text{white-space:pre-line;line-height:2;color:#2b2620}.study-example-analysis{margin:15px 0 0;padding:13px 15px;border-radius:10px;background:rgba(35,132,92,0.09);color:#23845c;line-height:1.85}.tip{margin-top:18px;padding:17px;border-radius:12px;background:rgba(197,125,3,0.09);line-height:1.8;color:#8f7200}
        .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.actions button,.primary{border:0;border-radius:12px;padding:13px 18px;background:#ffffff;color:#2b2620;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--reading),var(--reading2));color:#ffffff}
        .passage-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.passage-meta{color:#eb001d;font-size:.85rem;font-weight:700}.passage{margin:20px 0;padding:22px;background:#ffffff;color:#2b2620;border-radius:16px;line-height:1.9;font-family:Georgia,'Noto Serif KR',serif}.passage p{margin:0 0 9px}.line-no{display:inline-block;width:25px;color:#926d5a;font-size:.78rem}.source-note{font-size:.75rem;color:#968c7e;text-align:right}
        .quiz-question{font-size:1.25rem;line-height:1.55;margin:25px 0 16px}.choices{display:grid;gap:10px}.answer{display:flex;gap:12px;text-align:left;padding:14px;border:1px solid #ddd2bf;background:#ffffff;color:#2b2620;border-radius:13px;cursor:pointer}.answer span{display:grid;place-items:center;min-width:29px;height:29px;border-radius:50%;background:#ffffff}.answer.correct{border-color:#20a574;background:rgba(10,160,111,0.16)}.answer.wrong{border-color:#fe3e5a;background:rgba(249,58,91,0.15)}.feedback{margin-top:18px;padding:16px;border-radius:12px}.feedback.good{background:rgba(10,160,111,0.14)}.feedback.bad{background:rgba(249,58,91,0.14)}
        .result{position:fixed;inset:0;display:grid;place-items:center;background:#ffffff;z-index:50}.result[hidden]{display:none}.result-box{width:min(430px,90vw);padding:30px;border-radius:22px;background:#ffffff;border:1px solid #ddd2bf;text-align:center}.result-score{font-size:2.3rem;color:#eb001d;font-weight:900}
        [hidden]{display:none!important}@media(max-width:620px){.reading-shell{width:92%}.hero{padding:22px}.card h3{margin-top:24px}.principle{padding:17px;line-height:1.8}.rules{gap:10px}.study-examples{gap:14px}.study-example{padding:17px}.study-example-text{line-height:1.85}.passage-head{display:block}.actions button{flex:1}.passage{padding:16px}.unit-tabs{display:grid;grid-template-columns:1fr 1fr}.unit-btn{width:100%;padding:10px 7px}.lesson-tabs{justify-content:stretch}.lesson-btn{flex:1}}

    <div class="mode-toggle"><button id="studyModeBtn" class="mode-btn active">📚 학습 모드</button><button id="quizModeBtn" class="mode-btn">📝 퀴즈 모드</button></div>
    <div id="levelTabs" class="level-selector" aria-label="레벨 선택"></div>
    <div id="gradeTabs" class="grade-selector" aria-label="학년 선택"></div>
    <section id="unitTabs" class="unit-tabs" aria-label="독해 단원"></section>
    <section id="lessonTabs" class="lesson-tabs" aria-label="세부 학습"></section>
    <section id="studyPanel" class="card">
        <div class="label">핵심 독해 원리</div><h2 id="lessonTitle"></h2><p id="principle" class="principle"></p>
        <h3>읽는 순서</h3><ul id="rules" class="rules"></ul>
        <h3>예문으로 구조 확인하기</h3><div id="studyExamples" class="study-examples"></div><p class="tip">💡 <span id="tip"></span></p>
        <div class="actions"><button id="prevLesson">← 이전</button><button id="nextLesson">다음 →</button><button id="startQuiz" class="primary">랜덤 지문 풀기</button></div>
    </section>
    <section id="quizPanel" class="card" hidden>
        <div class="passage-head"><div><div id="passageMeta" class="passage-meta"></div><h2 id="passageTitle"></h2></div><strong id="quizProgress"></strong></div>
        <article id="passage" class="passage"></article><div id="sourceNote" class="source-note"></div>
        <div id="summaryStep" class="summary-step" hidden><label for="passageSummary">글을 끝까지 읽었다면, 한 줄로 요약해 보세요</label><textarea id="passageSummary" rows="2" maxlength="200" placeholder="누가 무엇을 왜 했는지 한 문장으로 써 보세요"></textarea><button id="summaryDone" type="button" class="summary-done" disabled>요약했어요 · 문제 풀기</button></div>
        <h3 id="quizQuestion" class="quiz-question"></h3><div id="quizChoices" class="choices"></div>
        <div id="quizFeedback" class="feedback" hidden></div>
        <div class="actions"><button id="backToStudy">학습으로 돌아가기</button><button id="nextQuestion" class="primary" hidden>다음 문제</button></div>
    </section>
</main>
<section id="resultModal" class="result" hidden><div class="result-box"><div style="font-size:55px">🏆</div><h2>독해 퀴즈 결과</h2><div id="resultScore" class="result-score"></div><p id="resultMessage"></p><div class="actions"><button id="retryQuiz" class="primary">새 지문 풀기</button><button id="resultStudy">학습으로</button><button id="shareResult">아빠에게 공유</button></div></div></section>
