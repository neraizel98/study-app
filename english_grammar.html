<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart English Grammar</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        :root{--g:#6ee7b7;--g2:#34d399;--panel:rgba(15,23,42,.86)}
        body{min-height:100vh;background:radial-gradient(circle at top,#183153 0,#0b1120 55%,#060a13 100%);color:#e5eefb}
        .grammar-shell{width:min(1050px,94%);margin:0 auto;padding:28px 0 60px}
        .grammar-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.grammar-nav a{color:#dceafe;text-decoration:none}
        .hero{padding:28px;border:1px solid rgba(110,231,183,.25);border-radius:24px;background:linear-gradient(135deg,rgba(16,185,129,.18),rgba(59,130,246,.12));box-shadow:0 20px 50px rgba(0,0,0,.22)}
        .hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,48px)}.hero p{margin:0;color:#b8c7dc}
        .mode-toggle{display:flex;justify-content:center;gap:10px;margin:22px 0 8px}.mode-btn{border:1px solid #334155;background:#111827;color:#cbd5e1;border-radius:14px;padding:13px 24px;font-weight:800;cursor:pointer}.level-selector,.unit-tabs,.lesson-tabs{display:flex;justify-content:center;gap:10px;padding:14px 2px}.level-selector{overflow:auto}.unit-tabs{flex-wrap:wrap;overflow:visible;align-items:stretch}.lesson-tabs{flex-wrap:wrap;overflow:visible}.level-btn,.unit-chip,.lesson-chip{white-space:normal;border:1px solid #334155;background:#111827;color:#cbd5e1;border-radius:999px;padding:10px 16px;cursor:pointer}.unit-chip{flex:0 1 auto;max-width:100%;line-height:1.35}.active{background:var(--g2)!important;color:#042f2e!important;border-color:var(--g)!important;font-weight:800}
        .unit-tabs{padding-top:20px}.lesson-tabs{padding-bottom:20px}.card{background:var(--panel);border:1px solid #26354a;border-radius:22px;padding:clamp(20px,4vw,38px)}
        .label{color:var(--g);font-weight:800;letter-spacing:.06em}.principle{font-size:1.2rem;line-height:1.75;padding:18px;background:rgba(52,211,153,.08);border-left:4px solid var(--g2);border-radius:12px;margin-bottom:10px}.principle-detail{font-size:1rem;line-height:1.85;color:#c7d5e7;background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.18);padding:18px;border-radius:12px;margin:0 0 22px}
        .rules{display:grid;gap:10px;padding:0;list-style:none}.rules li{display:flex;gap:12px;align-items:center;background:#111b2c;padding:14px;border-radius:12px}.rules span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#1d4ed8;font-weight:800}
        .examples{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.examples article{position:relative;background:#0f1a2b;border:1px solid #29394f;border-radius:16px;padding:18px}.examples strong{font-size:1.1rem;color:#f8fafc}.examples p{color:#aabbd0;margin-bottom:8px}.speak{border:0;background:transparent;color:#93c5fd;cursor:pointer}
        .tip{padding:16px;border-radius:12px;background:rgba(245,158,11,.1);color:#fde68a}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.actions button,.primary,.result button{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer;background:#243247;color:white}.actions .primary,.primary{background:linear-gradient(135deg,#10b981,#3b82f6)}
        .quiz-head{display:flex;justify-content:space-between;color:#a8bad0}.quiz-question{font-size:1.45rem;margin:30px 0}.choices{display:grid;gap:12px}.answer{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid #334155;background:#111b2c;color:white;border-radius:14px;padding:16px;cursor:pointer}.answer span{display:grid;place-items:center;min-width:30px;height:30px;border-radius:50%;background:#26374e}.answer.correct{border-color:#34d399;background:rgba(16,185,129,.18)}.answer.wrong{border-color:#fb7185;background:rgba(244,63,94,.15)}
        .feedback{margin-top:18px;padding:16px;border-radius:12px}.feedback.good{background:rgba(16,185,129,.14)}.feedback.bad{background:rgba(244,63,94,.13)}.result-modal{position:fixed;inset:0;background:rgba(2,6,23,.82);display:grid;place-items:center;z-index:50;padding:20px}.result-modal.hidden{display:none}.result-inner{width:min(440px,92vw);background:#111b2c;border:1px solid #334155;border-radius:24px;padding:30px;text-align:center}.result-emoji{font-size:64px}.result-score-big{font-size:2rem;font-weight:900;color:var(--g);margin:12px}.result-actions{display:grid;gap:10px;margin-top:20px}.result-actions a,.result-actions button{border:0;border-radius:12px;padding:13px;background:#243247;color:white;text-decoration:none;font-weight:800;cursor:pointer}
        [hidden]{display:none!important}@media(max-width:600px){.grammar-shell{width:92%}.card{padding:18px}.actions button{flex:1}.hero{padding:22px}.unit-tabs{display:grid;grid-template-columns:1fr 1fr}.unit-chip{width:100%;padding:10px 8px}.lesson-tabs{justify-content:stretch}.lesson-chip{flex:1}}
    </style>
</head>
<body>
    <main class="grammar-shell">
        <nav class="grammar-nav"><a href="english.html">← 영어 단어</a><a href="index.html">🏠 홈</a></nav>
        <header class="hero"><div class="label">ENGLISH GRAMMAR ROADMAP</div><h1>영어 문법</h1><p id="courseSubtitle"></p></header>
        <div class="mode-toggle">
            <button id="studyModeBtn" class="mode-btn active">📖 학습 모드</button>
            <button id="quizModeBtn" class="mode-btn">🔍 퀴즈 모드</button>
        </div>
        <section id="stageTabs" class="level-selector" aria-label="레벨 선택"></section>
        <section id="unitTabs" class="unit-tabs" aria-label="문법 단원"></section>
        <section id="lessonTabs" class="lesson-tabs" aria-label="세부 학습"></section>

        <section id="studyPanel" class="card">
            <div class="label">핵심 원리</div><h2 id="lessonTitle"></h2><p id="principle" class="principle"></p><p id="principleDetail" class="principle-detail"></p>
            <h3>규칙을 단계별로 이해하기</h3><ul id="rules" class="rules"></ul>
            <h3>교과서 예문</h3><div id="examples" class="examples"></div>
            <p class="tip">💡 <span id="tip"></span></p>
            <div class="actions"><button id="prevLesson">← 이전</button><button id="nextLesson">다음 →</button><button id="startQuiz" class="primary">단원 퀴즈 풀기</button></div>
        </section>

        <section id="quizPanel" class="card" hidden>
            <div class="quiz-head"><span id="quizProgress"></span><strong id="quizScore">0점</strong></div>
            <h2 id="quizQuestion" class="quiz-question"></h2><div id="quizChoices" class="choices"></div>
            <div id="quizFeedback" class="feedback" hidden></div>
            <div class="actions"><button id="backToStudy">학습으로 돌아가기</button><button id="nextQuestion" class="primary" hidden>다음 문제</button></div>
        </section>
        <div id="resultModal" class="result-modal hidden">
            <div class="result-inner">
                <div class="result-emoji" id="resultEmoji">🏆</div>
                <h2 id="resultTitle">문법 마스터!</h2>
                <div class="result-score-big" id="resultScore">10 / 10점</div>
                <p id="resultMessage"></p>
                <div class="result-actions">
                    <button id="retryBtn">다시 시작하기</button>
                    <a href="report.html">📊 통합 성적표</a>
                    <button id="studyAgainBtn">학습 모드로 돌아가기</button>
                    <a href="index.html">🏠 메인 페이지로</a>
                </div>
            </div>
        </div>
    </main>
    <script src="utils.js"></script>
    <script src="report.js"></script>
    <script src="study-timer.js?v=20260728-three-scores"></script>
    <script src="EnglishGrammarData.js?v=20260727-grammar1"></script>
    <script src="EnglishGrammarQuiz.js?v=20260728-variety"></script>
    <script src="EnglishGrammarApp.js?v=20260728-three-scores"></script>
    <script src="version-check.js"></script>
</body>
</html>
