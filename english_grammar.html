<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart English Grammar</title>
    <link rel="stylesheet" href="styles.css?v=20261014-redesign">
    <style>
        :root{--g:#148f5e;--g2:#1c8f65;--panel:#ffffff}
        body{min-height:100vh;background:radial-gradient(circle at top,#ecf5ef 0,#fbf7ef 55%,#fbf7ef 100%);color:#2b2620}
        .grammar-shell{width:min(1050px,94%);margin:0 auto;padding:28px 0 60px}
        .grammar-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.grammar-nav a{color:#2b2620;text-decoration:none}
        .hero{padding:28px;border:1px solid rgba(23,165,109,0.325);border-radius:24px;background:linear-gradient(135deg,rgba(10,160,111,0.18),rgba(35,132,92,0.12));box-shadow:0 20px 50px rgba(43,38,32,0.077)}
        .hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,48px)}.hero p{margin:0;color:#6e6559}
        .mode-toggle{display:flex;justify-content:center;gap:10px;margin:22px 0 8px}.mode-btn{border:1px solid #ddd2bf;background:#ffffff;color:#2b2620;border-radius:14px;padding:13px 24px;font-weight:800;cursor:pointer}.level-selector,.unit-tabs,.lesson-tabs{display:flex;justify-content:center;gap:10px;padding:14px 2px}.level-selector{overflow:auto}.unit-tabs{flex-wrap:wrap;overflow:visible;align-items:stretch}.lesson-tabs{flex-wrap:wrap;overflow:visible}.level-btn,.unit-chip,.lesson-chip{white-space:normal;border:1px solid #ddd2bf;background:#ffffff;color:#2b2620;border-radius:999px;padding:10px 16px;cursor:pointer}.unit-chip{flex:0 1 auto;max-width:100%;line-height:1.35}.active{background:var(--g2)!important;color:#ffffff!important;border-color:var(--g)!important;font-weight:800}
        .unit-tabs{padding-top:20px}.lesson-tabs{padding-bottom:20px}.card{background:var(--panel);border:1px solid #ede5d6;border-radius:22px;padding:clamp(20px,4vw,38px);line-height:1.75}.card>.label{margin-bottom:6px}.card h2{margin:0 0 18px;line-height:1.35}.card h3{margin:28px 0 14px;line-height:1.45}
        .label{color:var(--g);font-weight:800;letter-spacing:.06em}.principle{font-size:1.2rem;line-height:1.85;padding:19px 20px;background:rgba(31,161,113,0.08);border-left:4px solid var(--g2);border-radius:12px;margin:0 0 14px}.principle-detail{font-size:1rem;line-height:1.95;color:#2b2620;background:rgba(35,132,92,0.08);border:1px solid rgba(35,132,92,0.234);padding:20px;border-radius:12px;margin:0 0 24px}
        .rules{display:grid;gap:13px;padding:0;list-style:none}.rules li{display:flex;gap:12px;align-items:center;background:#ffffff;padding:16px;border-radius:12px;line-height:1.7}.rules span{display:grid;place-items:center;flex:0 0 28px;width:28px;height:28px;border-radius:50%;background:#23845c;font-weight:800}
        .examples{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.examples article{position:relative;background:#ffffff;border:1px solid #ede5d6;border-radius:16px;padding:20px;line-height:1.8}.examples strong{font-size:1.1rem;color:#2b2620;line-height:1.5}.examples p{color:#6e6559;margin:10px 0;line-height:1.8}.accent-listen{display:flex;gap:8px;flex-wrap:wrap}.speak{border:1px solid #ddd2bf;border-radius:999px;background:#ffffff;color:#23845c;padding:8px 11px;cursor:pointer}
        .tip{margin-top:18px;padding:17px;border-radius:12px;background:rgba(197,125,3,0.1);color:#8f7200;line-height:1.8}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.actions button,.primary,.result button{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer;background:#ffffff;color:#2b2620}.actions .primary,.primary{background:linear-gradient(135deg,#08845b,#23845c)}
        .quiz-head{display:flex;justify-content:space-between;color:#6e6559}.quiz-question{font-size:1.45rem;margin:30px 0}.choices{display:grid;gap:12px}.answer{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid #ddd2bf;background:#ffffff;color:#2b2620;border-radius:14px;padding:16px;cursor:pointer}.answer span{display:grid;place-items:center;min-width:30px;height:30px;border-radius:50%;background:#ffffff}.answer.correct{border-color:#20a574;background:rgba(10,160,111,0.18)}.answer.wrong{border-color:#fe3e5a;background:rgba(249,58,91,0.15)}
        .feedback{margin-top:18px;padding:16px;border-radius:12px}.feedback.good{background:rgba(10,160,111,0.14)}.feedback.bad{background:rgba(249,58,91,0.13)}.result-modal{position:fixed;inset:0;background:rgba(43,38,32,0.45);display:grid;place-items:center;z-index:50;padding:20px}.result-modal.hidden{display:none}.result-inner{width:min(440px,92vw);background:#ffffff;border:1px solid #ddd2bf;border-radius:24px;padding:30px;text-align:center}.result-emoji{font-size:64px}.result-score-big{font-size:2rem;font-weight:900;color:var(--g);margin:12px}.result-actions{display:grid;gap:10px;margin-top:20px}.result-actions a,.result-actions button{border:0;border-radius:12px;padding:13px;background:#ffffff;color:#2b2620;text-decoration:none;font-weight:800;cursor:pointer}
        [hidden]{display:none!important}@media(max-width:600px){.grammar-shell{width:92%}.card{padding:18px}.card h3{margin-top:24px}.principle{padding:17px;line-height:1.8}.principle-detail{padding:17px;line-height:1.85}.rules{gap:10px}.examples{gap:14px}.examples article{padding:17px}.actions button{flex:1}.hero{padding:22px}.unit-tabs{display:grid;grid-template-columns:1fr 1fr}.unit-chip{width:100%;padding:10px 8px}.lesson-tabs{justify-content:stretch}.lesson-chip{flex:1}}
    </style>
<link rel="stylesheet" href="today-flow.css?v=20261014-redesign"><link rel="stylesheet" href="theme.css?v=20261014-mock-admin"></head>
<body>
    <main class="grammar-shell">
        <nav class="grammar-nav"><a href="english.html">← 영어 단어</a><a href="index.html">🏠 홈</a></nav>
        <header class="hero"><div class="label">ENGLISH GRAMMAR ROADMAP</div><h1>영어 문법</h1><p id="courseSubtitle"></p></header>
        <div class="mode-toggle">
            <button id="studyModeBtn" class="mode-btn active">📖 학습 모드</button>
            <button id="quizModeBtn" class="mode-btn">🔍 퀴즈 모드</button>
        </div>
        <section id="stageTabs" class="level-selector" aria-label="레벨 선택"></section>
        <section id="unitTabs" class="unit-tabs" aria-label="문법 단원"></section>
        <section id="lessonTabs" class="lesson-tabs" aria-label="세부 학습"></section>

        <section id="studyPanel" class="card">
            <div class="label">핵심 원리</div><h2 id="lessonTitle"></h2><p id="principle" class="principle"></p><p id="principleDetail" class="principle-detail"></p>
            <h3>규칙을 단계별로 이해하기</h3><ul id="rules" class="rules"></ul>
            <h3>교과서 예문</h3><div id="examples" class="examples"></div>
            <p class="tip">💡 <span id="tip"></span></p>
            <div class="actions"><button id="prevLesson">← 이전</button><button id="nextLesson">다음 →</button><button id="startQuiz" class="primary">단원 퀴즈 풀기</button></div>
        </section>

        <section id="quizPanel" class="card" hidden>
            <div class="quiz-head"><span id="quizProgress"></span><strong id="quizScore">0점</strong></div>
            <h2 id="quizQuestion" class="quiz-question"></h2>
            <div id="quizChoices" class="choices"></div>
            <div id="quizTypedArea" hidden style="max-width:720px;margin:0 auto 18px;">
                <div id="quizWordBank" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px;"></div>
                <div style="display:flex;gap:10px;">
                    <input id="quizTypedInput" type="text" autocomplete="off" placeholder="정답을 영어로 입력하세요"
                           style="flex:1;padding:14px;border-radius:12px;border:1px solid var(--card-border);background:#ffffff;color:var(--text);font:inherit;">
                    <button id="quizTypedSubmit" class="primary">정답 확인</button>
                </div>
            </div>
            <div id="quizFeedback" class="feedback" hidden></div>
            <div class="actions"><button id="backToStudy">학습으로 돌아가기</button><button id="nextQuestion" class="primary" hidden>다음 문제</button></div>
        </section>
        <div id="resultModal" class="result-modal hidden">
            <div class="result-inner">
                <div class="result-emoji" id="resultEmoji">🏆</div>
                <h2 id="resultTitle">문법 마스터!</h2>
                <div class="result-score-big" id="resultScore">10 / 10점</div>
                <p id="resultMessage"></p>
                <div class="result-actions">
                    <button id="retryBtn">다시 시작하기</button>
                    <a href="report.html">📊 통합 성적표</a>
                    <button id="studyAgainBtn">학습 모드로 돌아가기</button>
                    <a href="index.html">🏠 메인 페이지로</a>
                </div>
            </div>
        </div>
    </main>
    <script src="utils.js?v=20260911-adaptive"></script>
    <script src="storage-keys.js"></script><script src="storage-events.js"></script><script src="schema-migrations.js"></script><script src="durable-store.js?v=20260917-storage2"></script><script src="local-repository.js?v=20260928-record-reliability"></script><script src="app-bootstrap.js"></script>
    <script src="concept-mastery.js?v=20260930-mastery"></script><script src="report.js?v=20261014-ui-rollback"></script>
    <script src="study-timer.js?v=20260930-shared-subjects"></script>
    <script src="firebase-config.js"></script><script src="firebase-client.js"></script><script src="firestore-repository.js?v=20261014-ui-rollback"></script><script src="partition-repository.js?v=20260928-record-reliability"></script><script src="notification-client.js?v=20260924-notification-click"></script>
    <script src="EnglishGrammarData.js?v=20260911-content-accuracy"></script>
    <script src="english-speech.js?v=20261014-redesign"></script>
    <script src="EnglishGrammarQuiz.js?v=20260911-adaptive"></script>
    <script src="EnglishGrammarApp.js?v=20261014-ui-rollback"></script>
    <script src="version-check.js?v=20261014-redesign"></script>
<a href="english_course.html" style="position:fixed;left:12px;bottom:12px;z-index:900;background:#ffffff;color:#23845c;border:1px solid #6999b8;border-radius:22px;padding:10px 14px;text-decoration:none;font-size:13px;box-shadow:0 4px 12px rgba(43,38,32,0.105)">← 영어 학습 순서</a><script src="weekly-schedule.js"></script><script src="learning-plan.js?v=20261014-plan-fix"></script><script src="unified-learning.js?v=20261007-flow"></script><script src="today-journey.js?v=20261012-journey"></script><script src="today-flow.js?v=20261007-flow"></script><script src="answer-validation.js"></script><script src="quiz-exposure.js"></script></body>
</html>
