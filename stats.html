<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1117">
    <title>학습 통계 - Smart Study</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 60px;
        }
        .blob { pointer-events: none; }
        .stats-wrap {
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        /* ── Header ── */
        .page-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-top: 10px;
        }
        .back-btn, .report-link {
            text-decoration: none;
            color: var(--text-sub);
            font-size: 0.85rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 6px 14px;
            border-radius: 20px;
            transition: color 0.2s, border-color 0.2s;
            white-space: nowrap;
        }
        .back-btn:hover, .report-link:hover { color: var(--accent); border-color: var(--accent); }
        .page-title { font-size: 1.5rem; font-weight: 700; flex: 1; }

        /* ── Page tabs ── */
        .page-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
        }
        .page-tab {
            padding: 9px 24px;
            border-radius: 22px;
            border: 1px solid var(--card-border);
            background: transparent;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 0.92rem;
            font-family: var(--font);
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .page-tab.active {
            background: rgba(79,172,254,0.15);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ── Week nav ── */
        .week-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 20px;
        }
        .week-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text);
            width: 36px; height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            font-family: var(--font);
            transition: border-color 0.2s, transform 0.1s;
            display: flex; align-items: center; justify-content: center;
        }
        .week-btn:hover:not(:disabled) { border-color: var(--accent); transform: scale(1.1); }
        .week-btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; }
        .week-label {
            font-size: 1rem; font-weight: 600;
            min-width: 190px; text-align: center;
        }

        /* ── Summary cards ── */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .summary-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px 12px;
            text-align: center;
        }
        .s-icon  { font-size: 1.5rem; margin-bottom: 6px; line-height: 1; }
        .s-value { font-size: 1.4rem; font-weight: 700; }
        .s-label { font-size: 0.73rem; color: var(--text-sub); margin-top: 4px; }

        /* ── Chart card ── */
        .chart-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 22px 24px;
            margin-bottom: 20px;
        }
        .chart-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 3px; }
        .chart-sub   { font-size: 0.78rem; color: var(--text-sub); margin-bottom: 16px; }
        .chart-wrap  { position: relative; height: 220px; }
        .chart-empty {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; color: var(--text-sub);
            pointer-events: none;
        }

        /* ── Subject tabs (level chart) ── */
        .subj-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .subj-tab {
            padding: 5px 16px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            background: transparent;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 0.85rem;
            font-family: var(--font);
            transition: all 0.2s;
        }
        .subj-tab.active {
            background: rgba(79,172,254,0.15);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 700;
        }

        /* ── Recent sessions ── */
        .session-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .session-row:last-child { border-bottom: none; }
        .session-badge {
            width: 36px; height: 36px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; flex-shrink: 0;
        }
        .session-info  { flex: 1; min-width: 0; }
        .session-name  { font-size: 0.88rem; font-weight: 600; }
        .session-level { font-size: 0.76rem; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .session-meta  { margin-top:3px; font-size:0.72rem; color:var(--text-sub); }
        .session-score { font-size: 1rem; font-weight: 700; flex-shrink: 0; }
        .session-date  { font-size: 0.72rem; color: var(--text-sub); flex-shrink: 0; }
        .quiz-unit-tabs { display:flex; gap:7px; flex-wrap:wrap; margin:0 0 14px; }
        .quiz-unit-btn { border:1px solid var(--card-border); border-radius:16px; background:rgba(255,255,255,0.03); color:var(--text-sub); padding:5px 11px; cursor:pointer; font-size:0.76rem; }
        .quiz-unit-btn.active { color:#c4b5fd; border-color:#a78bfa; background:rgba(167,139,250,0.13); }
        .quiz-session-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:16px; margin-bottom:10px; overflow:hidden; }
        .quiz-session-head { width:100%; display:flex; align-items:center; gap:12px; padding:13px 15px; border:0; background:transparent; color:var(--text); text-align:left; cursor:pointer; font-family:var(--font); }
        .quiz-session-head:hover { background:rgba(255,255,255,0.03); }
        .quiz-session-toggle { color:var(--text-sub); transition:transform .2s; }
        .quiz-session-card.open .quiz-session-toggle { transform:rotate(90deg); }
        .quiz-session-detail { display:none; padding:0 15px 15px; }
        .quiz-session-card.open .quiz-session-detail { display:block; }
        .quiz-score-summary { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px; }
        .quiz-summary-chip { padding:5px 9px; border-radius:12px; background:rgba(255,255,255,0.06); font-size:0.75rem; }
        .answer-row { border:1px solid rgba(255,255,255,0.08); border-left:3px solid #56d364; border-radius:12px; padding:11px 12px; margin-top:8px; }
        .answer-row.wrong { border-left-color:#ff5f6d; background:rgba(255,95,109,0.04); }
        .answer-question { font-size:0.86rem; font-weight:700; margin-bottom:7px; line-height:1.45; }
        .answer-values { font-size:0.76rem; color:var(--text-sub); line-height:1.55; }
        .answer-explanation { margin-top:6px; font-size:0.76rem; color:#c4b5fd; line-height:1.5; }
        .detail-unavailable { color:var(--text-sub); font-size:0.8rem; padding:12px; text-align:center; background:rgba(255,255,255,0.03); border-radius:12px; }

        .empty-msg {
            text-align: center;
            padding: 36px 20px;
            color: var(--text-sub);
            font-size: 0.9rem;
            line-height: 1.7;
        }

        @media (max-width: 600px) {
            .summary-grid { grid-template-columns: repeat(2, 1fr); }
            .chart-wrap   { height: 180px; }
            .page-title   { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="stats-wrap">

        <!-- Header -->
        <div class="page-header">
            <a href="index.html" class="back-btn">← 홈</a>
            <h1 class="page-title">📈 나의 학습</h1>
        </div>

        <!-- Week nav — 공통 상단 (탭보다 위) -->
        <div class="week-nav">
            <button class="week-btn" id="prevWeekBtn" title="이전 주">‹</button>
            <span class="week-label" id="weekLabel">—</span>
            <button class="week-btn" id="nextWeekBtn" title="다음 주" disabled>›</button>
        </div>

        <!-- Page tabs -->
        <div class="page-tabs" id="pageTabs">
            <button class="page-tab active" data-tab="stats" onclick="switchStatsView('stats', this)">📈 학습 통계</button>
            <button class="page-tab" data-tab="quiz" onclick="switchStatsView('quiz', this)">📋 퀴즈 기록</button>
        </div>

        <!-- ── Stats view ── -->
        <div id="statsView">

        <!-- Summary cards -->
        <div class="summary-grid" id="summaryGrid"></div>

        <!-- Chart 1 : daily study time -->
        <div class="chart-card">
            <div class="chart-title">📅 일별 학습 시간</div>
            <div class="chart-sub">요일별 과목 학습 시간 (분, 이번 주 기준)</div>
            <div class="chart-wrap">
                <canvas id="studyTimeChart"></canvas>
                <div class="chart-empty" id="studyTimeEmpty" style="display:none">이번 주 학습 기록이 없습니다</div>
            </div>
        </div>

        <!-- Chart 2 : 8-week score trend -->
        <div class="chart-card">
            <div class="chart-title">📈 주간 점수 추이</div>
            <div class="chart-sub">최근 8주간 과목별 평균 정답률 (%)</div>
            <div class="chart-wrap">
                <canvas id="scoreTrendChart"></canvas>
                <div class="chart-empty" id="scoreTrendEmpty" style="display:none">퀴즈 기록이 없습니다</div>
            </div>
        </div>

        <!-- Chart 3 : level / unit performance -->
        <div class="chart-card">
            <div class="chart-title">🎯 레벨·단원별 달성률</div>
            <div class="subj-tabs" id="subjTabs">
                <button class="subj-tab active" data-subj="reading">📖 국어 독해력</button>
                <button class="subj-tab"        data-subj="english">🇬🇧 영어</button>
                <button class="subj-tab"        data-subj="grammar">📘 영문법</button>
                <button class="subj-tab"        data-subj="hanja">🏮 한자</button>
                <button class="subj-tab"        data-subj="math">📐 수학</button>
            </div>
            <div class="chart-wrap">
                <canvas id="levelChart"></canvas>
                <div class="chart-empty" id="levelEmpty" style="display:none">해당 과목 퀴즈 기록이 없습니다</div>
            </div>
        </div>

        <!-- Learning status -->
        <div class="chart-card">
            <div class="chart-title">📚 나의 학습 현황</div>
            <div class="chart-sub">학습한 과목·단원, 소요 시간과 퀴즈 결과를 함께 확인합니다.</div>
            <div id="recentList"></div>
        </div>

        </div><!-- #statsView -->

        <!-- ── Quiz records view ── -->
        <div id="quizView" style="display:none">
            <div class="subj-tabs" id="quizSubjTabs"></div>
            <div class="quiz-unit-tabs" id="quizUnitTabs"></div>
            <div id="quizList"></div>
        </div>

    </div><!-- .stats-wrap -->

    <script src="storage-keys.js"></script><script src="storage-events.js"></script><script src="schema-migrations.js"></script><script src="local-repository.js"></script><script src="app-bootstrap.js"></script>
    <script src="report.js?v=20260730-architecture"></script>
    <script src="firebase-client.js"></script><script src="firestore-repository.js"></script><script src="firebase-sync.js?v=20260730-architecture"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script>
    // ─────────────────────────────────────────────
    //  Constants
    // ─────────────────────────────────────────────
    const SUBJ_NAMES  = { english: '영어 단어', grammar: '영어 문법', hanja: '한자', math: '수학', reading: '국어 독해력' };
    const SUBJ_ICONS  = { english: '🇬🇧', grammar: '📘', hanja: '🏮', math: '📐', reading: '📖' };
    const SUBJ_COLOR  = {
        english: { bg: 'rgba(79,172,254,0.6)',  bd: '#4facfe' },
        grammar: { bg: 'rgba(167,139,250,0.6)', bd: '#a78bfa' },
        hanja:   { bg: 'rgba(249,130,108,0.6)', bd: '#f9826c' },
        math:    { bg: 'rgba(86,211,100,0.6)',  bd: '#56d364' },
        reading: { bg: 'rgba(251,113,133,0.6)', bd: '#fb7185' }
    };
    const DAYS = ['월','화','수','목','금','토','일'];

    const CHART_DEFAULTS = {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 350 },
        plugins: {
            legend: { labels: { color: '#f0f6fc', font: { family: 'Outfit', size: 12 }, boxWidth: 12, padding: 14 } },
            tooltip: { backgroundColor: '#161b22', titleColor: '#f0f6fc', bodyColor: '#8b949e', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1 }
        }
    };
    const AXIS_BASE = {
        ticks:  { color: '#8b949e', font: { family: 'Outfit', size: 11 } },
        grid:   { color: 'rgba(255,255,255,0.06)' },
        border: { color: 'rgba(255,255,255,0.1)' }
    };
    const SCORE_FLOOR = 50;
    const scoreFloorLabelPlugin = {
        id: 'scoreFloorLabel',
        afterDatasetsDraw(chart) {
            const { ctx } = chart;
            ctx.save();
            ctx.fillStyle = '#fca5a5';
            ctx.font = '700 11px Outfit, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            chart.data.datasets.forEach((dataset, datasetIndex) => {
                const actualScores = dataset.actualScores || [];
                const meta = chart.getDatasetMeta(datasetIndex);
                meta.data.forEach((point, index) => {
                    const actual = actualScores[index];
                    if (actual !== null && actual !== undefined && actual < SCORE_FLOOR) {
                        ctx.fillText(`${actual}`, point.x, point.y - 7);
                    }
                });
            });
            ctx.restore();
        }
    };

    // ─────────────────────────────────────────────
    //  State
    // ─────────────────────────────────────────────
    let weekOffset    = 0;   // 0 = current week
    let levelSubject  = 'reading';
    const charts      = {};

    // ─────────────────────────────────────────────
    //  Data helpers
    // ─────────────────────────────────────────────
    function loadReports() {
        const uid = UserSession.getActiveUser();
        return uid ? SmartStudy.LocalRepository.listReports(uid) : [];
    }

    function weekStart(offset) {
        const now = new Date();
        const dow = (now.getDay() + 6) % 7;  // 0=Mon
        const d   = new Date(now);
        d.setDate(now.getDate() - dow + offset * 7);
        d.setHours(0, 0, 0, 0);
        return d;
    }

    function weekRangeLabel(ws) {
        const we = new Date(ws); we.setDate(ws.getDate() + 6);
        const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
        const prefix = weekOffset === 0 ? '이번 주 · ' : '';
        return `${prefix}${ws.getFullYear()}년 ${fmt(ws)}~${fmt(we)}`;
    }

    function filterWeek(reports, ws) {
        const s = ws.getTime(), e = s + 7 * 86400000;
        return reports.filter(r => r.date >= s && r.date < e);
    }

    function pct(r) {
        return r.totalQuestions > 0 ? Math.round(r.finalScore / r.totalQuestions * 100) : 0;
    }

    // ─────────────────────────────────────────────
    //  Summary cards
    // ─────────────────────────────────────────────
    function renderSummary(weekReports) {
        const user   = UserSession.getUserData();
        const sec    = weekReports.reduce((a, r) => a + (r.timeSpentSeconds || 0), 0);
        const count  = weekReports.length;
        const avgPct = count > 0
            ? Math.round(weekReports.reduce((a, r) => a + pct(r), 0) / count)
            : 0;
        const streak = user?.attendance?.currentStreak || 0;

        const items = [
            { icon:'⏱', val: Math.round(sec / 60) + '분',  lbl:'이번 주 학습 시간' },
            { icon:'📝', val: count + '회',                  lbl:'이번 주 퀴즈 횟수' },
            { icon:'🎯', val: avgPct + '%',                  lbl:'이번 주 평균 정답률' },
            { icon:'🔥', val: streak + '일',                 lbl:'연속 출석' }
        ];
        document.getElementById('summaryGrid').innerHTML = items.map(i => `
            <div class="summary-card">
                <div class="s-icon">${i.icon}</div>
                <div class="s-value">${i.val}</div>
                <div class="s-label">${i.lbl}</div>
            </div>`).join('');
    }

    // ─────────────────────────────────────────────
    //  Chart 1 — daily study time (stacked bar)
    // ─────────────────────────────────────────────
    function buildStudyTimeChart(weekReports) {
        const d = { reading: Array(7).fill(0), english: Array(7).fill(0), grammar: Array(7).fill(0), hanja: Array(7).fill(0), math: Array(7).fill(0) };
        weekReports.forEach(r => {
            const dow = (new Date(r.date).getDay() + 6) % 7;
            if (d[r.subject] !== undefined) d[r.subject][dow] += (r.timeSpentSeconds || 0) / 60;
        });

        const hasData = weekReports.length > 0;
        document.getElementById('studyTimeEmpty').style.display = hasData ? 'none' : '';

        if (charts.studyTime) charts.studyTime.destroy();
        const ctx = document.getElementById('studyTimeChart').getContext('2d');
        charts.studyTime = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: DAYS,
                datasets: ['reading','english','grammar','hanja','math'].map(s => ({
                    label: SUBJ_NAMES[s],
                    data:  d[s].map(v => +v.toFixed(1)),
                    backgroundColor: SUBJ_COLOR[s].bg,
                    borderColor:     SUBJ_COLOR[s].bd,
                    borderWidth: 1,
                    borderRadius: 3
                }))
            },
            options: {
                ...CHART_DEFAULTS,
                scales: {
                    x: { ...AXIS_BASE, stacked: true },
                    y: { ...AXIS_BASE, stacked: true, beginAtZero: true,
                         title: { display: true, text: '분', color: '#8b949e', font: { size: 11 } } }
                }
            }
        });
    }

    // ─────────────────────────────────────────────
    //  Chart 2 — 8-week score trend (line)
    // ─────────────────────────────────────────────
    function buildScoreTrendChart(allReports) {
        const N = 8;
        const labels = [];
        const series = { reading: [], english: [], grammar: [], hanja: [], math: [] };
        let anyData = false;

        for (let i = N - 1; i >= 0; i--) {
            const ws = weekStart(weekOffset - i);
            const mn = ws.getMonth() + 1, dn = ws.getDate();
            labels.push(`${mn}/${dn}`);
            const wr = filterWeek(allReports, ws);
            ['reading','english','grammar','hanja','math'].forEach(s => {
                const sub = wr.filter(r => r.subject === s);
                if (sub.length > 0) {
                    series[s].push(Math.round(sub.reduce((a, r) => a + pct(r), 0) / sub.length));
                    anyData = true;
                } else {
                    series[s].push(null);
                }
            });
        }

        document.getElementById('scoreTrendEmpty').style.display = anyData ? 'none' : '';

        if (charts.scoreTrend) charts.scoreTrend.destroy();
        const ctx = document.getElementById('scoreTrendChart').getContext('2d');
        charts.scoreTrend = new Chart(ctx, {
            type: 'line',
            data: {
                labels,
                datasets: ['reading','english','grammar','hanja','math'].map(s => ({
                    label: SUBJ_NAMES[s],
                    data:  series[s].map(v => v === null ? null : Math.max(SCORE_FLOOR, v)),
                    actualScores: series[s],
                    borderColor:     SUBJ_COLOR[s].bd,
                    backgroundColor: SUBJ_COLOR[s].bd + '18',
                    borderWidth: 2,
                    pointRadius: 4,
                    pointBackgroundColor: SUBJ_COLOR[s].bd,
                    tension: 0.3,
                    spanGaps: false
                }))
            },
            options: {
                ...CHART_DEFAULTS,
                scales: {
                    x: { ...AXIS_BASE },
                    y: { ...AXIS_BASE, min: SCORE_FLOOR, max: 100,
                         title: { display: true, text: '%', color: '#8b949e', font: { size: 11 } } }
                }
            },
            plugins: [scoreFloorLabelPlugin]
        });
    }

    // ─────────────────────────────────────────────
    //  Chart 3 — level / unit performance (bar)
    // ─────────────────────────────────────────────
    function buildLevelChart(allReports, subject) {
        const sub = allReports.filter(r => r.subject === subject && r.totalQuestions > 0);

        // group by level key
        const map = {};
        sub.forEach(r => {
            // Math: "1. 분수의 나눗셈 - 유형명" → extract "1. 분수의 나눗셈"
            const key = subject === 'math'
                ? (r.level || '').split(' - ')[0].trim()
                : (r.level || '').trim();
            if (!key) return;
            if (!map[key]) map[key] = { sum: 0, n: 0 };
            map[key].sum += pct(r);
            map[key].n++;
        });

        let entries = Object.entries(map)
            .map(([k, v]) => ({ key: k, avg: Math.round(v.sum / v.n), n: v.n }));

        // sort
        if (subject === 'math') {
            // natural sort by leading number "1. " "2. " etc.
            entries.sort((a, b) => {
                const na = parseInt(a.key) || 999, nb = parseInt(b.key) || 999;
                return na !== nb ? na - nb : a.key.localeCompare(b.key, 'ko');
            });
            // show top 8 by attempt count if too many
            if (entries.length > 8)
                entries = entries.sort((a,b) => b.n - a.n).slice(0, 8)
                                 .sort((a,b) => (parseInt(a.key)||999) - (parseInt(b.key)||999));
        } else {
            // "레벨 1" … "레벨 4"  →  sort by trailing number
            entries.sort((a, b) => {
                const na = parseInt(a.key.replace(/\D/g,'')) || 0;
                const nb = parseInt(b.key.replace(/\D/g,'')) || 0;
                return na - nb;
            });
        }

        const isEmpty = entries.length === 0;
        document.getElementById('levelEmpty').style.display = isEmpty ? '' : 'none';

        if (charts.level) charts.level.destroy();
        const ctx = document.getElementById('levelChart').getContext('2d');
        if (isEmpty) { charts.level = null; ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height); return; }

        const isHorizontal = subject === 'math';  // horizontal bars look better with long unit names
        const c = SUBJ_COLOR[subject];
        charts.level = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: entries.map(e => e.key),
                datasets: [{
                    label: SUBJ_NAMES[subject] + ' 평균 정답률',
                    data:  entries.map(e => Math.max(SCORE_FLOOR, e.avg)),
                    actualScores: entries.map(e => e.avg),
                    backgroundColor: c.bg,
                    borderColor:     c.bd,
                    borderWidth: 1,
                    borderRadius: 4
                }]
            },
            options: {
                ...CHART_DEFAULTS,
                indexAxis: isHorizontal ? 'y' : 'x',
                scales: {
                    x: { ...AXIS_BASE, ...(isHorizontal ? { min:SCORE_FLOOR, max:100, title:{ display:true, text:'%', color:'#8b949e', font:{size:11} } } : {}) },
                    y: { ...AXIS_BASE, ...(!isHorizontal ? { min:SCORE_FLOOR, max:100, title:{ display:true, text:'%', color:'#8b949e', font:{size:11} } } : {}) }
                },
                plugins: { ...CHART_DEFAULTS.plugins, legend: { display: false } }
            },
            plugins: [scoreFloorLabelPlugin]
        });
    }

    // ─────────────────────────────────────────────
    //  Recent sessions list
    // ─────────────────────────────────────────────
    function renderRecent(weekReports) {
        const el = document.getElementById('recentList');
        const rows = [...weekReports].sort((a,b) => b.date - a.date);
        if (!rows.length) {
            el.innerHTML = '<div class="empty-msg">이 기간의 퀴즈 기록이 없습니다.<br>퀴즈를 풀면 여기에 기록이 쌓여요! 📝</div>';
            return;
        }
        el.innerHTML = rows.map(r => {
            const p = pct(r);
            const scoreColor = p >= 80 ? '#56d364' : p >= 50 ? '#f9826c' : '#ff5f6d';
            const c = SUBJ_COLOR[r.subject] || { bg:'rgba(255,255,255,0.1)', bd:'#888' };
            const d = new Date(r.date);
            const ds = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            const levelShort = r.level ? (r.level.length > 18 ? r.level.slice(0,18) + '…' : r.level) : '-';
            const sec = r.timeSpentSeconds || 0;
            const timeStr = sec > 0 ? `${Math.floor(sec / 60)}분 ${sec % 60 ? `${sec % 60}초` : ''}`.trim() : '시간 기록 없음';
            const quizStatus = r.isCompleted ? '완료' : '진행 중';
            return `
                <div class="session-row">
                    <div class="session-badge" style="background:${c.bd}22; color:${c.bd}">${SUBJ_ICONS[r.subject] || '📚'}</div>
                    <div class="session-info">
                        <div class="session-name">${SUBJ_NAMES[r.subject] || r.subject}</div>
                        <div class="session-level">학습 내용 · ${levelShort}</div>
                        <div class="session-meta">⏱ ${timeStr} · 📝 퀴즈 ${quizStatus}</div>
                    </div>
                    <div class="session-score" style="color:${scoreColor}" title="퀴즈 점수">${p}%</div>
                    <div class="session-date">${ds}</div>
                </div>`;
        }).join('');
    }

    // ─────────────────────────────────────────────
    //  Main render
    // ─────────────────────────────────────────────
    function render() {
        const all  = loadReports();
        const ws   = weekStart(weekOffset);
        const week = filterWeek(all, ws);

        document.getElementById('weekLabel').textContent    = weekRangeLabel(ws);
        document.getElementById('nextWeekBtn').disabled     = weekOffset >= 0;

        renderSummary(week);
        buildStudyTimeChart(week);
        buildScoreTrendChart(all);
        buildLevelChart(all, levelSubject);
        renderRecent(week);

        // 퀴즈 기록 탭이 활성화 상태면 해당 주 데이터로 함께 갱신
        if (document.getElementById('quizView').classList.contains('view-active')) {
            renderQuizList(week, _quizSubj);
        }
    }

    // ─────────────────────────────────────────────
    //  퀴즈 기록 탭 렌더링
    // ─────────────────────────────────────────────
    let _quizSubj = 'all';
    let _quizUnit = 'all';

    function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => ({
            '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
        })[ch]);
    }

    function unitName(report) {
        return report.metadata?.unitTitle
            || (report.subject === 'math' ? (report.level || '').split(' - ')[0].trim() : report.level)
            || '기본';
    }

    function sessionAttempts(report) {
        if (Array.isArray(report.metadata?.attempts) && report.metadata.attempts.length) {
            return report.metadata.attempts;
        }
        const result = [];
        const items = WrongNote.getAll()[report.subject] || [];
        items.forEach(item => {
            const history = (item.history || []).filter(entry => entry.sessionId === report.sessionId);
            history.forEach(entry => result.push({
                question: entry.question || item.question || item.word || item.hanja || item.type || '문제',
                selectedAnswer: item.selectedAnswer ?? '-',
                correctAnswer: item.correctAnswer ?? entry.answer ?? item.answer ?? '-',
                correct: entry.status === 'correct',
                explanation: entry.explanation || item.explanation || item.meaning || ''
            }));
        });
        return result;
    }

    function renderQuizSubjectTabs(reports) {
        const subjects = SubjectRegistry.list({ reports, wrongAnswers: WrongNote.getAll() });
        document.getElementById('quizSubjTabs').innerHTML = [
            `<button class="subj-tab ${_quizSubj === 'all' ? 'active' : ''}" data-subj="all">전체</button>`,
            ...subjects.map(subject => `<button class="subj-tab ${_quizSubj === subject.id ? 'active' : ''}" data-subj="${escapeHTML(subject.id)}">${subject.icon} ${escapeHTML(subject.name)}</button>`)
        ].join('');
    }

    function renderUnitTabs(reports) {
        const scoped = _quizSubj === 'all' ? reports : reports.filter(report => report.subject === _quizSubj);
        const units = [...new Set(scoped.map(unitName).filter(Boolean))];
        if (_quizUnit !== 'all' && !units.includes(_quizUnit)) _quizUnit = 'all';
        document.getElementById('quizUnitTabs').innerHTML = [
            `<button class="quiz-unit-btn ${_quizUnit === 'all' ? 'active' : ''}" data-unit="all">전체 단원</button>`,
            ...units.map(unit => `<button class="quiz-unit-btn ${_quizUnit === unit ? 'active' : ''}" data-unit="${escapeHTML(unit)}">${escapeHTML(unit)}</button>`)
        ].join('');
    }

    function renderQuizList(allReports, subjFilter) {
        const el = document.getElementById('quizList');
        let rows = [...allReports].sort((a, b) => b.date - a.date);
        if (subjFilter !== 'all') rows = rows.filter(r => r.subject === subjFilter);
        if (_quizUnit !== 'all') rows = rows.filter(report => unitName(report) === _quizUnit);
        renderUnitTabs(allReports);

        if (!rows.length) {
            el.innerHTML = '<div class="empty-msg">퀴즈 기록이 없습니다.<br>퀴즈를 풀면 여기에 기록이 쌓여요! 📝</div>';
            return;
        }

        const html = rows.map((r, rowIndex) => {
            const p = pct(r);
            const scoreColor = p >= 80 ? '#56d364' : p >= 50 ? '#f9826c' : '#ff5f6d';
            const c = SUBJ_COLOR[r.subject] || { bg:'rgba(255,255,255,0.1)', bd:'#888' };
            const subjectInfo = SubjectRegistry.get(r.subject);
            const d = new Date(r.date);
            const ds = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            const sec = r.timeSpentSeconds || 0;
            const timeStr = sec > 0 ? `${Math.floor(sec/60)}분 ${sec%60 ? sec%60+'초' : ''}`.trim() : '';
            const roundBadge = r.round > 1
                ? `<span style="font-size:0.68rem;color:${c.bd};background:${c.bd}22;padding:2px 7px;border-radius:10px;margin-left:6px;">${r.round}회차</span>`
                : '';
            const level = unitName(r);
            const attempts = sessionAttempts(r);
            const correctCount = attempts.filter(attempt => attempt.correct).length;
            const wrongCount = attempts.filter(attempt => !attempt.correct).length;
            const attemptHTML = attempts.length ? attempts.map((attempt, index) => `
                <div class="answer-row ${attempt.correct ? '' : 'wrong'}">
                    <div class="answer-question">${attempt.correct ? '✅' : '❌'} Q${index + 1}. ${escapeHTML(attempt.question || '문제')}</div>
                    <div class="answer-values">
                        선택한 답: <strong>${escapeHTML(attempt.selectedAnswer ?? '-')}</strong><br>
                        정답: <strong>${escapeHTML(attempt.correctAnswer ?? '-')}</strong>
                    </div>
                    ${attempt.explanation ? `<div class="answer-explanation">💡 ${escapeHTML(attempt.explanation)}</div>` : ''}
                </div>`).join('') : `
                <div class="detail-unavailable">
                    이 기록은 상세 문항 저장 기능 적용 전에 생성되어 점수만 확인할 수 있습니다.
                </div>`;
            return `
                <div class="quiz-session-card" data-row="${rowIndex}">
                    <button class="quiz-session-head" type="button">
                        <span class="quiz-session-toggle">▶</span>
                        <span class="session-badge" style="background:${c.bd}22;color:${c.bd}">${subjectInfo.icon}</span>
                        <span class="session-info">
                            <span class="session-name">${escapeHTML(subjectInfo.name)}${roundBadge}</span>
                            <span class="session-level">${escapeHTML(level)}</span>
                        </span>
                        <span style="text-align:right;flex-shrink:0;">
                            <span class="session-score" style="color:${scoreColor}">${r.finalScore}/${r.totalQuestions} <small>${p}%</small></span>
                            ${timeStr ? `<span class="session-date" style="display:block">${timeStr}</span>` : ''}
                        </span>
                        <span class="session-date">${ds}</span>
                    </button>
                    <div class="quiz-session-detail">
                        <div class="quiz-score-summary">
                            <span class="quiz-summary-chip">첫 점수 ${r.initialScore}/${r.totalQuestions}</span>
                            <span class="quiz-summary-chip">최종 ${r.finalScore}/${r.totalQuestions}</span>
                            ${attempts.length ? `<span class="quiz-summary-chip">✅ ${correctCount} · ❌ ${wrongCount}</span>` : ''}
                        </div>
                        ${attemptHTML}
                    </div>
                </div>`;
        }).join('');

        el.innerHTML = html;
    }

    function switchStatsView(tab, button) {
        document.querySelectorAll('.page-tab').forEach(item => item.classList.remove('active'));
        if (button) button.classList.add('active');
        document.getElementById('statsView').style.display = tab === 'stats' ? '' : 'none';
        const quizView = document.getElementById('quizView');
        quizView.classList.toggle('view-active', tab === 'quiz');
        if (tab === 'quiz') {
            const week = filterWeek(loadReports(), weekStart(weekOffset));
            renderQuizSubjectTabs(week);
            renderQuizList(week, _quizSubj);
        }
    }
    window.switchStatsView = switchStatsView;

    // ─────────────────────────────────────────────
    //  Event listeners
    // ─────────────────────────────────────────────
    document.getElementById('prevWeekBtn').addEventListener('click', () => { weekOffset--; render(); });
    document.getElementById('nextWeekBtn').addEventListener('click', () => { if (weekOffset < 0) { weekOffset++; render(); } });

    document.getElementById('subjTabs').addEventListener('click', e => {
        const btn = e.target.closest('.subj-tab');
        if (!btn) return;
        document.querySelectorAll('#subjTabs .subj-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        levelSubject = btn.dataset.subj;
        buildLevelChart(loadReports(), levelSubject);
    });

    document.getElementById('pageTabs').addEventListener('click', e => {
        const btn = e.target.closest('.page-tab');
        if (!btn) return;
        switchStatsView(btn.dataset.tab, btn);
    });

    document.getElementById('quizSubjTabs').addEventListener('click', e => {
        const btn = e.target.closest('.subj-tab');
        if (!btn) return;
        document.querySelectorAll('#quizSubjTabs .subj-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        _quizSubj = btn.dataset.subj;
        _quizUnit = 'all';
        const week = filterWeek(loadReports(), weekStart(weekOffset));
        renderQuizList(week, _quizSubj);
    });

    document.getElementById('quizUnitTabs').addEventListener('click', e => {
        const btn = e.target.closest('.quiz-unit-btn');
        if (!btn) return;
        _quizUnit = btn.dataset.unit;
        const week = filterWeek(loadReports(), weekStart(weekOffset));
        renderQuizList(week, _quizSubj);
    });

    document.getElementById('quizList').addEventListener('click', e => {
        const head = e.target.closest('.quiz-session-head');
        if (!head) return;
        head.closest('.quiz-session-card').classList.toggle('open');
    });

    // ─────────────────────────────────────────────
    //  Init
    // ─────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
        if (!UserSession.getActiveUser()) {
            window.location.href = 'index.html';
            return;
        }
        renderQuizSubjectTabs(filterWeek(loadReports(), weekStart(weekOffset)));
        render();

        // 동기화 완료 시 차트/카드 재렌더링 (퀴즈 탭 활성 시 함께 갱신됨)
        window.addEventListener('firesynced', () => render());
    });
    </script>
<script src="version-check.js"></script>
</body>
</html>
