  <circle cx="130" cy="106" r="84" fill="none" stroke="#9fd3b6" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>
  <path d="M74 40 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#f0b44c"/>
  <path d="M188 34 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z" fill="#f0b44c"/>

  <!-- lamp -->
  <path d="M112 66 L84 50" stroke="#2b2620" stroke-width="4" stroke-linecap="round"/>
  <path d="M84 50 L74 112" stroke="#2b2620" stroke-width="4" stroke-linecap="round"/>
  <rect x="62" y="110" width="26" height="8" rx="4" fill="#2b2620"/>
