  <path d="M209 102 Q207 90 201 84 Q212 86 209 102 Z" fill="#4fbf8c" stroke="#2b2620" stroke-width="2"/>
  <path d="M209 102 Q213 88 221 86 Q218 98 209 102 Z" fill="#2e9a6c" stroke="#2b2620" stroke-width="2"/>

