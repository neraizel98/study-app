  <path d="M220 160 L202 152 L202 186 L220 178 L212 169 Z" fill="#1d6f4d" stroke="#2b2620" stroke-width="3" stroke-linejoin="round"/>
  <rect x="54" y="148" width="152" height="34" rx="8" fill="#23845c" stroke="#2b2620" stroke-width="3"/>
  <text x="130" y="171" text-anchor="middle" font-family="Pretendard Variable, Pretendard, sans-serif" font-weight="800" font-size="15" fill="#fff" letter-spacing="1">오늘도 한 걸음</text>
