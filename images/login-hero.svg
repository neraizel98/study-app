    <path d="M110 94 l4 4 7 -8"/><path d="M106 106 l4 4 7 -8"/>
  </g>
  <g stroke="#d8cdb9" stroke-width="2.5" stroke-linecap="round"><path d="M126 94 H148"/><path d="M122 106 H144"/></g>

  <!-- pencil cup -->
  <path d="M168 88 L172 116 L192 116 L196 88 Z" fill="#2f68c8" stroke="#2b2620" stroke-width="3" stroke-linejoin="round"/>
  <path d="M174 88 L170 66" stroke="#f0b44c" stroke-width="5" stroke-linecap="round"/>
  <path d="M182 88 L184 62" stroke="#a3324b" stroke-width="5" stroke-linecap="round"/>
  <path d="M190 88 L196 70" stroke="#2e9a6c" stroke-width="5" stroke-linecap="round"/>

