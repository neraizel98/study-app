<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1117">
    <title>관리자 대시보드 - Smart Study</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <style>
        body { display:flex; flex-direction:column; align-items:center; min-height:100vh; padding-bottom:60px; }
        .wrap { width:100%; max-width:960px; padding:20px; }

        /* ── Header ── */
        .page-header { display:flex; align-items:center; gap:12px; margin-bottom:28px; padding-top:10px; }
        .back-btn { text-decoration:none; color:var(--text-sub); font-size:0.85rem; background:var(--card-bg); border:1px solid var(--card-border); padding:6px 14px; border-radius:20px; transition:color 0.2s, border-color 0.2s; }
        .back-btn:hover { color:var(--accent); border-color:var(--accent); }
        .page-title { font-size:1.5rem; font-weight:700; flex:1; }

        /* ── Section title ── */
        .section-title { font-size:1rem; font-weight:700; color:var(--text-sub); margin-bottom:14px; letter-spacing:0.5px; }

        /* ── User cards (list view) ── */
        .user-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:16px; }
        .user-card {
            background:var(--card-bg); border:1px solid var(--card-border);
            border-radius:20px; padding:20px; cursor:pointer;
            transition:border-color 0.2s, transform 0.2s;
            text-decoration:none; color:inherit;
        }
        .user-card:hover { border-color:var(--accent); transform:translateY(-3px); }
        .user-card-top { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
        .user-avatar {
            width:44px; height:44px; border-radius:14px;
            background:linear-gradient(135deg, var(--accent), var(--accent2));
            display:flex; align-items:center; justify-content:center;
            font-size:1.3rem; font-weight:700; color:#fff; flex-shrink:0;
        }
        .user-name { font-size:1.1rem; font-weight:700; }
        .user-level { font-size:0.78rem; color:var(--text-sub); margin-top:2px; }
        .user-stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
        .u-stat { text-align:center; background:rgba(255,255,255,0.04); border-radius:10px; padding:8px 4px; }
        .u-stat-val { font-size:1rem; font-weight:700; }
        .u-stat-lbl { font-size:0.65rem; color:var(--text-sub); margin-top:2px; }
        .user-last { font-size:0.74rem; color:var(--text-sub); margin-top:12px; border-top:1px solid rgba(255,255,255,0.06); padding-top:10px; }

        /* ── Detail view ── */
        #userDetailView { display:none; }
        .detail-back { display:inline-flex; align-items:center; gap:6px; background:var(--card-bg); border:1px solid var(--card-border); border-radius:20px; padding:7px 16px; cursor:pointer; font-size:0.85rem; color:var(--text-sub); margin-bottom:20px; transition:color 0.2s; }
        .detail-back:hover { color:var(--accent); border-color:var(--accent); }

        /* detail header */
        .detail-header { display:flex; align-items:center; gap:16px; margin-bottom:24px; }
        .detail-avatar { width:56px; height:56px; border-radius:18px; background:linear-gradient(135deg, var(--accent), var(--accent2)); display:flex; align-items:center; justify-content:center; font-size:1.6rem; font-weight:700; color:#fff; flex-shrink:0; }
        .detail-name { font-size:1.4rem; font-weight:700; }
        .detail-sub  { font-size:0.85rem; color:var(--text-sub); margin-top:3px; }

        /* summary cards row */
        .detail-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
        .ds-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:16px; padding:16px 12px; text-align:center; }
        .ds-icon  { font-size:1.4rem; margin-bottom:6px; }
        .ds-val   { font-size:1.3rem; font-weight:700; }
        .ds-lbl   { font-size:0.72rem; color:var(--text-sub); margin-top:4px; }

        /* tabs */
        .detail-tabs { display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
        .detail-tabs::-webkit-scrollbar { display:none; }
        .d-tab { padding:7px 18px; border-radius:20px; border:1px solid var(--card-border); background:transparent; color:var(--text-sub); cursor:pointer; font-size:0.88rem; font-family:var(--font); transition:all 0.2s; }
        .d-tab:hover:not(.active) { border-color:rgba(79,172,254,0.5); color:var(--text); background:rgba(255,255,255,0.05); }
        .d-tab.active { background:rgba(79,172,254,0.15); border-color:var(--accent); color:var(--accent); font-weight:700; }

        /* chart card */
        .chart-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:20px; padding:22px 24px; margin-bottom:16px; }
        .chart-title { font-size:1rem; font-weight:700; margin-bottom:16px; }

        /* quiz records */
        .quiz-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
        .quiz-row:last-child { border-bottom:none; }
        .subj-badge { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:0.95rem; flex-shrink:0; }
        .quiz-info { flex:1; min-width:0; }
        .quiz-level { font-size:0.82rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .quiz-date  { font-size:0.72rem; color:var(--text-sub); }
        .quiz-score { font-size:1rem; font-weight:700; flex-shrink:0; }
        .quiz-time  { font-size:0.72rem; color:var(--text-sub); flex-shrink:0; }

        /* subject stats bar */
        .subj-stat-row { display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
        .subj-stat-row:last-child { border-bottom:none; }
        .subj-stat-name { width:60px; font-weight:600; font-size:0.9rem; flex-shrink:0; }
        .subj-bar-wrap { flex:1; }
        .subj-bar-track { height:8px; background:rgba(255,255,255,0.07); border-radius:4px; overflow:hidden; }
        .subj-bar-fill  { height:100%; border-radius:4px; transition:width 0.6s; }
        .subj-stat-pct  { width:40px; text-align:right; font-size:0.85rem; font-weight:700; flex-shrink:0; }
        .subj-stat-cnt  { font-size:0.75rem; color:var(--text-sub); flex-shrink:0; }

        /* wrong items */
        .wrong-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
        .wrong-row:last-child { border-bottom:none; }
        .wrong-identifier { flex:1; font-size:0.88rem; }
        .wrong-count { font-size:0.78rem; color:#f9826c; background:rgba(249,130,108,0.12); padding:2px 8px; border-radius:12px; flex-shrink:0; }
        .mastered-badge { font-size:0.72rem; color:#56d364; background:rgba(86,211,100,0.12); padding:2px 8px; border-radius:12px; }

        .empty-msg { text-align:center; padding:36px; color:var(--text-sub); font-size:0.9rem; }
        .loading    { text-align:center; padding:60px; color:var(--text-sub); }
        .error-msg  { text-align:center; padding:40px; color:#f9826c; font-size:0.9rem; }

        @media (max-width:600px) {
            .detail-summary { grid-template-columns:repeat(2,1fr); }
            .user-grid { grid-template-columns:1fr; }
        }
    </style>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="wrap">
        <div class="page-header">
            <a href="index.html" class="back-btn">← 홈</a>
            <h1 class="page-title">🛠️ 관리자 대시보드</h1>
        </div>

        <!-- ── 학습 시간 설정 ── -->
        <div id="adminGate" class="chart-card"><div class="loading">🔐 관리자 계정을 확인하는 중...</div></div>
        <div id="userListView" style="display:none;">
        <div class="chart-card" id="studyTimeConfig" style="margin-bottom:20px;">
            <div class="chart-title" style="margin-bottom:14px;">⏱️ 과목별 최소 학습 시간 설정</div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:14px;" id="studyTimeInputs"></div>
            <div style="display:flex;align-items:center;gap:10px;">
                <button onclick="saveStudyTimeConfig()" style="flex:1;padding:9px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0d1117;font-weight:700;font-family:var(--font);cursor:pointer;">저장</button>
                <span id="stcSavedMsg" style="font-size:0.8rem;color:#56d364;display:none;">✅ 저장됨</span>
            </div>
            <div style="font-size:0.75rem;color:var(--text-sub);margin-top:8px;">레벨별 기준시간과 최근 퀴즈 3회 평균에 따른 시간 중 더 긴 시간을 적용합니다. 평균 90점 이상은 면제되며, 0분은 점수 기록이 없을 때 바로 퀴즈가 가능합니다.</div>
        </div>

        <div class="chart-card" id="parentPlanSettings" style="margin-bottom:20px;">
            <div class="chart-title" style="margin-bottom:8px;">🗓️ 학습자별 하루 계획 설정</div>
            <div style="font-size:.75rem;color:var(--text-sub);margin-bottom:12px;">하루 목표 시간과 학년·학기는 보호자가 관리합니다. 기존 오늘 계획은 진행 상태와 선택 단원을 유지한 채 시간 배분만 갱신됩니다.</div>
            <div id="parentPlanSettingsList" style="display:grid;gap:12px;"></div>
        </div>

        <!-- ── 유저 목록 ── -->
            <div class="section-title">등록된 학습자</div>
            <div id="userList" class="user-grid">
                <div class="loading">☁️ 데이터 불러오는 중...</div>
            </div>
        </div>

        <!-- ── 유저 상세 ── -->
        <div id="userDetailView">
            <button class="detail-back" id="backBtn">← 목록으로</button>
            <div id="detailContent"></div>
        </div>
    </div>

    <script src="storage-keys.js"></script><script src="storage-events.js"></script><script src="schema-migrations.js"></script><script src="durable-store.js?v=20260917-storage2"></script><script src="local-repository.js?v=20260917-storage2"></script><script src="app-bootstrap.js"></script>
    <script src="report.js?v=20260919-learning1"></script>
    <script src="ReadingData.js"></script><script src="VocabEng.js"></script><script src="MathData.js"></script><script src="MathDataMiddle1.js"></script><script src="MathDataMiddle1Semester2.js"></script><script src="learning-plan.js"></script>
    <script src="firebase-config.js"></script><script src="firebase-client.js"></script><script src="firestore-repository.js?v=20260923-parent-free"></script><script src="partition-repository.js?v=20260920-syncstatus"></script>
    <script src="notification-client.js?v=20260810"></script><script src="in-app-study-request.js?v=20260923-parent-free"></script>
    <script src="study-timer.js?v=20260729-level-config"></script>
    <script>
    // ─────────────────────────────────────────────
    //  Admin 설정
    // ─────────────────────────────────────────────
    const ADMIN_IDS = ['우준아빠'];
    const SUBJECTS = SubjectRegistry.list();
    const SUBJECT_IDS = SUBJECTS.map(subject => subject.id);
    const SUBJ_NAMES = Object.fromEntries(SUBJECTS.map(subject => [subject.id, subject.name]));
    const SUBJ_ICONS = Object.fromEntries(SUBJECTS.map(subject => [subject.id, subject.icon]));
    const SUBJ_COLORS = { english:'#4facfe', grammar:'#a78bfa', hanja:'#f9826c', math:'#56d364', reading:'#fb7185' };
    SUBJECT_IDS.forEach(subject => { if (!SUBJ_COLORS[subject]) SUBJ_COLORS[subject] = '#8b949e'; });

    let db = null;

    // ─────────────────────────────────────────────
    //  Firebase 초기화
    // ─────────────────────────────────────────────
    async function initFirebase() {
        db = await SmartStudy.FirestoreRepository.getDB();
        const user = await SmartStudy.FirebaseClient.getCurrentUser();
        if (!user) {
            const error = new Error('Google 로그인이 필요합니다.');
            error.code = 'auth/login-required';
            throw error;
        }
        const access = await SmartStudy.FirestoreRepository.getAccess(user.uid);
        if (access?.role !== 'admin') {
            const error = new Error('이 Google 계정에는 관리자 권한이 없습니다.');
            error.code = 'permission-denied';
            throw error;
        }
        return { user, access };
    }

    async function connectAdminCloud(button) {
        button.disabled = true;
        button.textContent = 'Google 로그인 중...';
        try {
            const result = await SmartStudy.FirebaseClient.signInWithGoogle();
            // 리다이렉트 방식이면 여기까지 돌아오지 않고 페이지가 이동된다.
            if (result) location.reload();
        } catch (error) {
            button.disabled = false;
            button.textContent = '🔐 Google로 관리자 연결';
            const message = error?.code === 'auth/popup-closed-by-user'
                ? 'Google 로그인 창이 닫혔습니다. 버튼을 눌러 다시 로그인해 주세요.'
                : `Google 로그인 실패: ${error.message}`;
            document.getElementById('userList').innerHTML = `<div class="error-msg">⚠️ ${message}</div>`;
        }
    }
    window.connectAdminCloud = connectAdminCloud;

    // ─────────────────────────────────────────────
    //  데이터 로드
    // ─────────────────────────────────────────────
    async function loadAllUsers() {
        const users = (await SmartStudy.FirestoreRepository.listLearners()).filter(user => user.id);
        return users.sort((a, b) => (b._updatedAt || 0) - (a._updatedAt || 0));
    }

    async function loadUserDetail(userId) {
        const bundle = await SmartStudy.FirestoreRepository.getAdminOverview(userId);
        window._adminPaging = {userId, ...(bundle.page || {}), legacy: !!bundle.legacy};
        return {
            userData: bundle.user || {},
            reports: bundle.reports || [],
            wrongAnswers: bundle.wrongAnswers || {}
        };
    }

    // ─────────────────────────────────────────────
    //  유저 목록 렌더링
    // ─────────────────────────────────────────────
    function renderUserList(users) {
        const el = document.getElementById('userList');
        const learners = users.filter(u => !ADMIN_IDS.includes(u.userId));

        if (!learners.length) {
            el.innerHTML = '<div class="empty-msg">등록된 학습자가 없습니다.</div>';
            return;
        }

        el.innerHTML = learners.map(u => {
            const streak = u.attendance?.currentStreak || 0;
            const lastRaw = u._updatedAt;
            const lastStr = lastRaw
                ? new Date(lastRaw).toLocaleDateString('ko-KR', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' })
                : '-';
            const initials = (u.id || u.userId || '?').slice(0, 2);
            const lvl = u.level || 1;
            const exp = u.exp || 0;

            return `
                <div class="user-card" onclick="openUserDetail('${u.userId}')">
                    <div class="user-card-top">
                        <div class="user-avatar">${initials}</div>
                        <div>
                            <div class="user-name">${u.id || u.userId}</div>
                            <div class="user-level">Lv.${lvl} · ${exp} EXP</div>
                        </div>
                    </div>
                    <div class="user-stats">
                        <div class="u-stat">
                            <div class="u-stat-val">${u.totalAttempts || 0}</div>
                            <div class="u-stat-lbl">퀴즈 횟수</div>
                        </div>
                        <div class="u-stat">
                            <div class="u-stat-val" style="color:#56d364">${streak}🔥</div>
                            <div class="u-stat-lbl">연속 출석</div>
                        </div>
                        <div class="u-stat">
                            <div class="u-stat-val">${u.totalCorrect || 0}</div>
                            <div class="u-stat-lbl">누적 정답</div>
                        </div>
                    </div>
                    <div class="user-last">마지막 활동: ${lastStr}</div>
                    <div class="study-request" data-study-learner="${escapeAdmin(u.userId)}" onclick="event.stopPropagation()" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--card-border);">
                        <button type="button" data-study-request style="padding:7px 11px;border:0;border-radius:8px;background:var(--accent);color:#0d1117;font-weight:700;cursor:pointer;">📣 공부 요청</button>
                        <div data-study-request-status style="font-size:.7rem;color:var(--text-sub);margin-top:6px;line-height:1.5;">무료 앱 안 알림 상태 확인 중…</div>
                    </div>
                </div>`;
        }).join('');
        bindStudyRequestCards();
    }

    const studyRequestWatchers=[];let studyWatchGeneration=0;
    const stopStudyRequestWatchers=()=>{studyWatchGeneration++;while(studyRequestWatchers.length){try{studyRequestWatchers.pop()?.();}catch(_){}}};
    const requestTime=value=>value?.toDate?.().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})||'-';
    function bindStudyRequestCards(){
        stopStudyRequestWatchers();
        if(document.visibilityState==='hidden')return;
        const generation=studyWatchGeneration;
        document.querySelectorAll('[data-study-learner]').forEach(card=>{
            const learnerId=card.dataset.studyLearner,status=card.querySelector('[data-study-request-status]'),button=card.querySelector('[data-study-request]');
            let request=null,activity=null;
            const render=()=>{const requested=requestTime(request?.requestedAt),started=requestTime(request?.startedAt),latest=requestTime(activity?.occurredAt||activity?.startedAt);status.textContent=request?`요청 ${requested} · ${request.status==='started'?`서버 확인 ${started}`:'시작 대기 중'} · 실제 학습 시작(기기 기준) ${latest}`:`요청 없음 · 실제 학습 시작(기기 기준) ${latest}`;};
            const failed=()=>{if(generation===studyWatchGeneration)status.textContent='상태를 확인하지 못했습니다. 계정 연결과 네트워크를 확인해 주세요.';};
            SmartStudy.FirestoreRepository.watchStudyRequest(learnerId,value=>{if(generation===studyWatchGeneration){request=value;render();}},failed).then(stop=>{if(generation===studyWatchGeneration&&document.visibilityState==='visible')studyRequestWatchers.push(stop);else stop?.();}).catch(failed);
            SmartStudy.FirestoreRepository.watchLearnerActivity(learnerId,value=>{if(generation===studyWatchGeneration){activity=value;render();}},failed).then(stop=>{if(generation===studyWatchGeneration&&document.visibilityState==='visible')studyRequestWatchers.push(stop);else stop?.();}).catch(failed);
            button.onclick=async()=>{button.disabled=true;status.textContent='서버에 요청을 저장하는 중…';try{await SmartStudy.FirestoreRepository.createStudyRequest(learnerId);status.textContent='공부 요청을 저장했습니다. 앱을 열어 둔 학습자는 바로 보고, 닫혀 있으면 다음 실행 때 봅니다.';}catch(error){status.textContent=String(error.code||'').includes('permission-denied')?'요청은 60초에 한 번만 보낼 수 있으며 관리자 계정 연결이 필요합니다.':`요청 실패: ${error.message}`;}finally{button.disabled=false;}};
        });
    }
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')bindStudyRequestCards();else stopStudyRequestWatchers();});
    window.addEventListener('pagehide',stopStudyRequestWatchers);

    // ─────────────────────────────────────────────
    //  유저 상세 렌더링
    // ─────────────────────────────────────────────
    let _currentTab = 'quiz';

    function openUserDetail(userId) {
        document.getElementById('userListView').style.display   = 'none';
        document.getElementById('userDetailView').style.display = 'block';
        document.getElementById('detailContent').innerHTML      = '<div class="loading">☁️ 불러오는 중...</div>';

        loadUserDetail(userId).then(({ userData, reports, wrongAnswers }) => {
            _currentTab = 'quiz';
            renderDetailContent(userId, userData, reports, wrongAnswers);
        }).catch(e => {
            document.getElementById('detailContent').innerHTML =
                `<div class="error-msg">⚠️ 데이터 로드 실패: ${e.message}</div>`;
        });
    }

    function renderDetailContent(userId, ud, reports, wrongAnswers) {
        const name    = ud.id || userId;
        const lvl     = ud.level || 1;
        const streak  = ud.attendance?.currentStreak || 0;
        const totalDay = ud.attendance?.totalDays || 0;
        const formulaTotal = (ud.formulaStudyTime?.totalStudySeconds || 0) + (ud.formulaStudyTime?.totalQuizSeconds || 0);
        const studyMin = Math.round(((ud.totalStudyTime || 0) + formulaTotal) / 60);
        const initials = name.slice(0, 2);

        const summaryCards = [
            { icon:'🏅', val:`Lv.${lvl}`, lbl:'레벨' },
            { icon:'⏱',  val:`${studyMin}분`, lbl:'총 학습 시간' },
            { icon:'📝',  val:`${ud.totalAttempts||0}회`, lbl:'퀴즈 도전' },
            { icon:'🔥',  val:`${streak}일`, lbl:'연속 출석' },
            { icon:'🧠',  val:`${ud.totalCorrect||0}개`, lbl:'누적 정답' },

    const escapeAdmin = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

                    <span data-plan="allocation" style="font-size:.75rem;color:var(--text-sub);"></span>
                    <button type="button" data-plan="save" style="padding:9px 14px;border:0;border-radius:9px;background:var(--accent);color:#0d1117;font-weight:700;cursor:pointer;">저장</button>
                    <span data-plan="message" style="font-size:.75rem;color:var(--text-sub);"></span>
                </div><div data-plan="scopes" style="display:grid;gap:8px;margin-top:12px;"></div><p style="font-size:.72rem;color:var(--text-sub);margin:8px 0 0;">국어는 현재 중1 독해, 영어는 영어 단어, 수학은 지원 학년·학기 단원입니다. 영어 문법과 수학 공식은 이 설정 범위가 아닙니다.</p>`;

                    const mode=row.querySelector('[data-mode]'),unit=row.querySelector('[data-unit]'),note=row.querySelector('[data-note]');

                    mode.onchange=sync;unit.onchange=sync;sync();host.append(row);

            const allocation=()=>{const budget=Number(card.querySelector('[data-plan="budget"]').value),minutes=SmartStudy.LearningPlan.budgets[budget];card.querySelector('[data-plan="allocation"]').textContent=`국어 ${minutes[0]}분 · 영어 ${minutes[1]}분 · 수학 ${minutes[2]}분`;};
            card.querySelector('[data-plan="budget"]').onchange=allocation;
            card.querySelector('[data-plan="grade"]').onchange=drawScopes;card.querySelector('[data-plan="semester"]').onchange=drawScopes;allocation();drawScopes();
            card.querySelector('[data-plan="save"]').addEventListener('click', async event => {
                const button = event.currentTarget, message = card.querySelector('[data-plan="message"]');
                button.disabled = true; message.textContent = '저장 중...';
                try {
                    await SmartStudy.FirestoreRepository.saveLearnerPlanSettings(learner.userId, {
                        budgetMinutes:Number(card.querySelector('[data-plan="budget"]').value),
                        grade:Number(card.querySelector('[data-plan="grade"]').value),

                    message.style.color = '#56d364'; message.textContent = '✅ 서버에 저장됨';

                    message.style.color = '#ff7b72'; message.textContent = `저장 실패: ${error.message}`;

        if (!rows.length) container.innerHTML = '<div class="empty-msg">등록된 학습자가 없습니다.</div>';
    }

    async function renderAssessmentSummary(userId, reports) {
        const panel = document.getElementById('assessmentSummary');
        const candidates = (reports || []).filter(row => row.metadata?.assessment && row.metadata?.submittedAt)
            .sort((a, b) => Number(b.date || 0) - Number(a.date || 0));
        if (!candidates.length) { if (panel) panel.textContent = '최근 기록에 제출된 주간 평가가 없습니다.'; return; }
        const assessmentId = candidates[0].metadata.assessmentId;
        const rows = candidates.filter(row => row.metadata.assessmentId === assessmentId);
        try {
            const details = await Promise.all(rows.map(row => row._body
                ? SmartStudy.FirestoreRepository.getReportDetail(userId, row) : row));
            if (!panel.isConnected || window._adminData?.userId !== userId) return;
            panel.replaceChildren();
            const title = document.createElement('h3'); title.textContent = '최근 주간 평가 · 범위와 표본'; panel.append(title);
            const labels = { reading: '국어 독해', english: '영어', math: '수학' };
            const supplements = [];
            details.forEach(report => {
                const metadata = report.metadata || {};
                const attempts = metadata.initialAttempts || metadata.attempts || [];
                const line = document.createElement('p');
                line.textContent = `${labels[report.subject] || report.subject}: ${report.initialScore}/${report.totalQuestions} 정답 · 실제 ${metadata.actualCount ?? report.totalQuestions}/${metadata.requestedCount ?? report.totalQuestions}문항 · ${attempts.length}개 답안 확인`;
                panel.append(line);
                attempts.filter(attempt => !attempt.correct).forEach(attempt => {
                    const context = attempt.context || metadata;
                    const scope = context.title || context.unitTitle || context.unitId || report.level;
                    supplements.push(`${labels[report.subject] || report.subject} ${scope}`);
                });
            });
            const next = document.createElement('p');
            next.style.color = 'var(--text-sub)';
            next.textContent = supplements.length
                ? `다음 보충: ${[...new Set(supplements)].join(' · ')}`
                : '다음 보충: 이번 평가의 오답이 없습니다. 최근 학습 기록을 이어서 살펴보세요.';
            panel.append(next);
        } catch (error) { if (panel.isConnected) panel.textContent = '최근 평가 상세 기록을 불러오지 못했습니다.'; }
    }

    async function switchTab(btn, tab, userId) {
        document.querySelectorAll('.d-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        _currentTab = tab;
        // 이전 차트 인스턴스 정리
        if (window._adminWeekCharts) {
            Object.values(window._adminWeekCharts).forEach(c => c && c.destroy());
            window._adminWeekCharts = {};
        }
        const { ud, reports, wrongAnswers } = window._adminData;
        const el = document.getElementById('tabContent');
        if (tab === 'quiz')    el.innerHTML = buildQuizTab(reports, wrongAnswers);
        if (tab === 'subject') el.innerHTML = buildSubjectTab(reports, ud);
        if (tab === 'level')   el.innerHTML = buildStudyDetailTab(reports);
        if (tab === 'wrong')   el.innerHTML = buildWrongTab(wrongAnswers);
        if (tab === 'weekly') {
            _weeklyOffset = 0;
            el.textContent = '선택 기간을 불러오는 중...';
            try { await loadAdminWeek(0); } catch (error) { el.textContent = '기록을 받지 못했습니다. 다시 선택해 주세요.'; }
        }
    }

    // ── 오늘의 학습 바 ──
    function buildDailyStatsBar(ud) {
        const ds = ud.dailyStats || {};
        const formulaTime = ud.formulaStudyTime || {};
        if (!ds.date && !formulaTime.date) return '';

        const today = new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit' }).replace(/\. /g,'-').replace('.','');
        const displayDate = ds.date || formulaTime.date;
        const isToday = displayDate === today || displayDate === StudyPeriods.daily();
        const label = isToday ? '오늘의 학습' : `${displayDate} 학습`;

        // Time maps are authoritative because older/cross-device records can
        // have valid seconds even when subjectsStudied is incomplete.
        const timedSubjects = [
            ...Object.keys(ds.studyTime || {}),
            ...Object.keys(ds.learningTime || {}),
            ...Object.keys(ds.quizTime || {})
        ].filter(subject =>
            (ds.studyTime?.[subject] || 0) > 0
            || (ds.learningTime?.[subject] || 0) > 0
            || (ds.quizTime?.[subject] || 0) > 0
        );
        const subjects = [...new Set([...(ds.subjectsStudied || []), ...timedSubjects])];
        const items = subjects.map(s => {
            const info = typeof SubjectRegistry !== 'undefined' ? SubjectRegistry.get(s) : { icon:'📚', name:s };
            const sec = ds.studyTime?.[s] || 0;
            const learningSec = ds.learningTime?.[s] || 0;
            const quizSec = ds.quizTime?.[s] || 0;
            const min = Math.floor(sec / 60);
            const rem = sec % 60;
            const timeStr = min > 0 ? `${min}분${rem ? ' '+rem+'초' : ''}` : `${sec}초`;
            return `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.05);border-radius:10px;padding:5px 12px;font-size:0.82rem;">
                ${info.icon} ${info.name} <strong style="color:${SUBJ_COLORS[s] || '#a78bfa'}">${timeStr}</strong>
                ${(learningSec || quizSec) ? `<small style="color:var(--text-sub);">학습 ${formatStudySeconds(learningSec)} · 퀴즈 ${formatStudySeconds(quizSec)}</small>` : ''}
            </span>`;
        });

        if (formulaTime.date === StudyPeriods.daily()) {
            const studySec = formulaTime.studySeconds || 0;
            const quizSec = formulaTime.quizSeconds || 0;
            const totalSec = studySec + quizSec;
            if (totalSec > 0) {
                const formatTime = sec => {
                    const min = Math.floor(sec / 60);
                    const rem = sec % 60;
                    return min > 0 ? `${min}분${rem ? ' '+rem+'초' : ''}` : `${sec}초`;
                };
                items.push(`<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(167,139,250,0.1);border:1px solid rgba(167,139,250,0.2);border-radius:10px;padding:5px 12px;font-size:0.82rem;">
                    📐 수학 공식 사전 <strong style="color:#c4b5fd">${formatTime(totalSec)}</strong>
                    <small style="color:var(--text-sub);">학습 ${formatTime(studySec)} · 퀴즈 ${formatTime(quizSec)}</small>
                </span>`);
            }
        }
        if (!items.length) return '';

        return `<div style="background:rgba(79,172,254,0.06);border:1px solid rgba(79,172,254,0.2);border-radius:14px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <span style="font-size:0.78rem;font-weight:700;color:var(--text-sub);white-space:nowrap;">📅 ${label}</span>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">${items.join('')}</div>
        </div>`;
    }

    function buildFormulaTimePanel(ud) {
        const time = ud.formulaStudyTime || {};
        const totalStudy = time.totalStudySeconds || 0;
        const totalQuiz = time.totalQuizSeconds || 0;
        if (totalStudy + totalQuiz <= 0) return '';
        const isToday = time.date === StudyPeriods.daily();
        const todayStudy = isToday ? time.studySeconds || 0 : 0;
        const todayQuiz = isToday ? time.quizSeconds || 0 : 0;
        const formatTime = sec => {
            const hour = Math.floor(sec / 3600);
            const min = Math.floor((sec % 3600) / 60);
            const rem = sec % 60;
            if (hour) return `${hour}시간 ${min}분`;
            if (min) return `${min}분${rem ? ` ${rem}초` : ''}`;
            return `${rem}초`;
        };
        return `<div style="background:rgba(167,139,250,0.08);border:1px solid rgba(167,139,250,0.25);border-radius:14px;padding:13px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;">
            <div><strong>📐 수학 공식 사전 학습 시간</strong><div style="margin-top:5px;color:var(--text-sub);font-size:.78rem;">학습과 퀴즈 시간만 집계하며 미션에는 포함하지 않습니다.</div></div>
            <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;">
                <span>오늘 <strong style="color:#c4b5fd">${formatTime(todayStudy + todayQuiz)}</strong><small style="display:block;color:var(--text-sub);">학습 ${formatTime(todayStudy)} · 퀴즈 ${formatTime(todayQuiz)}</small></span>
                <span>누적 <strong style="color:#c4b5fd">${formatTime(totalStudy + totalQuiz)}</strong><small style="display:block;color:var(--text-sub);">학습 ${formatTime(totalStudy)} · 퀴즈 ${formatTime(totalQuiz)}</small></span>
            </div>
        </div>`;
    }

    function buildRewardPanel(ud) {
        const rewards = ud.missionProgress?.rewards;
        if (!rewards) return '';
        const entries = [];
        if (rewards.daily) entries.push({ category:'daily', index:-1, label:'오늘 목표', reward:rewards.daily });
        if (rewards.weekly) entries.push({ category:'weekly', index:-1, label:'주간 목표', reward:rewards.weekly });
        if (rewards.monthly) entries.push({ category:'monthly', index:-1, label:'월간 목표', reward:rewards.monthly });
        if (!entries.length) return '';
        return `<div style="background:rgba(255,193,7,0.07);border:1px solid rgba(255,193,7,0.25);border-radius:14px;padding:14px 16px;margin-bottom:16px;">
            <div style="font-weight:800;margin-bottom:10px;">🎁 획득 보상 관리</div>
            <div style="display:grid;gap:8px;">${entries.map(entry => `
                <div style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.04);border-radius:10px;padding:9px 12px;">
                    <span style="font-size:0.78rem;color:var(--text-sub);min-width:62px;">${entry.label}</span>
                    <strong style="flex:1;">${entry.reward.icon || '🎁'} ${entry.reward.title}${entry.reward.note ? ` · ${entry.reward.note}` : ''}</strong>
                    <button onclick="markRewardUsed('${entry.category}',${entry.index},this)" ${entry.reward.used ? 'disabled' : ''}
                        style="border:0;border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:700;">
                        ${entry.reward.used ? '사용 완료' : '사용 처리'}
                    </button>
                </div>`).join('')}</div>
        </div>`;
    }

    async function markRewardUsed(category, index, button) {
        const data = window._adminData;
        if (!data?.ud?.missionProgress?.rewards) return;
        const rewards = data.ud.missionProgress.rewards;
        rewards[category].used = true;
        button.disabled = true;
        button.textContent = '저장 중...';
        try {
            await SmartStudy.FirestoreRepository.markRewardUsed(data.userId, rewards);
            button.textContent = '사용 완료';
        } catch (error) {
            button.disabled = false;
            button.textContent = '사용 처리';
            alert('보상 상태 저장에 실패했습니다: ' + error.message);
        }
    }
    window.markRewardUsed = markRewardUsed;

    // ── 퀴즈 기록 탭 ──
    window._loadQuizDetail = async function(index, button) {
        button.disabled = true;
        try {
            const data = window._adminData;
            const summary = [...data.reports].sort((a,b)=>b.date-a.date)[index];
            const detail = await SmartStudy.FirestoreRepository.getReportDetail(data.userId, summary);
            const container = document.getElementById(`lazy_quiz_${index}`);
            container.replaceChildren();
            for (const answer of detail.metadata?.initialAttempts || detail.metadata?.attempts || []) {
                const line = document.createElement('p');
                line.textContent = `${answer.correct ? '✅' : '❌'} ${answer.question || ''} · 내 답: ${answer.selectedAnswer ?? '기록 없음'} · 정답: ${answer.correctAnswer ?? ''}`;
                container.appendChild(line);
            }
            if (!container.children.length) container.textContent = '이전 기록에는 문제별 답안이 저장되어 있지 않습니다.';
            button.textContent = '답안 불러오기 완료';
        } catch(error) { button.disabled = false; button.textContent = '다시 불러오기'; }
    };
    window._loadMoreQuizzes = async function(button) {
        button.disabled = true;
        try {
            const data = window._adminData, page = await SmartStudy.FirestoreRepository.getReportsPage(data.userId, {before:window._adminPaging.cursor});
            window._adminPaging = {...window._adminPaging,...page};
            data.reports = [...new Map([...data.reports,...page.reports].map(r=>[r.sessionId,r])).values()];
            document.getElementById('tabContent').innerHTML = buildQuizTab(data.reports,data.wrongAnswers);
        } catch(error) { button.disabled = false; button.textContent = '다시 불러오기'; }
    };
    async function loadAdminWeek(offset) {
        const data=window._adminData, range=_weekRange(offset), oldest=_weekRange(offset-7).start;
        if (!window._adminPaging?.legacy) {
            let cursor=null, rows=[];
            do {
                const page=await SmartStudy.FirestoreRepository.getReportsPage(data.userId,{start:oldest.getTime(),end:range.end.getTime(),before:cursor,limit:100});
                rows.push(...page.reports);cursor=page.hasMore?page.cursor:null;
            } while(cursor);
            const days=await SmartStudy.FirestoreRepository.getDaily(data.userId,StudyPeriods.dateKey(range.start),StudyPeriods.dateKey(range.end));
            data.ud._dailyRecords=days;
            data._weeklyReports=rows;
        } else data._weeklyReports=data.reports;
        const el=document.getElementById('tabContent');
        el.innerHTML=_weeklyHTML(data._weeklyReports,offset,data.ud);
        requestAnimationFrame(()=>_drawWeeklyCharts(data._weeklyReports,offset,data.ud));
    }

    function buildQuizTab(reports, wrongAnswers) {
        if (!reports.length) return '<div class="empty-msg">퀴즈 기록이 없습니다.</div>';
        const wa = wrongAnswers || {};
        const sorted = [...reports].sort((a,b) => b.date - a.date);
        const rows = sorted.map((r, idx) => {
            const pct   = r.totalQuestions > 0 ? Math.round(r.initialScore / r.totalQuestions * 100) : 0;
            const color = pct >= 80 ? '#56d364' : pct >= 50 ? '#f9826c' : '#ff5f6d';
            const c     = SUBJ_COLORS[r.subject] || '#888';
            const d     = new Date(r.date);
            const ds    = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            const sec   = r.timeSpentSeconds || 0;
            const timeStr = sec > 0 ? (Math.floor(sec/60) + '분 ' + (sec%60) + '초') : '-';
            const lvlShort = (r.level||'-').length > 16 ? (r.level||'-').slice(0,16)+'…' : (r.level||'-');
            const round = r.round || 1;
            const roundBadge = round <= 2
                ? `<span style="font-size:0.65rem;padding:1px 6px;border-radius:8px;background:${round===1?'rgba(79,172,254,0.15)':'rgba(249,130,108,0.15)'};color:${round===1?'#4facfe':'#f9826c'};margin-left:4px;">${round}회차</span>`
                : '';

            // 문제별 정답/오답 상세
            let detailBtn = '';
            let detailDiv = '';
            if ((r.subject === 'english' || r.subject === 'hanja' || r.subject === 'grammar' || r.subject === 'reading') && r.sessionId) {
                const items = (r.subject === 'grammar' || r.subject === 'reading')
                    ? (r.metadata?.attempts || [])
                    : (wa[r.subject] || []).filter(item =>
                        (item.history || []).some(h => h.sessionId === r.sessionId && (h.round||1) === round)
                    );
                if (items.length) {
                    const detailId = `qd_${idx}`;
                    const chips = items.map(item => {
                        const h = (r.subject === 'grammar' || r.subject === 'reading') ? null : item.history.find(h => h.sessionId === r.sessionId && (h.round||1) === round);
                        const ok = (r.subject === 'grammar' || r.subject === 'reading') ? item.correct : h?.status === 'correct';
                        const label = r.subject === 'hanja'
                            ? `${item.hanja}(${item.eum||''}) ${item.meaning||''}`
                            : r.subject === 'grammar'
                                ? `${item.unitTitle || ''} · ${item.question || '?'}`
                                : r.subject === 'reading'
                                    ? `${item.skill || '독해'} · ${item.question || '?'}`
                                : (item.word || item.identifier || '?');
                        return `<span style="display:inline-flex;align-items:center;gap:4px;font-size:0.75rem;padding:3px 8px;border-radius:10px;margin:2px;background:${ok?'rgba(86,211,100,0.12)':'rgba(255,95,109,0.12)'};color:${ok?'#56d364':'#ff5f6d'};">${ok?'✅':'❌'} ${label}</span>`;
                    }).join('');
                    detailBtn = `<button onclick="document.getElementById('${detailId}').style.display=document.getElementById('${detailId}').style.display==='none'?'block':'none';this.textContent=this.textContent==='▼ 문제 보기'?'▲ 닫기':'▼ 문제 보기';" style="font-size:0.7rem;padding:2px 8px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:transparent;color:var(--text-sub);cursor:pointer;margin-top:4px;">▼ 문제 보기</button>`;
                    detailDiv = `<div id="${detailId}" style="display:none;padding:10px 0 4px;flex-wrap:wrap;display:none;">${chips}</div>`;
                }
            }

            if (r._body) {
                detailBtn = `<button onclick="window._loadQuizDetail(${idx}, this)">문제별 답안 보기</button>`;
                detailDiv = `<div id="lazy_quiz_${idx}"></div>`;
            }
            return `
                <div style="border-bottom:1px solid rgba(255,255,255,0.05);padding:10px 0;">
                    <div class="quiz-row" style="border:none;padding:0;">
                        <div class="subj-badge" style="background:${c}22; color:${c}">${SUBJ_ICONS[r.subject]||'📚'}</div>
                        <div class="quiz-info">
                            <div class="quiz-level">${SUBJ_NAMES[r.subject]||r.subject} · ${lvlShort}${roundBadge}</div>
                            <div class="quiz-date">${ds}</div>
                            ${detailBtn}
                        </div>
                        <div class="quiz-score" style="color:${color}" title="초기 점수">${r.initialScore}/${r.totalQuestions}</div>
                        <div class="quiz-time">${timeStr}</div>
                    </div>
                    ${detailDiv}
                </div>`;
        }).join('');
        return `<div class="chart-title">퀴즈 기록 · 최근 순</div>${rows}<p>현재 불러온 기록 ${reports.length}회${window._adminPaging?.legacy ? ' · 기존 저장 형식 (학습 기기 연결 시 이전)' : ''}</p>${window._adminPaging?.hasMore ? '<button onclick="window._loadMoreQuizzes(this)">이전 기록 20회 더 보기</button>' : ''}`;
    }

    // ── 과목별 통계 탭 ──
    function formatStudySeconds(sec) {
        const value = Math.max(0, Math.round(sec || 0));
        const min = Math.floor(value / 60);
        const rem = value % 60;
        return min > 0 ? `${min}분${rem ? ` ${rem}초` : ''}` : `${rem}초`;
    }

    function buildSubjectTab(reports, ud = {}) {
        const subjects = SUBJECT_IDS;
        const pctOf = (r, field) => r.totalQuestions > 0 ? (r[field] ?? r.initialScore) / r.totalQuestions * 100 : 0;
        const avg = (arr, field = 'initialScore') => arr.length ? Math.round(arr.reduce((a, r) => a + pctOf(r, field), 0) / arr.length) : null;

        const ROUND_LABELS = ['최초 시도', '재시도 후'];

        const cards = subjects.map(s => {
            const sub = reports.filter(r => r.subject === s);
            const subjectTime = ud.subjectStats?.[s] || {};
            if (!sub.length && !(subjectTime.studyTime > 0)) return null;

            const totalCount = sub.length;
            const reportQuizSeconds = sub.reduce((a, r) => a + (r.timeSpentSeconds || 0), 0);
            const totalSeconds = Math.max(subjectTime.studyTime || 0, reportQuizSeconds);
            const learningSeconds = subjectTime.learningTime || 0;
            const quizSeconds = subjectTime.quizTime || reportQuizSeconds;
            const overallPct = avg(sub, 'initialScore');
            const color      = SUBJ_COLORS[s];

            // 최초 시도(initialScore) vs 재시도 후(finalScore, 재시도한 세션만)
            const retried = sub.filter(r => (r.finalScore ?? r.initialScore) > r.initialScore);
            const byRound = [ sub, retried ];

            const roundBars = byRound.map((arr, i) => {
                if (!arr.length) return '';
                const p = avg(arr, i === 0 ? 'initialScore' : 'finalScore');
                const pctColor = p >= 80 ? '#56d364' : p >= 50 ? '#f9826c' : '#ff5f6d';
                return `
                <div style="margin-bottom:10px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                        <span style="font-size:0.75rem;color:var(--text-sub);">${ROUND_LABELS[i]} <span style="color:var(--text-sub);opacity:0.6;">(${arr.length}회)</span></span>
                        <span style="font-size:0.82rem;font-weight:700;color:${pctColor};">${p}%</span>
                    </div>
                    <div class="subj-bar-track">
                        <div class="subj-bar-fill" style="width:${p}%;background:${pctColor};"></div>
                    </div>
                </div>`;
            }).join('');

            // 최초 → 재시도 성장 화살표
            const rInit  = avg(byRound[0], 'initialScore');
            const rFinal = avg(byRound[1], 'finalScore');
            let growthStr = '';
            if (rInit !== null && rFinal !== null) {
                const diff = rFinal - rInit;
                growthStr += `<span style="font-size:0.72rem;">${diff >= 0 ? '📈' : '📉'} 최초→재시도 ${diff >= 0 ? '+' : ''}${diff}%p (${retried.length}회 재시도)</span>`;
            }

            return `
            <div style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:16px 18px;margin-bottom:12px;">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span style="font-size:1.1rem;">${SUBJ_ICONS[s]}</span>
                        <span style="font-size:1rem;font-weight:700;">${SUBJ_NAMES[s]}</span>
                    </div>
                    <div style="text-align:right;">
                        <div style="font-size:1.2rem;font-weight:700;color:${color};">${overallPct === null ? '-' : `${overallPct}%`}</div>
                        <div style="font-size:0.68rem;color:var(--text-sub);">${totalCount}회 · ${formatStudySeconds(totalSeconds)}</div>
                        ${(learningSeconds || subjectTime.quizTime) ? `<div style="font-size:0.65rem;color:var(--text-sub);margin-top:3px;">학습 ${formatStudySeconds(learningSeconds)} + 퀴즈 ${formatStudySeconds(quizSeconds)}</div>` : ''}
                    </div>
                </div>
                ${roundBars}
                ${growthStr ? `<div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.06);">${growthStr}</div>` : ''}
            </div>`;
        }).filter(Boolean);

        if (!cards.length) return '<div class="empty-msg">데이터가 없습니다.</div>';
        return `<div class="chart-title">현재 불러온 기록의 과목별 정답률 · 회차별 분석</div>${cards.join('')}${buildAdaptiveAnalysis(reports)}${buildGrammarAnalysis(reports)}${buildReadingAnalysis(reports)}`;
    }

    function buildAdaptiveAnalysis(reports) {
        const escape = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const groups = new Map();
        reports.filter(r => r.metadata?.contentVersion === LearningPolicy.version).forEach(r => {
            const key = `${r.subject}:${r.metadata.context}`;
            if (!groups.has(key) || groups.get(key).date < r.date) groups.set(key, r);
        });
        const rows = [...groups.values()].map(r => {
            const band = r.metadata.adaptiveBand || (r._body ? {name:'unknown',samples:0,score:null,reason:'이전 기록의 난이도는 다음 학습 후 갱신됩니다.'} : LearningPolicy.evaluate(reports, r.subject, r.metadata.context));
            const wrong = (window._adminData?.wrongAnswers?.[r.subject] || []).filter(item =>
                LearningPolicy.context(r.subject, {...item, unitId:item.unitId || item.level}) === r.metadata.context);
            const due = wrong.filter(item => LearningPolicy.isDue(item)).length;
            const stable = wrong.filter(item => item.reviewVersion === LearningPolicy.version && item.isMastered).length;
            return `<div style="padding:12px 0;border-bottom:1px solid var(--card-border)">
                <b>${escape(SUBJ_NAMES[r.subject])} · ${escape(r.metadata.unitTitle || r.metadata.unitId)}</b><br>
                ${{foundation:'기초 다지기',standard:'실력 쌓기',challenge:'응용 도전',unknown:'판정 대기'}[band.name]} · 유효 최초 풀이 ${band.samples}문항 · ${band.score ?? '—'}%<br>
                복습 시기 도래 ${due}개 · 날짜를 두고 기억 확인 ${stable}개<br><small>${escape(band.reason)}</small></div>`;
        });
        return `<section style="padding:18px"><div class="chart-title">단원별 난이도와 기억 확인</div>
            <p>재시험·힌트 사용은 승급 근거에서 제외합니다. 이전 버전 기록은 기존 통계에 보존됩니다.</p>
            ${rows.join('') || '새 기준으로 학습 기록을 모으고 있습니다.'}</section>`;
    }

    function buildReadingAnalysis(reports) {
        const skills = {};
        reports.filter(r => r.subject === 'reading').forEach(r => {
            (r.metadata?.attempts || []).forEach(attempt => {
                const key = attempt.skill || '기타';
                if (!skills[key]) skills[key] = { correct: 0, total: 0 };
                skills[key].total++;
                if (attempt.correct) skills[key].correct++;
            });
        });
        const rows = Object.entries(skills).map(([title, value]) => ({
            title, ...value, pct: value.total ? Math.round(value.correct / value.total * 100) : 0
        })).sort((a, b) => a.pct - b.pct);
        if (!rows.length) return '';
        const weak = rows.filter(row => row.pct < 70).map(row => row.title);
        const strong = rows.filter(row => row.pct >= 80).map(row => row.title);
        return `<div style="background:var(--card-bg);border:1px solid rgba(251,113,133,.35);border-radius:16px;padding:18px;margin-top:18px;">
            <div class="chart-title">📖 국어 독해 강점·약점 분석</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px;font-size:.78rem;">
                <span style="background:rgba(86,211,100,.12);color:#56d364;padding:5px 9px;border-radius:10px;">강점: ${strong.join(', ') || '데이터 축적 중'}</span>
                <span style="background:rgba(255,95,109,.12);color:#ff5f6d;padding:5px 9px;border-radius:10px;">약점: ${weak.join(', ') || '뚜렷한 약점 없음'}</span>
            </div>
            ${rows.map(row => {
                const color = row.pct >= 80 ? '#56d364' : row.pct >= 70 ? '#f0c674' : '#ff5f6d';
                return `<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:4px;"><span>${row.title}</span><strong style="color:${color}">${row.pct}% (${row.correct}/${row.total})</strong></div><div class="subj-bar-track"><div class="subj-bar-fill" style="width:${row.pct}%;background:${color}"></div></div></div>`;
            }).join('')}
        </div>`;
    }

    function buildGrammarAnalysis(reports) {
        const grammarReports = reports.filter(r => r.subject === 'grammar');
        const units = {};
        grammarReports.forEach(r => {
            const meta = r.metadata || {};
            const attempts = meta.attempts || [];
            if (attempts.length) {
                attempts.forEach(a => {
                    const key = a.unitId || meta.unitId || r.level || '기타';
                    if (!units[key]) units[key] = { title: a.unitTitle || meta.unitTitle || r.level || key, correct: 0, total: 0, wrongQuestions: {} };
                    units[key].total++;
                    if (a.correct) units[key].correct++;
                    else units[key].wrongQuestions[a.question || '문법 문제'] = (units[key].wrongQuestions[a.question || '문법 문제'] || 0) + 1;
                });
            } else {
                const key = meta.unitId || r.level || '기타';
                if (!units[key]) units[key] = { title: meta.unitTitle || r.level || key, correct: 0, total: 0, wrongQuestions: {} };
                units[key].correct += r.initialScore || 0;
                units[key].total += r.totalQuestions || 0;
            }
        });
        const rows = Object.values(units).map(u => ({ ...u, pct: u.total ? Math.round(u.correct / u.total * 100) : 0 }))
            .sort((a,b) => a.pct - b.pct);
        if (!rows.length) return '';
        const weak = rows.filter(r => r.pct < 70);
        const strong = rows.filter(r => r.pct >= 80);
        const list = rows.map(r => {
            const color = r.pct >= 80 ? '#56d364' : r.pct >= 70 ? '#f0c674' : '#ff5f6d';
            const topWrong = Object.entries(r.wrongQuestions).sort((a,b) => b[1]-a[1])[0];
            return `<div style="margin-bottom:10px;">
                <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:4px;"><span>${r.title}</span><strong style="color:${color}">${r.pct}% (${r.correct}/${r.total})</strong></div>
                <div class="subj-bar-track"><div class="subj-bar-fill" style="width:${r.pct}%;background:${color}"></div></div>
                ${topWrong ? `<div style="font-size:0.7rem;color:var(--text-sub);margin-top:3px;">자주 틀림: ${topWrong[0]} (${topWrong[1]}회)</div>` : ''}
            </div>`;
        }).join('');
        return `<div style="background:var(--card-bg);border:1px solid rgba(167,139,250,.35);border-radius:16px;padding:18px;margin-top:18px;">
            <div class="chart-title">📘 영어 문법 강점·약점 분석</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px;font-size:.78rem;">
                <span style="background:rgba(86,211,100,.12);color:#56d364;padding:5px 9px;border-radius:10px;">강점: ${strong.map(r=>r.title).join(', ') || '데이터 축적 중'}</span>
                <span style="background:rgba(255,95,109,.12);color:#ff5f6d;padding:5px 9px;border-radius:10px;">약점: ${weak.map(r=>r.title).join(', ') || '뚜렷한 약점 없음'}</span>
            </div>${list}
        </div>`;
    }

    // ── 레벨별 학습 탭 ──
    function buildStudyDetailTab(reports) {
        if (!reports.length) return '<div class="empty-msg">데이터가 없습니다.</div>';

        const subjects = SUBJECT_IDS;
        let html = '<div class="chart-title">레벨별 학습 현황</div>';
        let anyData = false;

        subjects.forEach(subj => {
            const subjReports = reports.filter(r => r.subject === subj);
            if (!subjReports.length) return;
            anyData = true;

            // Group by level → typeName
            const levelMap = {};
            subjReports.forEach(r => {
                const lvl = r.level || '기타';
                const type = r.typeName || '기본';
                if (!levelMap[lvl]) levelMap[lvl] = {};
                if (!levelMap[lvl][type]) levelMap[lvl][type] = { attempts: [], totalTime: 0 };
                levelMap[lvl][type].attempts.push(r);
                levelMap[lvl][type].totalTime += (r.timeSpentSeconds || 0);
            });

            const color = SUBJ_COLORS[subj];
            html += `<div style="margin-bottom:24px;">
                <div style="font-size:0.85rem;font-weight:700;color:${color};margin-bottom:12px;">${SUBJ_ICONS[subj]} ${SUBJ_NAMES[subj]}</div>`;

            Object.entries(levelMap).forEach(([level, types]) => {
                html += `<div style="margin-bottom:14px;">
                    <div style="font-size:0.78rem;font-weight:600;color:var(--text-sub);margin-bottom:6px;padding-left:4px;border-left:3px solid ${color}44;padding-left:8px;">${level}</div>`;

                Object.entries(types).forEach(([typeName, data]) => {
                    const { attempts, totalTime } = data;
                    const count = attempts.length;
                    const avgPct = Math.round(attempts.reduce((a, r) => a + (r.totalQuestions > 0 ? r.initialScore / r.totalQuestions * 100 : 0), 0) / count);
                    const bestPct = Math.round(Math.max(...attempts.map(r => r.totalQuestions > 0 ? r.initialScore / r.totalQuestions * 100 : 0)));
                    const timeMin = Math.floor(totalTime / 60);
                    const timeSec = totalTime % 60;
                    const pctColor = avgPct >= 80 ? '#56d364' : avgPct >= 50 ? '#f9826c' : '#ff5f6d';

                    // Round breakdown
                    const rounds = {};
                    attempts.forEach(r => {
                        const rnd = r.round || 1;
                        if (!rounds[rnd]) rounds[rnd] = [];
                        rounds[rnd].push(r);
                    });
                    const roundStr = Object.entries(rounds)
                        .sort((a, b) => a[0] - b[0])
                        .map(([rnd, rs]) => {
                            const rPct = Math.round(rs.reduce((a, r) => a + (r.totalQuestions > 0 ? r.initialScore / r.totalQuestions * 100 : 0), 0) / rs.length);
                            return `${rnd}회차 ${rPct}%`;
                        }).join(' · ');

                    html += `<div style="background:rgba(255,255,255,0.03);border-radius:10px;padding:10px 12px;margin-bottom:6px;">
                        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
                            <span style="font-size:0.82rem;font-weight:600;flex:1;">${typeName}</span>
                            <span style="font-size:0.73rem;color:var(--text-sub);">${count}회 · ${timeMin}분${timeSec ? ' ' + timeSec + '초' : ''}</span>
                            <span style="font-size:0.9rem;font-weight:700;color:${pctColor};">${avgPct}%</span>
                        </div>
                        <div style="height:5px;background:rgba(255,255,255,0.07);border-radius:3px;overflow:hidden;margin-bottom:5px;">
                            <div style="height:100%;width:${avgPct}%;background:${color};border-radius:3px;"></div>
                        </div>
                        <div style="font-size:0.7rem;color:var(--text-sub);">${roundStr}${bestPct !== avgPct ? ` · 최고 <span style="color:#56d364">${bestPct}%</span>` : ''}</div>
                    </div>`;
                });
                html += `</div>`;
            });
            html += `</div>`;
        });

        return anyData ? html : '<div class="empty-msg">데이터가 없습니다.</div>';
    }

    // ── 오답 현황 탭 ──
    function buildWrongTab(wrongAnswers) {
        const subjects = SUBJECT_IDS;
        let html = '<div class="chart-title">복습 시기가 된 오답 (최대 50개)</div>';
        let anyData = false;

        subjects.forEach(s => {
            const items = (wrongAnswers[s] || []).sort((a,b) => (b.count||0) - (a.count||0));
            if (!items.length) return;
            anyData = true;
            const mastered = items.filter(i => i.reviewVersion === LearningPolicy.version && i.isMastered).length;
            html += `
                <div style="margin-bottom:20px;">
                    <div style="font-size:0.85rem; font-weight:700; color:${SUBJ_COLORS[s]}; margin-bottom:8px; display:flex; align-items:center; gap:8px;">
                        ${SUBJ_ICONS[s]} ${SUBJ_NAMES[s]}
                        <span style="font-size:0.72rem; font-weight:400; color:var(--text-sub);">
                            ${items.length}개 · 마스터 ${mastered}개
                        </span>
                    </div>
                    ${items.slice(0,20).map(item => {
                        const id = (s === 'grammar' || s === 'reading') ? (item.question || '학습 문제') : (item.word || item.hanja || item.type || '?');
                        const meaning = s === 'grammar'
                            ? ` · ${item.unitTitle || ''} · 내 답 ${item.selectedAnswer || '-'} / 정답 ${item.correctAnswer || item.answer || '-'}`
                            : s === 'reading'
                                ? ` · ${item.passageTitle || ''} · ${item.skill || '독해'} · 내 답 ${item.selectedAnswer || '-'} / 정답 ${item.correctAnswer || item.answer || '-'}`
                            : (item.meaning ? ` (${item.meaning})` : '');
                        return `
                            <div class="wrong-row">
                                <div class="wrong-identifier">${id}${meaning}</div>
                                <span class="wrong-count">오답 ${item.count||0}회</span>
                                ${item.reviewVersion === LearningPolicy.version && item.isMastered ? '<span class="mastered-badge">✅ 기억 확인</span>' : ''}
                            </div>`;
                    }).join('')}
                </div>`;
        });

        if (!anyData) return '<div class="empty-msg">오답 데이터가 없습니다.</div>';
        return html;
    }

    // ─────────────────────────────────────────────
    //  주간 통계 탭
    // ─────────────────────────────────────────────
    let _weeklyOffset = 0;

    function _weekRange(offset) {
        const now = new Date();
        const dow = now.getDay();
        const mon = new Date(now);
        mon.setDate(now.getDate() - (dow === 0 ? 6 : dow - 1) + offset * 7);
        mon.setHours(0, 0, 0, 0);
        const sun = new Date(mon);
        sun.setDate(mon.getDate() + 6);
        sun.setHours(23, 59, 59, 999);
        return { start: mon, end: sun };
    }

    function _weeklyHTML(reports, offset, ud = {}) {
        const { start, end } = _weekRange(offset);
        const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;

        const wr = reports.filter(r => r.date >= start.getTime() && r.date <= end.getTime());
        const reportSeconds = wr.reduce((a,r) => a + (r.timeSpentSeconds||0), 0);
        const persistedSeconds = offset === 0 && ud.weeklyStats?.weekStart === StudyPeriods.weekly()
            ? (ud.weeklyStats.studyTime || 0)
            : 0;
        const ledgerSeconds = (ud._dailyRecords || []).reduce((sum,row)=>sum+Object.values(row.subjects || {}).reduce((n,item)=>n+(item.learningTime||0)+(item.quizTime||0),0),0);
        const totalMin = Math.round(Math.max(reportSeconds, persistedSeconds, ledgerSeconds) / 60);
        const quizCount = wr.length;
        const avgPct = quizCount > 0
            ? Math.round(wr.reduce((a,r) => a + (r.totalQuestions > 0 ? r.initialScore/r.totalQuestions*100 : 0), 0) / quizCount)
            : 0;
        const studyDays = new Set([...wr.map(r => StudyPeriods.dateKey(new Date(r.date))), ...(ud._dailyRecords||[]).filter(r=>Object.values(r.subjects||{}).some(s=>(s.learningTime||0)+(s.quizTime||0)>0)).map(r=>r.date)]).size;

        const weekMonth = start.getMonth() + 1;
        const weekNum   = Math.ceil(start.getDate() / 7);
        const weekLabel = offset === 0 ? '이번 주' : `${start.getFullYear()}년 ${weekMonth}월 ${weekNum}주차`;

        const summaries = [
            { icon:'⏱', val: totalMin+'분',              lbl:'학습 시간' },
            { icon:'📝', val: quizCount+'회',             lbl:'퀴즈 횟수' },
            { icon:'🎯', val: quizCount ? avgPct+'%':'-', lbl:'평균 정답률' },
            { icon:'📅', val: studyDays+'일',             lbl:'학습 일수' },
        ];

        return `
        <div style="font-size:0.95rem;font-weight:700;margin-bottom:14px;">주간 학습 통계</div>

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
            <button onclick="window._navWeek(-1)" style="background:rgba(255,255,255,0.06);border:1px solid var(--card-border);color:var(--text-sub);padding:6px 16px;border-radius:20px;cursor:pointer;font-family:inherit;font-size:0.82rem;">← 이전</button>
            <div style="text-align:center;">
                <div style="font-size:0.92rem;font-weight:700;">${weekLabel}</div>
                <div style="font-size:0.72rem;color:var(--text-sub);margin-top:2px;">${fmt(start)} ~ ${fmt(end)}</div>
            </div>
            <button onclick="window._navWeek(1)" ${offset >= 0 ? 'disabled' : ''} style="background:rgba(255,255,255,0.06);border:1px solid var(--card-border);color:${offset >= 0 ? 'rgba(255,255,255,0.15)' : 'var(--text-sub)'};padding:6px 16px;border-radius:20px;cursor:${offset >= 0 ? 'default' : 'pointer'};font-family:inherit;font-size:0.82rem;">다음 →</button>
        </div>

        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;">
            ${summaries.map(c => `
            <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:12px 6px;text-align:center;">
                <div style="font-size:1.05rem;margin-bottom:4px;">${c.icon}</div>
                <div style="font-size:0.95rem;font-weight:700;">${c.val}</div>
                <div style="font-size:0.62rem;color:var(--text-sub);margin-top:3px;">${c.lbl}</div>
            </div>`).join('')}
        </div>

        <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:16px;margin-bottom:12px;">
            <div style="font-size:0.82rem;font-weight:700;margin-bottom:12px;">일별 학습 시간 (분) · 빈 날짜는 미학습 확정이 아닌 기록 미확인입니다.</div>
            <canvas id="adminChartDaily" height="150"></canvas>
        </div>

        <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:16px;">
            <div style="font-size:0.82rem;font-weight:700;margin-bottom:12px;">8주 정답률 추이</div>
            <canvas id="adminChartTrend" height="150"></canvas>
        </div>`;
    }

    function _drawWeeklyCharts(reports, offset, ud = {}) {
        if (window._adminWeekCharts) {
            Object.values(window._adminWeekCharts).forEach(c => c && c.destroy());
        }
        window._adminWeekCharts = {};

        const SUBJ   = SUBJECT_IDS;
        const NAMES  = { english:'영어 단어', grammar:'영어 문법', hanja:'한자', math:'수학', reading:'국어 독해력' };
        const COLORS = { english:'#4facfe', grammar:'#a78bfa', hanja:'#f9826c', math:'#56d364', reading:'#fb7185' };
        const FILL   = { english:'rgba(79,172,254,0.75)', grammar:'rgba(167,139,250,0.75)', hanja:'rgba(249,130,108,0.75)', math:'rgba(86,211,100,0.75)', reading:'rgba(251,113,133,0.75)' };
        const gridColor = 'rgba(255,255,255,0.06)';
        const tickColor = '#8b949e';
        const fontCfg   = { family:'Outfit', size:11 };

        // ── Chart 1: 일별 학습 시간 (stacked bar) ──
        const { start, end } = _weekRange(offset);
        const wr = reports.filter(r => r.date >= start.getTime() && r.date <= end.getTime());

        const dailyMin = {};
        SUBJ.forEach(s => { dailyMin[s] = [0,0,0,0,0,0,0]; });
        wr.forEach(r => {
            const dow = new Date(r.date).getDay();
            const idx = dow === 0 ? 6 : dow - 1;
            if (dailyMin[r.subject]) dailyMin[r.subject][idx] += Math.round((r.timeSpentSeconds||0) / 60);
        });

        // Reports contain quiz time. Use today's persisted subject total when
        // it includes more active learning time than the report-only value.
        if (offset === 0 && ud.dailyStats?.date === StudyPeriods.daily()) {
            const dow = new Date().getDay();
            const idx = dow === 0 ? 6 : dow - 1;
            SUBJ.forEach(subject => {
                const totalSeconds = ud.dailyStats.studyTime?.[subject] || 0;
                dailyMin[subject][idx] = Math.max(dailyMin[subject][idx], Math.round(totalSeconds / 60));
            });
        }

        for (const row of ud._dailyRecords || []) {
            const date = new Date(`${row.date}T12:00:00+09:00`);
            const index = (date.getDay() + 6) % 7;
            for (const [subject,item] of Object.entries(row.subjects || {})) if (dailyMin[subject])
                dailyMin[subject][index] = Math.max(dailyMin[subject][index], Math.round(((item.learningTime||0)+(item.quizTime||0))/60));
        }
        const ctx1 = document.getElementById('adminChartDaily')?.getContext('2d');
        if (ctx1) {
            window._adminWeekCharts.daily = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: ['월','화','수','목','금','토','일'],
                    datasets: SUBJ.map(s => ({
                        label: NAMES[s], data: dailyMin[s],
                        backgroundColor: FILL[s], borderRadius: 4, borderSkipped: false,
                    }))
                },
                options: {
                    responsive: true, maintainAspectRatio: true,
                    plugins: { legend: { labels: { color: tickColor, font: fontCfg, boxWidth: 12 } } },
                    scales: {
                        x: { stacked: true, ticks: { color: tickColor, font: fontCfg }, grid: { color: gridColor } },
                        y: { stacked: true, ticks: { color: tickColor, font: fontCfg }, grid: { color: gridColor },
                             title: { display: true, text: '분', color: tickColor, font: fontCfg } }
                    }
                }
            });
        }

        // ── Chart 2: 8주 정답률 추이 — 최초 시도(initialScore) vs 오답 재시도(finalScore) ──
        const weekLabels = [];
        const trendData = {};
        const SCORE_FLOOR = 50;
        const scoreFloorLabelPlugin = {
            id: 'adminScoreFloorLabel',
            afterDatasetsDraw(chart) {
                const { ctx } = chart;
                ctx.save();
                ctx.fillStyle = '#fca5a5';
                ctx.font = '700 11px Outfit, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                chart.data.datasets.forEach((dataset, datasetIndex) => {
                    const meta = chart.getDatasetMeta(datasetIndex);
                    meta.data.forEach((point, index) => {
                        const actual = dataset.actualScores?.[index];
                        if (actual !== null && actual !== undefined && actual < SCORE_FLOOR) {
                            ctx.fillText(`${actual}`, point.x, point.y - 7);
                        }
                    });
                });
                ctx.restore();
            }
        };
        SUBJ.forEach(s => { trendData[s] = { init: [], final: [] }; });

        for (let i = -7; i <= 0; i++) {
            const { start: ws, end: we } = _weekRange(offset + i);
            weekLabels.push(`${ws.getMonth()+1}/${ws.getDate()}`);
            SUBJ.forEach(s => {
                const sr = reports.filter(r => r.subject === s && r.date >= ws.getTime() && r.date <= we.getTime());
                const avg = (arr, field) => arr.length > 0
                    ? Math.round(arr.reduce((a, r) => a + (r.totalQuestions > 0 ? (r[field] ?? r.initialScore) / r.totalQuestions * 100 : 0), 0) / arr.length)
                    : null;
                // 오답 재시도가 있었던 세션만 finalScore가 initialScore보다 높음
                const retried = sr.filter(r => (r.finalScore ?? r.initialScore) > r.initialScore);
                trendData[s].init.push(avg(sr, 'initialScore'));
                trendData[s].final.push(retried.length > 0 ? avg(retried, 'finalScore') : null);
            });
        }

        const ctx2 = document.getElementById('adminChartTrend')?.getContext('2d');
        if (ctx2) {
            const datasets = [];
            SUBJ.forEach(s => {
                const hasInit  = trendData[s].init.some(v => v !== null);
                const hasFinal = trendData[s].final.some(v => v !== null);
                if (hasInit) datasets.push({
                    label: `${NAMES[s]} 최초`,
                    data: trendData[s].init.map(v => v === null ? null : Math.max(SCORE_FLOOR, v)),
                    actualScores: trendData[s].init,
                    borderColor: COLORS[s], backgroundColor: COLORS[s] + '22',
                    fill: false, tension: 0.35, spanGaps: true,
                    pointRadius: 4, pointBackgroundColor: COLORS[s],
                    borderDash: [],
                });
                if (hasFinal) datasets.push({
                    label: `${NAMES[s]} 재시도`,
                    data: trendData[s].final.map(v => v === null ? null : Math.max(SCORE_FLOOR, v)),
                    actualScores: trendData[s].final,
                    borderColor: COLORS[s], backgroundColor: COLORS[s] + '11',
                    fill: false, tension: 0.35, spanGaps: true,
                    pointRadius: 3, pointBackgroundColor: COLORS[s],
                    borderDash: [5, 4],
                });
            });
            window._adminWeekCharts.trend = new Chart(ctx2, {
                type: 'line',
                data: { labels: weekLabels, datasets },
                options: {
                    responsive: true, maintainAspectRatio: true,
                    plugins: { legend: { labels: { color: tickColor, font: fontCfg, boxWidth: 12 } } },
                    scales: {
                        x: { ticks: { color: tickColor, font: fontCfg }, grid: { color: gridColor } },
                        y: { min: SCORE_FLOOR, max: 100,
                             ticks: { color: tickColor, font: fontCfg, callback: v => v + '%' },
                             grid: { color: gridColor } }
                    }
                },
                plugins: [scoreFloorLabelPlugin]
            });
        }
    }

    window.switchTab = switchTab;

    window._navWeek = async function(delta) {
        const next = _weeklyOffset + delta;
        if (next > 0) return;
        _weeklyOffset = next;
        try { await loadAdminWeek(next); }
        catch(error) { document.getElementById('tabContent').textContent = '기록을 받지 못했습니다. 다시 시도해 주세요.'; }
    };

    // ─────────────────────────────────────────────
    //  이벤트
    // ─────────────────────────────────────────────
    document.getElementById('backBtn').addEventListener('click', () => {
        document.getElementById('userDetailView').style.display = 'none';
        document.getElementById('userListView').style.display   = 'block';
    });

    // ─────────────────────────────────────────────
    //  초기화
    // ─────────────────────────────────────────────
    // ─────────────────────────────────────────────
    //  학습 시간 설정 저장/로드
    // ─────────────────────────────────────────────
    function loadStudyTimeConfig() {
        const cfg = StudyTimer.getConfig();
        const subjectOrder = SUBJECT_IDS;
        const inputs = document.getElementById('studyTimeInputs');
        inputs.innerHTML = subjectOrder.map(subject => {
            const info = SubjectRegistry.get(subject);
            const levels = StudyTimer.LEVELS[subject] || [];
            return `<section style="padding:14px;border:1px solid var(--card-border);border-radius:12px;background:rgba(255,255,255,.025);">
                <div style="font-size:.88rem;font-weight:800;margin-bottom:10px;">${info.icon} ${info.name}</div>
                <div style="display:grid;gap:8px;">${levels.map(level => {
                    const value = cfg.levels?.[subject]?.[level.key] ?? cfg[subject] ?? StudyTimer.DEFAULTS[subject];
                    return `<label style="display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.78rem;color:var(--text-sub);">
                        <span>${level.label}</span>
                        <span style="display:flex;align-items:center;gap:5px;">
                            <input type="number" min="0" max="60" value="${value}" data-study-subject="${subject}" data-study-level="${level.key}" style="width:52px;padding:6px;border-radius:8px;border:1px solid var(--card-border);background:rgba(255,255,255,.06);color:var(--text);text-align:center;font-family:var(--font);font-size:.9rem;">
                            <span>분</span>
                        </span>
                    </label>`;
                }).join('')}</div>
            </section>`;
        }).join('');
    }

    function saveStudyTimeConfig() {
        const cfg = StudyTimer.getConfig();
        cfg.levels = {};
        document.querySelectorAll('[data-study-subject][data-study-level]').forEach(input => {
            const subject = input.dataset.studySubject;
            const level = input.dataset.studyLevel;
            cfg.levels[subject] = cfg.levels[subject] || {};
            cfg.levels[subject][level] = Math.max(0, parseInt(input.value, 10) || 0);
        });
        StudyTimer.setConfig(cfg);
        SmartStudy.FirestoreRepository.saveStudyTimeConfig(cfg)
            .catch(e => console.warn('[Admin] studyConfig 업로드 실패:', e.message));
        const msg = document.getElementById('stcSavedMsg');
        msg.style.display = 'inline';
        setTimeout(() => { msg.style.display = 'none'; }, 2000);
    }
    window.saveStudyTimeConfig = saveStudyTimeConfig;

    document.addEventListener('DOMContentLoaded', async () => {
            await window.SmartStudy?.LocalRepository?.ready;
        const me = typeof UserSession !== 'undefined' ? UserSession.getActiveUser() : null;
        if (!me || !ADMIN_IDS.includes(me)) {
            document.querySelector('.wrap').innerHTML = `
                <div style="text-align:center; padding:80px 20px; color:var(--text-sub);">
                    🔒 관리자 전용 페이지입니다.<br>
                    <a href="index.html" style="color:var(--accent); text-decoration:none; margin-top:20px; display:inline-block;">← 홈으로</a>
                </div>`;
            return;
        }

        loadStudyTimeConfig();

        try {
            await initFirebase();
            const users = await loadAllUsers();
            document.getElementById('adminGate').style.display = 'none';
            document.getElementById('userListView').style.display = 'block';
            renderUserList(users);
            renderParentPlanSettings(users);
        } catch(e) {
            const loginRequired = e?.code === 'auth/login-required' || e?.code === 'permission-denied';
            document.getElementById('adminGate').innerHTML = loginRequired
                ? `<div class="error-msg" style="display:flex; flex-direction:column; align-items:center; gap:12px;">
                    <span>🔐 관리자 이름과 허용된 Google 관리자 계정이 모두 필요합니다.</span>
                    <button type="button" class="detail-back" onclick="connectAdminCloud(this)" style="margin:0;">Google로 관리자 연결</button>
                  </div>`
                : `<div class="error-msg">⚠️ Firebase 연결 실패: ${e.message}</div>`;
        }
    });
    </script>
<script src="version-check.js"></script>
</body>
