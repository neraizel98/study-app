<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>십자말 숲 · 포켓몬 학습 게임</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="learning-games.css?v=20261106-free-chain" />
    <link rel="stylesheet" href="arcade.css?v=20261106-free-chain" />
  </head>
  <body class="arcade">
    <main class="games-shell">
      <nav class="arcade-nav">
        <a href="game-menu.html">◀ 게임 선택</a><span>WORD QUEST</span>
      </nav>
      <header class="game-hero arcade-hero">
        <div>
          <p class="eyebrow">PIKACHU WORD QUEST</p>
          <h1>십자말 숲</h1>
          <p>낱말을 채우고 다음 스테이지로!</p>
        </div>
        <div class="companion">
          <img
            src="assets/game-companions/25.png"
            alt="피카츄"
            width="144"
            height="144"
          />
        </div>
      </header>
      <section id="gameSetupPanel" class="game-panel arcade-setup">
        <div id="gameSetup"></div>
        <details class="arcade-rules">
          <summary>게임 방법</summary>
          <p>
            번호를 누르고 낱말을 입력해요. 정답마다 100점, 첫 글자 힌트는 20점
            차감. 제한 시간은 10분이에요.
          </p>
        </details>
      </section>
      <section id="gamePlay" class="game-panel" hidden>
        <div class="play-header">
          <h2 id="puzzleTitle">십자말 숲</h2>
          <button id="changeLevel" class="arcade-quiet">레벨 선택</button>
          <span id="gameClock" class="clock"></span>
        </div>
        <div class="play-layout">
          <div
            id="crosswordGrid"
            class="crossword-grid"
            role="group"
            aria-label="십자말풀이 판"
          ></div>
          <div class="clue-panel">
            <p id="selectedClue"></p>
            <label id="answerLabel" for="wordAnswer">낱말 입력</label
            ><input id="wordAnswer" autocomplete="off" spellcheck="false" />
            <div class="actions">
              <button id="saveWord" class="primary">칸에 넣기</button
              ><button id="wordHint">첫 글자 힌트 −20</button>
            </div>
            <p id="hintStatus" role="status"></p>
            <div id="clueList"></div>
          </div>
        </div>
        <p id="filledStatus"></p>
        <div class="actions">
          <button id="submitGame" class="primary">답안 제출</button
          ><button id="leaveGame">나중에 이어하기</button>
        </div>
        <div id="gameResult" aria-live="polite"></div>
        <button id="nextGame" class="arcade-start" hidden>다음 게임 ▶</button>
      </section>
      <footer>
        캐릭터 이미지 ·
        <a href="https://github.com/PokeAPI/sprites">PokeAPI Sprites</a>.
        Pokémon © Nintendo / Creatures / GAME FREAK.
      </footer>
    </main>
    <script src="storage-keys.js"></script>
    <script src="storage-events.js"></script>
    <script src="schema-migrations.js"></script>
    <script src="durable-store.js"></script>
    <script src="local-repository.js"></script>
    <script src="app-bootstrap.js"></script>
    <script src="functions/crossword-core.js"></script>
    <script src="game-levels.js?v=20261106-free-chain"></script>
    <script src="game-setup.js?v=20261106-free-chain"></script>
    <script src="learning-games.js?v=20261106-free-chain"></script>
  </body>
</html>
