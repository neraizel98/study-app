name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run repository tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in *.test.js; do
            node "$test_file"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare tracked site files
        run: mkdir -p _site && git archive HEAD | tar -x -C _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Wait for uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in $(seq 1 30); do
            count=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?name=$ARTIFACT_NAME" --jq '.total_count')
            if [ "$count" = "1" ]; then exit 0; fi
            sleep 2
          done
          echo "Expected exactly one uploaded Pages artifact"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
