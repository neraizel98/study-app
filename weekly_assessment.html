<script>
(async function(){
    await SmartStudy.LocalRepository.ready;
    const user=SmartStudy.LocalRepository.getActiveUser();if(!user){location.href='index.html';return;}
    const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
    const exam=params.get('mode')==='exam',form=params.get('form')==='B'?'B':'A';
    const practice=params.get('mode')==='practice',taskId=params.get('task');
    const session=SmartStudy.LearningSession,planApi=SmartStudy.LearningPlan,assessment=SmartStudy.WeeklyAssessment;
    const names={reading:'국어 독해',english:'영어 단어',grammar:'영어 문법',english_reading:'영어 독해',math:'수학',math_formula:'수학 공식',hanja:'한자'};
    const weekStart=()=>new Date(assessment.boundaries(Date.now()).start).toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});
    const plan=practice?planApi.getPlan(user):null,task=plan?.tasks.find(item=>item.id===taskId);
    if(practice&&!task){$('empty').hidden=false;$('empty').textContent='오늘 학습 과제를 찾지 못했습니다.';return;}
    const sessionId=practice?`practice:${plan.id}:${taskId}:${params.get('run')||'first'}`:`${exam?"exam-"+form:"assessment"}:${user}:${weekStart()}`;
    $('back').href=practice?'today.html':'index.html';
    $('title').textContent=practice?`${names[task.subject]} 문항 연습`:'주간 학습 확인';
    $('intro').textContent=practice?'선택한 단원의 문항으로 연습합니다. 답안은 이 기기에 저장되어 이어 풀 수 있습니다.':'7개 활동을 확인합니다. 활동별 최대 5문항 중 이번 주 3문항, 이전 4주 2문항입니다. 학습 범위가 부족하면 문항을 줄이며, 기존 지문·예문의 재확인을 새 상황 평가로 보지 않습니다.';
    if(exam){document.body.classList.add('exam-page');document.title='학습 모의고사 · Smart Study';$('title').textContent='학습 모의고사';$('intro').textContent='국어 사실·추론, 영어 달 관찰 독해, 초6 비례식을 새로운 상황에서 확인합니다. A/B형 각각 최대 9문항 · 15분. 배운 범위만 출제하며 시간이 지나면 현재 답안으로 제출합니다. 화면을 닫아도 제한 시간은 흐릅니다. 단답은 자동 채점하고 풀이 설명은 해설과 직접 비교합니다. 학교 성적·등수를 예측하는 검사는 아닙니다.';}
    if(exam){
        const heading=document.createElement('header');heading.className='exam-paper-heading';
        const kicker=document.createElement('p');kicker.className='paper-kicker';kicker.textContent='SMART STUDY · 중학교 준비';
        $('title').before(heading);heading.append(kicker,$('title'));
        const subtitle=document.createElement('p');subtitle.className='exam-subtitle';subtitle.textContent='배운 내용을 낯선 문제에 적용해 보세요.';heading.append(subtitle);
        const guide=document.createElement('details');guide.className='exam-guide';const summary=document.createElement('summary');summary.textContent='시험 안내 · 최대 9문항 / 15분';$('intro').before(guide);guide.append(summary,$('intro'));
        const warning=document.createElement('p');warning.className='scope-note';warning.textContent='시작 후에는 화면을 닫아도 시간이 흐르며, 종료 시 현재 답안으로 자동 제출됩니다.';guide.after(warning);
    }
    let draft=session.get(user,sessionId),groups;
    if(exam&&!draft&&!params.has('start')){const box=$('empty');box.hidden=false;box.textContent='출제 범위: 국어 사실 확인과 추론 · 영어 달 관찰 독해 · 초6 비례식. 완료한 퀴즈 기록이 있는 범위만 포함합니다. 준비되면 시험지를 선택하세요.';for(const f of ['A','B']){const a=document.createElement('a');a.href=`?mode=exam&form=${f}&start=1`;a.textContent=` ${f}형 시작 (15분) `;a.className='exam-start-link';box.append(a);}return;}
    if(!draft){
        if(practice){
            const scope={context:task.context,seenKeys:new Set(),learnedWords:new Set()};
            if(task.subject==='english')for(const word of window.vocabData?.[task.context?.unitId]||[])scope.learnedWords.add(word.word.toLowerCase());
            const band=LearningPolicy.evaluate(SmartStudy.LocalRepository.listReports(user),task.subject,LearningPolicy.context(task.subject,task.context)).name;
            groups={[task.subject]:assessment.buildAssessmentItems({subject:task.subject,scope,count:5,mode:'practice',band})};
            groups[task.subject].adaptiveBandSnapshot=band;
        }else groups=exam?SmartStudy.ExamTraining.build(user,form):assessment.buildWeekly(user,5);
        const questions=Object.values(groups).flatMap(group=>group.items||[]);
        const candidate={userId:user,sessionId,planId:plan?.id||null,taskId:task?.id||null,
            mode:exam?'exam':practice?'practice':'assessment',examDeadline:exam?Date.now()+SmartStudy.ExamTraining.limitSeconds*1000:null,reasoning:{},subject:task?.subject||'mixed',context:task?.context||null,
            questions,responses:{},cursor:0,activeSeconds:0,subjectSeconds:{reading:0,english:0,math:0},
            requestedCounts:Object.fromEntries(Object.entries(groups).map(([subject,group])=>[subject,group.requestedCount])),
            adaptiveBandSnapshot:practice?groups[task.subject].adaptiveBandSnapshot:'standard',
            submittedAt:null};
        draft=questions.length?session.save(user,candidate):candidate;
    }
    if(!practice&&!exam&&draft.questions.length&&!draft.questions.some(q=>q.period)){$('intro').textContent+=' 이전에 시작한 평가의 문항과 답안은 그대로 유지합니다.';}
    const requested=draft.requestedCounts||{},actual={};for(const question of draft.questions)actual[question.subject]=(actual[question.subject]||0)+1;
    for(const subject of practice?[task.subject]:exam?["reading","english_reading","math"]:assessment.subjects){
        const label=document.createElement('span');label.textContent=exam?`${names[subject]} · ${actual[subject]?actual[subject]+'문항':'이번 시험 제외'}`:`${names[subject]} ${actual[subject]||0}/${requested[subject]||5}문항`;if(exam&&!actual[subject])label.className='empty-subject';$('counts').append(label);
    }
    if(!draft.questions.length){$('empty').hidden=false;$('empty').textContent='최근 학습 범위에서 낼 수 있는 검증 문항이 없습니다. 학습 후 다시 확인해 주세요.';return;}
    const ownsSession=()=>SmartStudy.LocalRepository.getActiveUser()===draft.userId;
    const accountGuard=()=>{if(ownsSession())return true;$('work').hidden=true;$('empty').hidden=false;$('empty').textContent='계정이 바뀌었습니다. 원래 학습자 계정으로 돌아가 주세요.';return false;};
    window.addEventListener('storage',accountGuard);
    window.addEventListener('focus',accountGuard);
    if(!accountGuard())return;
    if(Object.entries(requested).some(([subject,count])=>(actual[subject]||0)<count)){
        const label=document.createElement('p');label.className='muted scope-note';label.textContent=exam?'학습 완료 기록이 있는 범위만 출제했습니다.':'이번 주 또는 이전 4주 기록이 부족한 활동은 문항 수를 줄였습니다. 미학습 범위로 채우지 않습니다.';$('counts').after(label);
    }
    let activeDelta=0,submitting=false,saveError='',reasoningOpen=false,firstAnswerRecorded=Boolean(Object.keys(draft.responses||{}).length);
    const clock=session.createClock(seconds=>{
        if(draft.submittedAt||draft.submissionSnapshot)return;
        draft.activeSeconds+=seconds;const subject=draft.questions[draft.cursor]?.subject;
        if(subject)draft.subjectSeconds[subject]=(draft.subjectSeconds[subject]||0)+seconds;
        activeDelta+=seconds;
    });
    function persist(){if(draft.submittedAt||activeDelta<=0||!accountGuard())return;draft=session.save(user,draft);activeDelta=0;}
    const timer=setInterval(()=>{clock.tick();persist();},1000);
    ['click','keydown','touchstart','scroll'].forEach(name=>window.addEventListener(name,clock.mark,{passive:true}));
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')clock.start();else{clock.stop();persist();}});
    window.addEventListener('pagehide',()=>{clock.stop();persist();clearInterval(timer);});
    if(!draft.submittedAt)clock.start();
    function expired(){return Boolean(exam&&draft.examDeadline&&Date.now()>=draft.examDeadline);}
    function isCorrect(q,value){return exam?SmartStudy.ExamTraining.correct(q,value):value===q.answer;}
    function answered(q){return String(draft.responses[q.id]??'').trim().length>0;}
    function updateProgress(){
        if(!exam)return;
        const count=draft.questions.filter(answered).length;
        $('answerProgress').textContent=`${form}형 · ${count} / ${draft.questions.length}문항 응답`;
        $('answerMeter').max=draft.questions.length;$('answerMeter').value=count;
        $('questionNav').replaceChildren();
        draft.questions.forEach((q,index)=>{const b=document.createElement('button');b.type='button';b.textContent=String(index+1);b.className=(answered(q)?'answered ':'')+(index===draft.cursor?'current':'');b.setAttribute('aria-label',`${index+1}번 · ${names[q.subject]} · ${answered(q)?'응답 완료':'미응답'}`);if(index===draft.cursor)b.setAttribute('aria-current','step');b.onclick=()=>{if(!accountGuard()||submitting)return;draft.cursor=index;if(!draft.submittedAt)draft=session.save(user,draft);render();focusQuestion();};$('questionNav').append(b);});
        const result=$('summaryResult');result.hidden=!draft.submittedAt;
        if(draft.submittedAt){const correct=draft.questions.filter(q=>isCorrect(q,draft.responses[q.id])).length;result.textContent=`제출 완료 · ${draft.questions.length}문항 중 ${correct}문항 정답. 문항 번호를 눌러 내 답과 해설을 확인하세요. 풀이 설명은 직접 점검합니다.`;}
    }
    function focusQuestion(){if(exam){$('question').setAttribute('tabindex','-1');$('question').focus({preventScroll:true});$('work').scrollIntoView({block:'start',behavior:'auto'});}}
    function render(){
        const q=draft.questions[draft.cursor];$('work').hidden=false;
        $('position').textContent=exam?`${names[q.subject]} 영역 · ${draft.cursor+1}번 / ${draft.questions.length}번${q.repeated?' · 재연습':''}`:`${names[q.subject]} · ${draft.cursor+1}/${draft.questions.length} · ${q.sourceType||'학습 문항'}`;
        if(exam){const points=document.createElement('span');points.className='question-points';points.textContent='정답 1개당 1점 · '+(q.kind==='written'?'단답형':'객관식');$('position').append(points);}
        if(['math','math_formula'].includes(q.subject))$('question').innerHTML=Utils.renderMath(q.question);
        else $('question').textContent=q.question;
        $('passage').replaceChildren();
        if(q.passageLines?.length){const box=document.createElement('div');box.className='passage';if(exam){const caption=document.createElement('span');caption.className='passage-label';caption.textContent='다음 글을 읽고 물음에 답하세요.';box.append(caption,document.createTextNode(q.passageLines.join('\n')));}else box.textContent=`${q.passageTitle||''}\n${q.passageLines.join('\n')}`;$('passage').append(box);}
        $('choices').replaceChildren();
        for(const choice of q.choices){const button=document.createElement('button');button.type='button';button.className='choice'+(draft.responses[q.id]===choice?' selected':'');if(['math','math_formula'].includes(q.subject))button.innerHTML=Utils.renderMath(choice);else button.textContent=choice;if(exam){const text=document.createElement('span');while(button.firstChild)text.append(button.firstChild);const number=document.createElement('span');number.className='choice-number';number.textContent=String(q.choices.indexOf(choice)+1);button.append(number,text);button.setAttribute('aria-pressed',String(draft.responses[q.id]===choice));}button.disabled=Boolean(draft.submittedAt||draft.submissionSnapshot||submitting||expired());button.onclick=()=>{if(!accountGuard()||submitting||draft.submissionSnapshot||expired())return;if(!firstAnswerRecorded){firstAnswerRecorded=true;SmartStudy.InAppStudyRequest?.recordActualStart({source:'weekly-answer',subject:q.subject,startedAt:Date.now()}).catch(error=>console.warn('[Study activity]',error.message));}draft.responses[q.id]=choice;draft=session.save(user,draft);render();if(exam)document.querySelector('.choice.selected')?.focus({preventScroll:true});};$('choices').append(button);}
        if(exam&&q.kind==='written'){const input=document.createElement('input');input.type='text';input.setAttribute('aria-label','직접 답 쓰기');input.placeholder='문제에서 요구한 답만 쓰세요';input.id='writtenAnswer';const label=document.createElement('label');label.className='answer-label';label.htmlFor='writtenAnswer';label.textContent='답안 작성';$('choices').append(label);input.value=draft.responses[q.id]||'';input.disabled=Boolean(draft.submittedAt||draft.submissionSnapshot||expired());input.oninput=()=>{if(!accountGuard()||expired()||draft.submissionSnapshot)return;draft.responses[q.id]=input.value;draft=session.save(user,draft);updateProgress();};$('choices').append(input);}
        if(exam){const detail=document.createElement('details');detail.className='reasoning-box';detail.open=reasoningOpen||Boolean(draft.reasoning?.[q.id]);const summary=document.createElement('summary');summary.textContent='풀이와 근거 쓰기 · 선택';const note=document.createElement('p');note.textContent='점수에는 포함하지 않습니다. 제출 후 해설과 비교해 보세요.';detail.append(summary,note);detail.ontoggle=()=>{reasoningOpen=detail.open;};const reasoning=document.createElement('textarea');reasoning.setAttribute('aria-label','풀이와 근거 (점수에 포함하지 않음)');reasoning.placeholder='어떻게 구했나요? 지문의 근거나 계산 과정을 써 보세요. (직접 점검용)';reasoning.value=draft.reasoning?.[q.id]||'';reasoning.disabled=Boolean(draft.submittedAt||draft.submissionSnapshot||expired());reasoning.oninput=()=>{if(!accountGuard()||expired()||draft.submissionSnapshot)return;draft.reasoning=draft.reasoning||{};draft.reasoning[q.id]=reasoning.value;draft=session.save(user,draft);};detail.append(reasoning);$('choices').append(detail);}
        $('result').hidden=!draft.submittedAt;
        if(draft.submittedAt){const selected=draft.responses[q.id]||'(미응답)';$('result').textContent=`${isCorrect(q,selected)?'정답':'오답'} · 내 답: ${selected} · 정답: ${q.answer}\n${q.explanation||''}`;}
        $('prev').disabled=draft.cursor===0;$('next').disabled=draft.cursor===draft.questions.length-1;
        $('submit').hidden=Boolean(draft.submittedAt);
        $('saved').classList.toggle('error',Boolean(saveError));$('saved').textContent=saveError||(draft.submittedAt?'제출 완료 · 답안과 해설을 확인하세요.':`이 기기에 답안 저장됨 · 실제 활동 ${Math.floor(draft.activeSeconds/60)}분`);updateProgress();
    }
    $('prev').onclick=()=>{if(!accountGuard()||submitting)return;draft.cursor--;if(!draft.submittedAt)draft=session.save(user,draft);render();focusQuestion();};
    $('next').onclick=()=>{if(!accountGuard()||submitting)return;draft.cursor++;if(!draft.submittedAt)draft=session.save(user,draft);render();focusQuestion();};
    async function submitAnswers(){
        if(draft.submittedAt||submitting||!accountGuard())return;
        submitting=true;saveError='';if(exam&&$('submitDialog').open)$('submitDialog').close();
        clock.stop();persist();
        $('submit').disabled=true;
        try{
            if(!draft.submissionSnapshot){
                draft.submissionSnapshot={responses:{...draft.responses},reasoning:{...draft.reasoning},subjectSeconds:{...draft.subjectSeconds},submittedAt:Date.now()};
                draft=session.save(user,draft);
            }
            const snapshot=draft.submissionSnapshot,submittedAt=snapshot.submittedAt;
            const selectedSubjects=practice?[task.subject]:[...new Set(draft.questions.map(q=>q.subject))];
            for(const subject of selectedSubjects){
                if(!accountGuard())throw new Error('계정이 바뀌었습니다.');
                const questions=draft.questions.filter(q=>q.subject===subject);if(!questions.length)continue;
                const attempts=questions.map(q=>({questionId:q.id,question:q.question,word:q.subject==='english'?q.answer:undefined,selectedAnswer:snapshot.responses[q.id]||'',
                    correctAnswer:q.answer,correct:isCorrect(q,snapshot.responses[q.id]),reasoning:snapshot.reasoning?.[q.id]||'',answerKind:q.kind||'choice',context:q.context,
                    explanation:q.explanation,choices:q.choices,passageText:q.passageLines||[],passageId:q.passageId,period:q.period,sourceType:q.sourceType,generator:q.generator,assisted:false}));
                const score=attempts.filter(a=>a.correct).length;
                const context=questions[0].context;
                const reportId=practice?sessionId:`${sessionId}:${subject}`;
                const existing=SmartStudy.LocalRepository.listReports(user).find(r=>r.sessionId===reportId&&r.metadata?.submittedAt);
                if(practice&&typeof WrongNote!=='undefined')attempts.forEach((attempt,index)=>{
                    const q=questions[index],c=q.context||{};
                    const data={...c,questionId:q.id,question:q.question,choices:q.choices,answer:q.answer,
                        correctAnswer:q.answer,selectedAnswer:attempt.selectedAnswer,explanation:q.explanation,
                        passageId:q.passageId,passageText:q.passageLines||[],passageTitle:q.passageTitle,
                        type:['math','math_formula'].includes(q.subject)?(q.generator||q.id):q.id,
                        word:q.subject==='english'?q.answer:undefined,
                        level:q.subject==='english'?c.unitId:undefined};
                    WrongNote.save(subject,data,attempt.correct?'correct':'wrong',reportId,1);
                });
                if(existing)continue;
                saveQuizResult(reportId,subject==='math_formula'?'math':subject,
                    practice?`${names[subject]} 오늘 연습`:`${names[subject]} ${exam?'학습 모의고사 '+form:'주간 확인'}`,questions.length,score,score,
                    Math.floor(snapshot.subjectSeconds[subject]||0),score===questions.length,
                    {...context,...(subject==='math_formula'?{source:'math-formula',assessmentSubject:'math_formula',formulaNumber:Number(context.unitId.replace('formula-',''))}:{}),assessment:!practice,practice,examTraining:exam,examForm:exam?form:null,timeLimitSeconds:exam?900:null,timedOut:exam&&expired(),periodCounts:{current:questions.filter(q=>q.period==='current').length,previous:questions.filter(q=>q.period==='previous').length},assessmentId:practice?null:sessionId,
                        planId:plan?.id||null,taskId:task?.id||null,
                        adaptiveBandSnapshot:draft.adaptiveBandSnapshot,
                        submittedAt,status:'submitted',attempts,requestedCount:requested[subject],actualCount:questions.length});
            }
            await SmartStudy.LocalRepository.flush?.();
            if(!accountGuard())throw new Error('계정이 바뀌었습니다.');
            draft=session.submit(user,sessionId);
            if(practice)planApi.refreshEvidence(user);
            render();
        }catch(error){console.error(error);saveError='기록을 저장하지 못했습니다. 답안 제출을 눌러 다시 시도해 주세요.';}
        finally{submitting=false;$('submit').disabled=false;render();}
    };
    $('submit').onclick=()=>{if(!accountGuard()||submitting||draft.submittedAt)return;if(!exam||expired()||draft.submissionSnapshot){submitAnswers();return;}const missing=draft.questions.filter(q=>!answered(q)).length;$('submitMessage').textContent=missing?`아직 ${missing}문항에 답하지 않았습니다. 그대로 제출하면 미응답은 오답으로 처리됩니다.`:'모든 문항에 답했습니다. 제출하면 답안을 바꿀 수 없습니다.';$('reviewUnanswered').textContent=missing?'미응답 확인':'계속 풀기';$('submitDialog').showModal();};
    if(exam){
        const toolbar=document.createElement('div');toolbar.className='exam-toolbar';toolbar.innerHTML='<div class="exam-progress"><p id="answerProgress"></p><progress id="answerMeter" aria-label="답안 작성 진행률"></progress></div><p id="examTimer"></p>';$('counts').before(toolbar);
        const map=document.createElement('details');map.className='question-map';map.innerHTML='<summary>전체 문항 보기 · 응답한 문항은 파란색으로 표시</summary><nav id="questionNav" aria-label="문항 이동"></nav>';$('work').before(map);
        const result=document.createElement('div');result.id='summaryResult';result.hidden=true;result.setAttribute('role','status');map.before(result);
        const dialog=document.createElement('dialog');dialog.id='submitDialog';dialog.setAttribute('aria-labelledby','submitTitle');dialog.innerHTML='<h2 id="submitTitle">답안을 제출할까요?</h2><p id="submitMessage"></p><div class="dialog-actions"><button id="reviewUnanswered" type="button">미응답 확인</button><button id="confirmSubmit" type="button">제출하기</button></div>';document.body.append(dialog);
        $('reviewUnanswered').onclick=()=>{dialog.close();if(!accountGuard()||submitting||draft.submittedAt)return;const index=draft.questions.findIndex(q=>!answered(q));if(index>=0){draft.cursor=index;draft=session.save(user,draft);render();focusQuestion();}};
        $('confirmSubmit').onclick=()=>submitAnswers();
        const tick=()=>{const sec=Math.max(0,Math.ceil((draft.examDeadline-Date.now())/1000));$('examTimer').replaceChildren();const label=document.createElement('small');label.textContent=draft.submittedAt?'제출 완료':'남은 시간';$('examTimer').append(label,document.createTextNode(draft.submittedAt?'✓':`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`));$('examTimer').classList.toggle('urgent',!draft.submittedAt&&sec<=60);if(expired()&&!draft.submittedAt&&!submitting&&!saveError)submitAnswers();};setInterval(tick,1000);tick();
    }
    render();
})().catch(error=>{console.error(error);document.getElementById('empty').hidden=false;document.getElementById('empty').textContent='학습을 열지 못했습니다. 새로고침해 주세요.';});
</script></body></html>
