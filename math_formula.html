<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">
    <title>수학 공식 사전 - Smart Study</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="MathFormulaData.js?v=20260729-foundations"></script>
    <script defer src="MathFormulaQuiz.js?v=20260729-foundations"></script>
    <script defer src="MathFormulaApp.js?v=20260729-foundations"></script>
    <style>
        :root{--formula:#a78bfa;--formula2:#38bdf8;--panel:#111c31;--panel2:#16243b}
        *{box-sizing:border-box}
        body{margin:0;background:#091120;color:#edf4ff;font-family:"Noto Sans KR",sans-serif;line-height:1.8;min-height:100vh}
        body:before{content:"";position:fixed;inset:0;z-index:-1;background:
            radial-gradient(circle at 15% 10%,rgba(56,189,248,.13),transparent 30%),
            radial-gradient(circle at 85% 15%,rgba(167,139,250,.13),transparent 32%)}
        button,textarea{font:inherit}
        .page{max-width:1380px;margin:0 auto;padding:24px 30px 90px}
        .top-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
        .top-nav a{color:#dbeafe;text-decoration:none;font-weight:700}
        .no-limit{padding:7px 13px;border:1px solid rgba(52,211,153,.35);border-radius:999px;background:rgba(52,211,153,.09);color:#86efac;font-size:.78rem;font-weight:800}
        .hero{padding:34px;border:1px solid rgba(167,139,250,.38);border-radius:26px;background:linear-gradient(135deg,rgba(30,41,68,.96),rgba(17,28,49,.96));text-align:center}
        .hero-kicker{font:800 .8rem Outfit,sans-serif;letter-spacing:.18em;color:#c4b5fd}
        .hero h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.2;margin:8px 0;background:linear-gradient(90deg,#a78bfa,#38bdf8);-webkit-background-clip:text;color:transparent}
        .hero p{margin:0;color:#b9c7dc}
        .mode-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
        .mode-row button{border:1px solid #30425e;border-radius:14px;padding:13px;background:#101a2d;color:#d8e3f4;font-weight:800;cursor:pointer}
        .mode-row button.active{background:linear-gradient(135deg,#8b5cf6,#38bdf8);color:#07101e;border-color:transparent}
        .layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
        .sidebar{position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto;padding:16px;border:1px solid #273a56;border-radius:20px;background:rgba(13,23,41,.94)}
        .formula-group+.formula-group{margin-top:18px;padding-top:18px;border-top:1px solid #263852}
        .group-heading{display:flex;justify-content:space-between;gap:8px;margin:0 4px 8px;color:#e9e5ff;font-size:.83rem}
        .group-heading span{color:#7890ae;font-size:.7rem}
        .formula-menu{display:grid;gap:6px}
        .formula-menu-btn{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:1px solid transparent;border-radius:10px;background:transparent;color:#afbdd1;text-align:left;font-size:.78rem;line-height:1.45;cursor:pointer}
        .formula-menu-btn span{color:#7dd3fc;font:800 .7rem Outfit,sans-serif}
        .formula-menu-btn:hover{background:#17253c}
        .formula-menu-btn.active{border-color:#8b5cf6;background:rgba(139,92,246,.15);color:#fff}
        .lesson-card{padding:clamp(20px,4vw,44px);border:1px solid #293c58;border-radius:24px;background:rgba(14,24,43,.96)}
        .lesson-kicker{font:800 .78rem Outfit,sans-serif;letter-spacing:.14em;color:#a78bfa}
        .lesson-card>h2{font-size:clamp(1.6rem,4vw,2.45rem);line-height:1.35;margin:5px 0 12px}
        .curriculum-row{display:flex;flex-wrap:wrap;gap:7px}
        .curriculum-row span{padding:5px 10px;border:1px solid rgba(56,189,248,.28);border-radius:999px;background:rgba(56,189,248,.08);color:#bae6fd;font-size:.74rem;font-weight:700}
        .lesson-summary{margin:18px 0 22px;color:#c5d1e2;font-size:1.03rem;line-height:1.9}
        .formula-display{min-height:100px;display:grid;place-items:center;padding:22px 12px;border:1px solid rgba(167,139,250,.38);border-radius:18px;background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(56,189,248,.08));overflow-x:auto}
        .formula-display .katex{font-size:clamp(1.35rem,3.5vw,2.15rem)}
        .diagram-box{margin:20px 0 35px;padding:12px;border-radius:18px;background:#0d1729;border:1px solid #243750}
        .diagram-box svg{display:block;width:100%;max-height:310px}
        .content-section{margin-top:38px}
        .content-section h3{margin:0 0 16px;font-size:1.18rem;line-height:1.5}
        .symbol-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
        .symbol-item{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:#142138}
        .symbol{display:grid;place-items:center;min-height:46px;border-radius:10px;background:#0c1627;color:#7dd3fc;font-weight:800;overflow:auto}
        .symbol-item p{margin:0;color:#c2cee0;font-size:.9rem;line-height:1.85}
        .knowledge-list{display:grid;gap:9px;margin:0;padding:0;list-style:none}
        .knowledge-list li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 15px;border-left:4px solid #38bdf8;border-radius:8px;background:#132037;color:#d5dfed}
        .knowledge-link{flex-shrink:0;padding:5px 9px;border:1px solid rgba(125,211,252,.3);border-radius:9px;background:rgba(56,189,248,.08);color:#bae6fd;text-decoration:none;font-size:.72rem;font-weight:800}
        .knowledge-link:hover{background:rgba(56,189,248,.16)}
        .guide-link{border-color:rgba(167,139,250,.35);background:rgba(139,92,246,.1);color:#ddd6fe}
        .foundation-section{scroll-margin-top:20px}
        .foundation-intro{margin:-5px 0 15px;color:#9fb0c7;font-size:.88rem;line-height:1.8}
        .foundation-list{display:grid;gap:12px}
        .foundation-card{scroll-margin-top:20px;border:1px solid rgba(167,139,250,.32);border-radius:16px;background:linear-gradient(135deg,rgba(139,92,246,.08),rgba(56,189,248,.045));overflow:hidden}
        .foundation-card summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 17px;cursor:pointer;font-weight:900;color:#e8e3ff}
        .foundation-card summary small{padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:#aebdd2;font-size:.67rem;font-weight:700}
        .foundation-body{padding:0 17px 17px}
        .foundation-lead{margin:0 0 12px;padding:12px 14px;border-radius:11px;background:rgba(255,255,255,.045);color:#d8e1ee;line-height:1.95}
        .foundation-body ol{display:grid;gap:9px;margin:0;padding-left:25px}
        .foundation-body ol li{padding-left:5px;color:#c7d3e3;line-height:1.95}
        .foundation-body ol li::marker{color:#a78bfa;font-weight:900}
        .foundation-example,.foundation-caution{margin-top:13px;padding:12px 14px;border-radius:11px}
        .foundation-example{background:rgba(52,211,153,.075);border-left:3px solid #34d399}
        .foundation-caution{background:rgba(251,191,36,.07);border-left:3px solid #fbbf24}
        .foundation-example p,.foundation-caution p{margin:4px 0 0;color:#ced9e7;line-height:1.9}
        .principle-steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
        .principle-steps li{display:grid;grid-template-columns:42px 1fr;gap:14px;align-items:start;padding:16px;border-radius:15px;background:#142138}
        .step-number{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#38bdf8);color:#07101e;font-weight:900}
        .principle-steps p{margin:0;color:#d6e0ed;line-height:2}
        .example-section{padding:20px;border:1px solid rgba(251,191,36,.28);border-radius:17px;background:rgba(251,191,36,.055)}
        .work-steps{display:grid;gap:8px;margin-top:15px}
        .work-steps p{display:flex;gap:10px;margin:0;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.045);line-height:1.85}
        .work-steps p span{color:#fcd34d;font-weight:900}
        .tip-box{margin-top:28px;padding:16px 18px;border-radius:14px;background:rgba(244,114,182,.09);border-left:4px solid #f472b6}
        .tip-box p{margin:5px 0 0;color:#d7c6d6;line-height:1.9}
        .video-link{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px;padding:14px 16px;border:1px solid rgba(248,113,113,.35);border-radius:14px;background:rgba(248,113,113,.08);color:#fecaca;text-decoration:none;font-weight:800}
        .video-link small{font-weight:500;color:#c7a9ae}
        .source-note{margin-top:15px;color:#70839f;font-size:.72rem}
        .quiz-list{display:grid;gap:18px;margin-top:25px}
        .quiz-card{padding:20px;border:1px solid #2a3d58;border-radius:17px;background:#121f34}
        .quiz-card.correct{border-color:rgba(52,211,153,.48)}.quiz-card.wrong{border-color:rgba(248,113,113,.48)}
        .quiz-label{color:#a78bfa;font-size:.76rem;font-weight:900}
        .quiz-card h3{font-size:1rem;line-height:1.85;margin:8px 0 15px}
        .choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
        .choice-btn{padding:12px;border:1px solid #30445f;border-radius:11px;background:#0c1729;color:#dce6f4;cursor:pointer}
        .choice-btn.selected{border-color:#a78bfa;background:rgba(139,92,246,.2)}
        .written-answer{width:100%;min-height:115px;padding:13px;border:1px solid #30445f;border-radius:11px;background:#0c1729;color:#e7eef9;line-height:1.8;resize:vertical}
        .solution{margin-top:15px;padding:13px 15px;border-radius:11px}.solution.ok{background:rgba(52,211,153,.1)}.solution.no{background:rgba(248,113,113,.1)}
        .solution p{margin:5px 0 0;line-height:1.85;color:#cbd7e6}
        .quiz-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
        .primary-btn,.secondary-btn{padding:11px 18px;border-radius:11px;font-weight:800;cursor:pointer}
        .primary-btn{border:0;background:linear-gradient(135deg,#8b5cf6,#38bdf8);color:#07101e}.secondary-btn{border:1px solid #344863;background:#132036;color:#d8e3f2}
        .score-box{margin-top:15px;padding:16px;border-radius:14px;text-align:center;background:rgba(56,189,248,.1);color:#7dd3fc;font-size:1.15rem;font-weight:900}
        .page-controls{display:flex;justify-content:center;gap:10px;margin-top:20px}
        .page-controls button{padding:10px 17px;border:1px solid #30445f;border-radius:11px;background:#142138;color:#dbe7f6;font-weight:800;cursor:pointer}
        .page-controls button:disabled{opacity:.35;cursor:not-allowed}
        @media(max-width:850px){.page{padding:16px 14px 70px}.layout{grid-template-columns:1fr}.sidebar{position:static;max-height:none}.formula-menu{grid-template-columns:repeat(2,minmax(0,1fr))}.symbol-grid{grid-template-columns:1fr}}
        @media(max-width:520px){.hero{padding:25px 15px}.choice-grid,.formula-menu{grid-template-columns:1fr}.lesson-card{padding:20px 15px}.symbol-item{grid-template-columns:58px 1fr}.top-nav{align-items:flex-start}.knowledge-list li{align-items:flex-start;flex-direction:column}.foundation-card summary{align-items:flex-start;flex-direction:column}}
    </style>
</head>
<body>
    <main class="page">
        <nav class="top-nav">
            <a href="index.html">← 과목 목록</a>
            <span class="no-limit">⏱️ 시간 제한 없음 · 통계/미션 제외</span>
        </nav>
        <header class="hero">
            <div class="hero-kicker">MATHEMATICS FORMULA ENCYCLOPEDIA</div>
            <h1>📐 수학 공식 사전</h1>
            <p id="heroSubtitle">공식 001 · 정삼각형의 넓이 공식</p>
        </header>
        <div class="mode-row">
            <button id="studyModeBtn">📖 원리 학습</button>
            <button id="quizModeBtn">🧩 랜덤 퀴즈</button>
        </div>
        <div class="layout">
            <aside class="sidebar" id="formulaGroups" aria-label="공식 목록"></aside>
            <div>
                <section id="content"></section>
                <div class="page-controls">
                    <button id="prevBtn">← 이전 공식</button>
                    <button id="nextBtn">다음 공식 →</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
