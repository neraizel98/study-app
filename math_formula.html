    <style>
        :root{--formula:#7041fb;--formula2:#23845c;--panel:#ffffff;--panel2:#ffffff}
        *{box-sizing:border-box}
        body{margin:0;background:#fbf7ef;color:#2b2620;font-family:"Noto Sans KR",sans-serif;line-height:1.8;min-height:100vh}
        body:before{content:"";position:fixed;inset:0;z-index:-1;background:
            radial-gradient(circle at 15% 10%,rgba(35,132,92,0.13),transparent 30%),
            radial-gradient(circle at 85% 15%,rgba(112,65,251,0.13),transparent 32%)}
        button,textarea{font:inherit}
        .page{max-width:1380px;margin:0 auto;padding:24px 30px 90px}
        .top-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
        .top-nav a{color:#2b2620;text-decoration:none;font-weight:700}
        .home-link{padding:7px 13px;border:1px solid rgba(35,132,92,0.455);border-radius:999px;background:rgba(35,132,92,0.09);color:#23845c;font-size:.78rem;font-weight:800}
        .hero{padding:34px;border:1px solid rgba(112,65,251,0.494);border-radius:26px;background:linear-gradient(135deg,#ffffff,#ffffff);text-align:center}
        .hero-kicker{font:800 .8rem var(--font);letter-spacing:.18em;color:#663efe}
        .hero h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.2;margin:8px 0;background:linear-gradient(90deg,#7041fb,#23845c);-webkit-background-clip:text;color:transparent}
        .hero p{margin:0;color:#6e6559}
        .mode-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
        .mode-row button{border:1px solid #ddd2bf;border-radius:14px;padding:13px;background:#ffffff;color:#2b2620;font-weight:800;cursor:pointer}
        .mode-row button.active{background:linear-gradient(135deg,#7b43f9,#23845c);color:#ffffff;border-color:transparent}
        .filter-panel{margin:0 0 18px;padding:14px 16px;border:1px solid #ede5d6;border-radius:16px;background:#ffffff}
        .filter-panel .level-filter{margin:0;padding:0;border:0}
        .layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
        .sidebar{position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto;padding:16px;border:1px solid #ede5d6;border-radius:20px;background:#ffffff}
        .level-filter{margin:0}
        .filter-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;color:#2b2620;font-size:.84rem}
        .filter-heading-main{display:flex;align-items:center;gap:8px}
        .mobile-filter-toggle{display:none;border:0;background:transparent;color:#23845c;font-weight:900;cursor:pointer}
        .filter-heading button{padding:4px 8px;border:1px solid #ddd2bf;border-radius:8px;background:#ffffff;color:#2b2620;font-size:.66rem;font-weight:800;cursor:pointer}
        .level-filter-options{display:flex;flex-wrap:wrap;gap:6px}
        .level-filter-options label{cursor:pointer}
        .level-filter-options input{position:absolute;opacity:0;pointer-events:none}
        .level-filter-options span{display:block;padding:5px 9px;border:1px solid #ddd2bf;border-radius:999px;background:#ffffff;color:#6e6559;font-size:.67rem;font-weight:800}
        .level-filter-options input:checked+span{border-color:#7b43f9;background:rgba(123,67,249,0.18);color:#2b2620}
        .level-filter p{margin:8px 0 0;color:#6e6559;font-size:.64rem;line-height:1.55}
        .formula-group+.formula-group{margin-top:18px;padding-top:18px;border-top:1px solid #ede5d6}
        .group-heading{display:flex;justify-content:space-between;gap:8px;margin:0 4px 8px;color:#2b2620;font-size:.83rem}
        .group-toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:0;border:0;background:transparent;color:inherit;text-align:left;cursor:default}
        .group-toggle-icon{display:none;color:#23845c}
        .group-heading span{color:#5b789d;font-size:.7rem}
        .formula-menu{display:grid;gap:6px}
        .formula-menu-btn{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:7px;width:100%;padding:9px 9px;border:1px solid transparent;border-radius:10px;background:transparent;color:#6e6559;text-align:left;font-size:.76rem;line-height:1.45;cursor:pointer}
        .formula-menu-btn .formula-number{color:#23845c;font:800 .68rem var(--font)}
        .formula-menu-btn .formula-title{min-width:0;color:inherit}
        .level-badge{padding:2px 6px;border:1px solid rgba(112,65,251,0.455);border-radius:999px;background:rgba(123,67,249,0.12);color:#2b2620;font-size:.6rem;font-weight:900;white-space:nowrap}
        .formula-menu-btn:hover{background:#ffffff}
        .formula-menu-btn.active{border-color:#7b43f9;background:rgba(123,67,249,0.15);color:#2b2620}
        .lesson-card{padding:clamp(20px,4vw,44px);border:1px solid #ddd2bf;border-radius:24px;background:#ffffff}
        .lesson-kicker{font:800 .78rem var(--font);letter-spacing:.14em;color:#7041fb}
        .lesson-card>h2{font-size:clamp(1.6rem,4vw,2.45rem);line-height:1.35;margin:5px 0 12px}
        .curriculum-row{display:flex;flex-wrap:wrap;gap:7px}
        .curriculum-row span{padding:5px 10px;border:1px solid rgba(35,132,92,0.364);border-radius:999px;background:rgba(35,132,92,0.08);color:#23845c;font-size:.74rem;font-weight:700}
        .lesson-summary{margin:18px 0 22px;color:#2b2620;font-size:1.03rem;line-height:1.9}
        .formula-display{min-width:0;max-width:100%;min-height:100px;display:grid;place-items:center;padding:22px 12px;border:1px solid rgba(112,65,251,0.494);border-radius:18px;background:linear-gradient(135deg,rgba(123,67,249,0.12),rgba(35,132,92,0.08));overflow-x:auto}
        .formula-display .katex{font-size:clamp(1.35rem,3.5vw,2.15rem)}
        .diagram-box{margin:20px 0 35px;padding:12px;border-radius:18px;background:#ffffff;border:1px solid #ede5d6}
        .diagram-box svg{display:block;width:100%;max-height:310px}
        .content-section{margin-top:38px}
        .content-section h3{margin:0 0 16px;font-size:1.18rem;line-height:1.5}
        .symbol-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
        .symbol-item{display:grid;grid-template-columns:72px minmax(0,1fr);overflow-wrap:anywhere;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:#ffffff}
        .symbol{display:grid;place-items:center;min-height:46px;border-radius:10px;background:#ffffff;color:#23845c;font-weight:800;overflow:auto}
        .symbol-item p{margin:0;color:#2b2620;font-size:.9rem;line-height:1.85}
        .knowledge-list{display:grid;gap:9px;margin:0;padding:0;list-style:none}
        .knowledge-list li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 15px;border-left:4px solid #23845c;border-radius:8px;background:#ffffff;color:#2b2620}
        .knowledge-link{flex-shrink:0;padding:5px 9px;border:1px solid rgba(35,132,92,0.39);border-radius:9px;background:rgba(35,132,92,0.08);color:#23845c;text-decoration:none;font-size:.72rem;font-weight:800}
        .knowledge-link:hover{background:rgba(35,132,92,0.16)}
        .guide-link{border-color:rgba(112,65,251,0.455);background:rgba(123,67,249,0.1);color:#2b2620}
        .foundation-section{scroll-margin-top:20px}
        .foundation-intro{margin:-5px 0 15px;color:#6e6559;font-size:.88rem;line-height:1.8}
        .foundation-list{display:grid;gap:12px}
        .foundation-card{scroll-margin-top:20px;border:1px solid rgba(112,65,251,0.416);border-radius:16px;background:linear-gradient(135deg,rgba(123,67,249,0.08),rgba(35,132,92,0.08));overflow:hidden}
        .foundation-card summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 17px;cursor:pointer;font-weight:900;color:#2b2620}
        .foundation-card summary small{padding:3px 8px;border-radius:999px;background:#ffffff;color:#6e6559;font-size:.67rem;font-weight:700}
        .foundation-body{padding:0 17px 17px}
        .foundation-lead{margin:0 0 12px;padding:12px 14px;border-radius:11px;background:#ffffff;color:#2b2620;line-height:1.95}
        .foundation-body ol{display:grid;gap:9px;margin:0;padding-left:25px}
        .foundation-body ol li{padding-left:5px;color:#2b2620;line-height:1.95}
        .foundation-body ol li::marker{color:#7041fb;font-weight:900}
        .foundation-example,.foundation-caution{margin-top:13px;padding:12px 14px;border-radius:11px}
        .foundation-example{background:rgba(31,161,113,0.08);border-left:3px solid #20a574}
        .foundation-caution{background:rgba(185,133,0,0.08);border-left:3px solid #be8900}
        .foundation-example p,.foundation-caution p{margin:4px 0 0;color:#2b2620;line-height:1.9}
        .principle-steps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
        .principle-steps li{display:grid;grid-template-columns:42px 1fr;gap:14px;align-items:start;padding:16px;border-radius:15px;background:#ffffff}
        .step-number{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#7b43f9,#23845c);color:#ffffff;font-weight:900}
        .principle-steps p{margin:0;color:#2b2620;line-height:2}
        .example-section{padding:20px;border:1px solid rgba(190,137,0,0.364);border-radius:17px;background:rgba(185,133,0,0.08)}
        .work-steps{display:grid;gap:8px;margin-top:15px}
        .work-steps p{display:flex;gap:10px;margin:0;padding:10px 12px;border-radius:10px;background:#ffffff;line-height:1.85}
        .work-steps p span{color:#947100;font-weight:900}
        .tip-box{margin-top:28px;padding:16px 18px;border-radius:14px;background:rgba(245,71,162,0.09);border-left:4px solid #f547a2}
        .tip-box p{margin:5px 0 0;color:#2b2620;line-height:1.9}
        .video-link{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px;padding:14px 16px;border:1px solid rgba(250,66,66,0.455);border-radius:14px;background:rgba(250,66,66,0.08);color:#eb0000;text-decoration:none;font-weight:800}
        .video-link small{font-weight:500;color:#6e6559}
        .source-note{margin-top:15px;color:#6e6559;font-size:.72rem}
        .quiz-list{display:grid;gap:18px;margin-top:25px}
        .quiz-card{padding:20px;border:1px solid #ddd2bf;border-radius:17px;background:#ffffff}
        .quiz-card.correct{border-color:rgba(32,165,116,0.624)}.quiz-card.wrong{border-color:rgba(250,66,66,0.624)}
        .quiz-label{color:#7041fb;font-size:.76rem;font-weight:900}
        .quiz-card h3{font-size:1rem;line-height:1.85;margin:8px 0 15px}
        .choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
        .choice-btn{padding:12px;border:1px solid #ddd2bf;border-radius:11px;background:#ffffff;color:#2b2620;cursor:pointer}
        .choice-btn.selected{border-color:#7041fb;background:rgba(123,67,249,0.18)}
        .written-answer{width:100%;min-height:115px;padding:13px;border:1px solid #ddd2bf;border-radius:11px;background:#ffffff;color:#2b2620;line-height:1.8;resize:vertical}
        .solution{margin-top:15px;padding:13px 15px;border-radius:11px}.solution.ok{background:rgba(31,161,113,0.1)}.solution.no{background:rgba(250,66,66,0.1)}
        .solution p{margin:5px 0 0;line-height:1.85;color:#2b2620}
        .quiz-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
        .primary-btn,.secondary-btn{padding:11px 18px;border-radius:11px;font-weight:800;cursor:pointer}
        .primary-btn{border:0;background:linear-gradient(135deg,#7b43f9,#23845c);color:#ffffff}.secondary-btn{border:1px solid #ddd2bf;background:#ffffff;color:#2b2620}
        .score-box{margin-top:15px;padding:16px;border-radius:14px;text-align:center;background:rgba(35,132,92,0.1);color:#23845c;font-size:1.15rem;font-weight:900}
        .page-controls{display:flex;justify-content:center;gap:10px;margin-top:20px}
        .page-controls button{padding:10px 17px;border:1px solid #ddd2bf;border-radius:11px;background:#ffffff;color:#2b2620;font-weight:800;cursor:pointer}
        .page-controls button:disabled{opacity:.35;cursor:not-allowed}
        .mobile-formula-toolbar{display:none}
        @media(max-width:850px){
            .page{padding:16px 14px 70px}
            .filter-panel{padding:12px 14px}
            .mobile-filter-toggle{display:inline-flex}
            .filter-panel:not(.open) .level-filter-options,.filter-panel:not(.open) .level-filter p{display:none}
            .filter-panel:not(.open) .filter-heading{margin-bottom:0}
            .layout{grid-template-columns:1fr;gap:12px}
            .mobile-formula-toolbar{position:sticky;top:8px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid #ddd2bf;border-radius:14px;background:#ffffff;box-shadow:0 8px 24px rgba(43,38,32,0.098)}
            .mobile-current-formula{min-width:0}
            .mobile-current-formula strong,.mobile-current-formula span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
            .mobile-current-formula strong{font-size:.8rem;color:#2b2620}.mobile-current-formula span{font-size:.66rem;color:#6e6559}
            .mobile-list-toggle{flex-shrink:0;padding:7px 10px;border:1px solid rgba(35,132,92,0.494);border-radius:10px;background:rgba(35,132,92,0.1);color:#23845c;font-size:.7rem;font-weight:900;cursor:pointer}
            .sidebar{position:static;max-height:none}
            .sidebar.mobile-collapsed{display:none}
            .group-toggle{cursor:pointer}
            .group-toggle-icon{display:inline}
            .formula-group.mobile-collapsed .group-items{display:none}
            .formula-menu{grid-template-columns:repeat(2,minmax(0,1fr))}
            .symbol-grid{grid-template-columns:1fr}
            #content{scroll-margin-top:78px}
        }
        @media(max-width:520px){.hero{padding:25px 15px}.choice-grid,.formula-menu{grid-template-columns:1fr}.lesson-card{padding:20px 15px}.symbol-item{grid-template-columns:58px minmax(0,1fr)}.top-nav{align-items:flex-start}.knowledge-list li{align-items:flex-start;flex-direction:column}.foundation-card summary{align-items:flex-start;flex-direction:column}}
        .lesson-card,.principle-steps li,.principle-steps li p{min-width:0;overflow-wrap:anywhere}
        .formula-display .katex-display{max-width:100%;overflow-x:auto;overflow-y:hidden}
    .review-formula{padding:14px;background:#ffffff;border:1px solid #ddd2bf;border-radius:12px;margin:14px 0;overflow:auto}.review-formula span{font-size:13px;color:#23845c}.choice-btn .katex{font-size:1.05em}.choice-btn{min-width:0;overflow-x:auto}.quiz-card h3{font-size:1.05rem;line-height:1.8;white-space:pre-line}.written-answer{background:#ffffff;color:#2b2620;border:1px solid #4c6686;border-radius:10px}.review-givens{white-space:pre-line;padding:14px 16px;background:#ffffff;border-radius:10px;line-height:1.9;font-weight:600;margin:14px 0}.choice-grid{gap:10px}</style>
