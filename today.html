<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘 학습 · Smart Study</title><link rel="stylesheet" href="styles.css">
<style>
body{background:#0d1117;color:#ecf4ff;font-family:Arial,sans-serif;margin:0}.wrap{max-width:920px;margin:auto;padding:24px 16px 70px}
a{color:#83caff}.panel,.task{background:#162033;border:1px solid #34445e;border-radius:16px;padding:20px;margin:16px 0}
h1{font-size:1.7rem;margin:16px 0 4px}h2{font-size:1.14rem;margin:0 0 10px}.muted{color:#a8b8ce;line-height:1.6}
label{display:block;margin:12px 0 5px}select,input,button{font:inherit}select,input{max-width:100%;background:#0e1726;color:#fff;border:1px solid #50617a;border-radius:9px;padding:9px}
button,.go{background:#4facfe;color:#092038;border:0;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;margin-top:9px}
button:disabled{opacity:.5;cursor:default}.task{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}.task>div{min-width:0}.task p{margin:5px 0;overflow-wrap:anywhere}.task .actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;min-width:0}.task .actions>*{min-width:0;max-width:100%}.task .actions select{flex:1 1 260px;width:min(100%,420px)}.task .actions button,.task .actions .go{margin-top:0}
.tag{display:inline-block;white-space:nowrap;border-radius:20px;background:#263956;padding:4px 10px;font-size:.8rem}.summary{display:flex;gap:12px;flex-wrap:wrap}.summary span{background:#25334a;border-radius:10px;padding:10px}
@media(max-width:620px){.wrap{padding:15px 12px 55px}}
</style></head><body><main class="wrap">
<a href="index.html">← 대시보드</a><h1>오늘 학습</h1><p class="muted">국어 독해 → 영어 → 수학 순서로 학습해요. 시간은 목표를 세우는 데 쓰며, 다 채우지 못해도 학습이 잠기지 않습니다.</p>
<section id="setup" class="panel"><h2>보호자 설정</h2><p id="settingsSummary" class="muted"></p><p id="settingsStatus" class="muted">저장된 설정을 먼저 표시하고 보호자 설정을 확인하는 중입니다.</p></section>
<section id="planPanel"><div class="panel"><h2>오늘의 시간 계획</h2><p id="budgetSummary" class="muted"></p><div id="overview" class="summary"></div></div><div id="tasks"></div><p id="timeNote" class="muted"></p></section>
</main>
<script src="storage-keys.js"></script><script src="storage-events.js"></script><script src="schema-migrations.js"></script><script src="durable-store.js"></script><script src="local-repository.js"></script><script src="app-bootstrap.js"></script><script src="report.js"></script>
<script src="firebase-config.js"></script><script src="firebase-client.js"></script><script src="firestore-repository.js?v=20260923-parent-free"></script><script src="in-app-study-request.js?v=20260923-notification-role"></script>
<script src="MathData.js"></script><script src="MathDataMiddle1.js"></script><script src="MathDataMiddle1Semester2.js"></script><script src="ReadingData.js"></script><script src="VocabEng.js"></script>
<script src="learning-plan.js?v=20260923-parent-free"></script><script src="learning-session.js"></script>
<script>
(async function(){
    await SmartStudy.LocalRepository.ready;
    const user=SmartStudy.LocalRepository.getActiveUser();
    if(!user){location.href='index.html';return;}
    const api=SmartStudy.LearningPlan,$=id=>document.getElementById(id);
    const names={reading:'국어 독해',english:'영어',math:'수학'};
    const escape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const options=(subject,profile)=>api.catalog(subject,profile);
    function render(){
        const settings=api.getSettings(user),profile=api.getProfile(user);let plan=api.refreshEvidence(user);if(!plan)plan=api.createPlan(user);
        const gradeLabel=profile.grade<=6?`초등 ${profile.grade}학년`:profile.grade<=9?`중학교 ${profile.grade-6}학년`:`고등학교 ${profile.grade-9}학년`;
        $('settingsSummary').textContent=`${gradeLabel} · ${profile.semester}학기 · 과목별 자동 추천/보호자 지정`;
        const deferred=plan.settingsSnapshot!==api.settingsSignature(settings)&&plan.tasks.some(task=>task.status!=='ready'||task.startedAt||task.completedAt);
        const planProfile=plan.profile||profile;
        $('budgetSummary').textContent=deferred?`오늘 적용 목표: ${plan.budget}분 · 새 설정 ${settings.budgetMinutes}분은 다음 계획부터 적용`:`보호자가 정한 하루 목표: ${plan.budget}분`;
        if(deferred)$('settingsStatus').textContent='오늘 이미 시작한 계획은 단원·상태·시간을 그대로 유지하고, 새 보호자 설정은 다음 계획부터 적용합니다.';
        const completed=plan.tasks.filter(task=>task.status==='completed').length;
        const userData=SmartStudy.LocalRepository.getUser(user)||{},daily=userData.dailyStats?.date===plan.date?userData.dailyStats:{};
        const formula=userData.formulaStudyTime||{};
        const formulaToday=formula.date===plan.date?Math.max(0,Number(formula.studySeconds||0)+Number(formula.quizSeconds||0)):0;
        const actualFor=subject=>Math.max(0,Number(daily.learningTime?.[subject]||0)+Number(daily.quizTime?.[subject]||0))+(subject==='math'?formulaToday:0);
        const totalActual=plan.tasks.reduce((sum,task)=>sum+actualFor(task.subject),0);
        $('overview').innerHTML=`<span>${escape(plan.date)} · ${plan.budget}분 목표</span><span>실제 활동 ${Math.floor(totalActual/60)}분</span><span>제출 확인 ${completed}/3과목</span>`;
        const container=$('tasks');container.replaceChildren();
        for(const task of plan.tasks){
            const card=document.createElement('section');card.className='task';
            const done=task.status==='completed';
            const spent=actualFor(task.subject),remaining=Math.max(0,task.minutes*60-spent);
            card.innerHTML=`<div><h2>${escape(names[task.subject])} <span class="tag">${task.minutes}분 계획</span>${task.required?' <span class="tag">보호자 필수</span>':''}</h2><p>${escape(task.context?.title||'현재 설정에서 지원 단원 없음')}</p><p class="muted">${escape(task.reasonText)}</p><p class="muted">실제 활동 ${Math.floor(spent/60)}분 · 계획까지 ${Math.ceil(remaining/60)}분 남음</p><p class="muted">${done?(task.required?'같은 단원의 제출 퀴즈 확인 · 필수 과제 완료':'같은 단원의 제출 퀴즈 확인됨'):task.status==='in_progress'?'학습 중 · 같은 단원의 퀴즈 제출을 확인해요':'준비 중'}</p></div><div class="actions"></div>`;
            const actions=card.querySelector('.actions');
            if(!task.context&&!done){
                const note=document.createElement('p');note.className='muted';note.textContent='현재 설정에 맞는 단원이 없어 이 과목 과제를 시작할 수 없습니다. 보호자 설정을 확인해 주세요.';actions.append(note);
            }else{
                const go=document.createElement('a');go.className='go';go.href=task.targetUrl;go.textContent=done?'내용 계속 학습':'내용 학습';go.onclick=()=>{if(!done)api.startTask(user,task.id);};actions.append(go);
                const practice=document.createElement('a');practice.className='go';
                const run=done?`&run=${Date.now()}`:'';
                practice.href=`weekly_assessment.html?mode=practice&task=${encodeURIComponent(task.id)}${run}`;
                practice.textContent=done?'새 문항 연습':'문항 연습 · 이어풀기';practice.onclick=()=>{if(!done)api.startTask(user,task.id);};actions.append(practice);
                if(!done&&!task.required&&task.status==='ready'){
                    const select=document.createElement('select');select.setAttribute('aria-label',`${names[task.subject]} 단원 변경`);
                    const choices=options(task.subject,planProfile);
                    const current=document.createElement('option');current.value='';current.textContent='단원 변경';select.append(current);
                    choices.forEach((choice,index)=>{const option=document.createElement('option');option.value=String(index);option.textContent=choice.label;select.append(option);});
                    const change=document.createElement('button');change.textContent='선택한 단원으로 변경';
                    change.onclick=()=>{if(!select.value||!choices[Number(select.value)])return;api.selectContext(plan.id,user,task.id,choices[Number(select.value)].context);render();};
                    actions.append(select,change);
                }
                if(done){
                    const choices=options(task.subject,planProfile),select=document.createElement('select');select.setAttribute('aria-label',`${names[task.subject]} 자유 학습 단원`);
                    choices.forEach((choice,index)=>{const option=document.createElement('option');option.value=String(index);option.textContent=choice.label;select.append(option);});
                    const free=document.createElement('a');free.className='go';free.textContent='선택 단원 자유 학습';free.href=choices[0]?api.target(task.subject,choices[0].context):'#';
                    select.onchange=()=>{const choice=choices[Number(select.value)];if(choice)free.href=api.target(task.subject,choice.context);};
                    if(choices.length)actions.append(select,free);
                }
            }
            container.append(card);
        }
        $('timeNote').textContent=`국어·영어·수학의 오늘 실제 학습·퀴즈 시간과 수학 공식 시간은 한 번씩만 합산합니다. 목표까지 ${Math.ceil(Math.max(0,plan.budget*60-totalActual)/60)}분 남았습니다. 시간은 안내이며 학습은 계속할 수 있습니다.`;
    }
    async function refreshParentSettings(){
        if(SmartStudy.LocalRepository.getActiveUser()!==user)return;
        try{
            const remote=await Promise.race([
                SmartStudy.FirestoreRepository.getLearnerPlanSettings(user),
                new Promise((_,reject)=>setTimeout(()=>reject(new Error('설정 확인 시간이 초과되었습니다.')),8000))
            ]);
            if(SmartStudy.LocalRepository.getActiveUser()!==user)return;
            api.applyParentSettings(user,remote||{budgetMinutes:45,grade:6,semester:2,scopes:{reading:{mode:'auto'},english:{mode:'auto'},math:{mode:'auto'}}});
            $('settingsStatus').textContent=remote?'보호자 설정을 확인했습니다.':'보호자 설정이 없어 기본 하루 목표 45분을 적용합니다.';
            render();
        }catch(error){
            if(SmartStudy.LocalRepository.getActiveUser()!==user)return;
            $('settingsStatus').textContent='보호자 설정을 받지 못해 이전에 저장된 설정을 사용합니다.';
        }
    }
    window.addEventListener('focus',()=>{
        if(SmartStudy.LocalRepository.getActiveUser()!==user){location.reload();return;}
        render();refreshParentSettings();
    });
    render();
    refreshParentSettings();
})().catch(error=>{console.error(error);document.getElementById('planPanel').hidden=false;document.getElementById('tasks').textContent='오늘 학습을 여는 중 오류가 발생했습니다. 새로고침해 주세요.';});
</script></body></html>
