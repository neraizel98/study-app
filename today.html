<script>
(async function(){
    await SmartStudy.LocalRepository.ready;
    const user=SmartStudy.LocalRepository.getActiveUser();
    if(!user){location.href='index.html';return;}
    const api=SmartStudy.LearningPlan,$=id=>document.getElementById(id);
    const names={reading:'국어 독해',english:'영어 단어',english_reading:'영어 독해',math:'수학',grammar:'영어 문법',math_formula:'수학 공식',hanja:'한자'};
    const escape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const options=(subject,profile)=>api.catalog(subject,profile);
    function render(){
        const settings=api.getSettings(user),profile=api.getProfile(user);let plan=api.getPlan(user)||api.createPlan(user);plan=api.refreshEvidence(user)||plan;
        const gradeLabel=profile.grade<=6?`초등 ${profile.grade}학년`:profile.grade<=9?`중학교 ${profile.grade-6}학년`:`고등학교 ${profile.grade-9}학년`;
        $('settingsSummary').textContent=`${gradeLabel} · ${profile.semester}학기 · 영어 지정 대상 ${settings.englishActivity==='reading'?'독해':'단어'} · 과목별 자동 추천/보호자 지정`;
        const deferred=plan.settingsSnapshot!==api.settingsSignature(settings)&&plan.tasks.some(task=>task.status!=='ready'||task.startedAt||task.completedAt);
        const planProfile=plan.profile||profile;
        $('budgetSummary').textContent=deferred?`오늘 적용 목표: ${plan.budget}분 · 새 설정 ${settings.budgetMinutes}분은 다음 계획부터 적용`:`보호자가 정한 하루 목표: ${plan.budget}분`;
        if(deferred)$('settingsStatus').textContent='오늘 이미 시작한 계획은 단원·상태·시간을 그대로 유지하고, 새 보호자 설정은 다음 계획부터 적용합니다.';
        if(!plan.curriculumVersion)$('settingsStatus').textContent='진행 중인 기존 계획은 보존합니다. 전체 과목 통합 계획은 다음 날부터 적용됩니다.';
        const activity=SmartStudy.LearningProgress.activity(user,plan.date);
        $('overview').innerHTML=`<span>학습 ${Math.floor(activity.total/60)} / ${plan.budget}분</span>`;
        SmartStudy.TodayJourney.renderPlan(user);
    }
    async function refreshParentSettings(){
        if(SmartStudy.LocalRepository.getActiveUser()!==user)return;
        try{
            const remote=await Promise.race([
                SmartStudy.FirestoreRepository.getLearnerPlanSettings(user),
                new Promise((_,reject)=>setTimeout(()=>reject(new Error('설정 확인 시간이 초과되었습니다.')),8000))
            ]);
            if(SmartStudy.LocalRepository.getActiveUser()!==user)return;
            api.applyParentSettings(user,remote||{budgetMinutes:45,grade:6,semester:2,englishActivity:'vocabulary',scopes:{reading:{mode:'auto'},english:{mode:'auto'},english_reading:{mode:'auto'},math:{mode:'auto'}}});
            $('settingsStatus').textContent=remote?'보호자 설정을 확인했습니다.':'보호자 설정이 없어 기본 하루 목표 45분을 적용합니다.';
            render();
        }catch(error){
            if(SmartStudy.LocalRepository.getActiveUser()!==user)return;
            $('settingsStatus').textContent='보호자 설정을 받지 못해 이전에 저장된 설정을 사용합니다.';
        }
    }
    window.addEventListener('focus',()=>{
        if(SmartStudy.LocalRepository.getActiveUser()!==user){location.reload();return;}
        render();refreshParentSettings();
    });
    SmartStudy.StorageEvents.subscribe('reports:saved',()=>queueMicrotask(render));
    window.addEventListener('pageshow',()=>{if(SmartStudy.LocalRepository.getActiveUser()===user)render();});
    window.addEventListener('firemerged',()=>{if(SmartStudy.LocalRepository.getActiveUser()===user)render();});
    render();
    refreshParentSettings();
})().catch(error=>{console.error(error);document.getElementById('planPanel').hidden=false;document.getElementById('tasks').textContent='오늘 학습을 여는 중 오류가 발생했습니다. 새로고침해 주세요.';});
</script><script src="mock-publication.js"></script><script src="weekly-dashboard.js?v=20261014-redesign"></script><script src="icons.js?v=20261014-scratchpad"></script><script src="app-shell.js?v=20261014-redesign"></script>
