<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>게임 랭킹 · Smart Study</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="learning-games.css?v=20261106-free-chain" />
    <link rel="stylesheet" href="game-menu.css?v=20261106-free-chain" />
    <link rel="stylesheet" href="arcade.css?v=20261106-free-chain" />
  </head>
  <body class="arcade">
    <main class="games-shell">
      <a href="game-menu.html" class="back">← 게임 선택</a>
      <header class="game-menu-hero">
        <div>
          <p class="eyebrow">TRAINER RANKINGS</p>
          <h1>트레이너 랭킹</h1>
          <p>같은 게임·날짜·레벨의 최초 도전 점수를 비교해요.</p>
        </div>
        <span class="rank-medal" aria-hidden="true">🏆</span>
      </header>
      <section class="game-panel">
        <h2>랭킹 보기</h2>
        <div class="rankings-controls">
          <label
            >게임<select id="rankingGame">
              <option value="crossword">⚡ 십자말 숲</option>
              <option value="chain">🌊 끝말잇기 항구</option>
            </select></label
          ><label
            >학습 범위<select id="rankingScope">
              <option value="ko-level1">국어 어휘 레벨 1</option>
              <option value="ko-level2">국어 어휘 레벨 2</option>
              <option value="en-level1">영어 단어 레벨 1</option>
              <option value="en-level2">영어 단어 레벨 2</option>
              <option value="en-level3">영어 단어 레벨 3</option>
              <option value="en-level4">영어 단어 레벨 4</option>
            </select></label
          >
        </div>
        <div class="ranking-actions">
          <p id="rankingDate" class="rankings-summary"></p>
          <button id="rankingRefresh">순위 새로 확인</button>
        </div>
        <p id="rankingNote" class="rankings-summary">
          상위 100개 기록 · 같은 점수는 공동 순위 · 실명 대신 닉네임을 표시해요.
        </p>
        <p id="rankingStatus" role="status" aria-live="polite"></p>
        <div id="rankingRows"></div>
        <p>
          <a id="rankingPlay" class="rankings-play" href="learning-games.html"
            >이 게임 시작 →</a
          >
        </p>
      </section>
      <footer>
        점수 추월 도전장은 각 게임의 결과 화면에서 상대를 선택해 카카오톡으로
        공유할 수 있어요.
      </footer>
    </main>
    <script src="storage-keys.js"></script>
    <script src="storage-events.js"></script>
    <script src="schema-migrations.js"></script>
    <script src="durable-store.js"></script>
    <script src="local-repository.js"></script>
    <script src="app-bootstrap.js"></script>
    <script src="firebase-config.js"></script>
    <script src="firebase-client.js"></script>
    <script src="game-config.js?v=20261106-free-chain"></script>
    <script src="game-rankings.js?v=20261106-free-chain"></script>
  </body>
</html>
