    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            overflow-y: auto;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
        }
        .landing-container {
            width: 100%;
            max-width: 900px;
            margin-inline: auto;
            padding: 40px 20px;
            text-align: center;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .landing-container .nav-row-top { flex-wrap: wrap; gap: 12px; }
        .landing-container .nav-right { flex-wrap: wrap; min-width: 0; max-width: 100%; margin-left: auto; }
        .brand-logo {
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }
        .brand-logo h1 {
            font-size: 3.8rem;
            margin: 0;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }
        .brand-logo p {
            color: var(--text-sub);
            font-size: 1.1rem;
            margin-top: 10px;
            opacity: 0.8;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            perspective: 1000px;
        }
        .lang-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 20px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }
        .lang-card:hover:not(.disabled) {
            transform: translateY(-10px) rotateX(5deg);
            border-color: var(--accent);
            box-shadow: 0 15px 35px rgba(35,132,92,0.07);
        }
        .lang-icon {
            font-size: 3rem;
            margin-bottom: 5px;
        }
        .lang-name {
            font-size: 1.4rem;
            font-weight: 700;
            white-space: nowrap;
        }
        .lang-desc {
            font-size: 0.85rem;
            color: var(--text-sub);
            line-height: 1.4;
        }
        .disabled {
            opacity: 0.6;
            cursor: not-allowed;
            filter: grayscale(1);
        }
        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 10px;
            background: #f5efe4;
            color: var(--text-sub);
        }
        .badge.active {
            background: rgba(38,162,52,0.15);
            color: #20852b;
        }
        .kakao-request-btn {
            position: absolute;
            top: 25px;
            left: 25px;
            background: #FEE500;
            color: #3A1D1D;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            z-index: 100;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .kakao-request-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(43,38,32,0.105);
        }
        .lang-card:hover .kakao-request-btn {
            background: #8f7300;
        }

        .footer {
            padding: 40px 0 20px;
            font-size: 0.85rem;
            color: var(--text-sub);
            opacity: 0.5;
            width: 100%;
            text-align: center;
            margin-top: auto;
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Dashboard Card Hovers */
        .dash-card {
            transition: border-color 0.2s, transform 0.2s;
            cursor: pointer;
            display: block;
            text-decoration: none;
            color: inherit;
        }
        .stats-widget:hover {
            border-color: var(--accent) !important;
            transform: scale(1.01);
        }
        .wrong-widget:hover {
            border-color: #ff3d4e !important;
            transform: scale(1.01);
        }
        @media (max-width: 600px) {
            .brand-logo h1 { font-size: 2.8rem; }
            .menu-grid { grid-template-columns: 1fr; gap: 12px; }
            .dashboard-grid { grid-template-columns: 1fr !important; }
            .dash-card { grid-column: span 1 !important; }
            .mission-grid { grid-template-columns: 1fr !important; }
            .lang-card { padding: 28px 20px; gap: 10px; }
            .lang-icon { font-size: 2.4rem; }
            .lang-name { font-size: 1.2rem; }
            .lang-desc { font-size: 0.8rem; }
        }
        /* 미션 인라인 스타일 (FOUC 방지) */
        .mission-list { width: 100%; }
        .mission-section-header { display:flex; align-items:center; gap:10px; margin:24px 0 12px; }
        .mission-section-header:first-child { margin-top:0; }
        .mission-section-label { font-size:1rem; font-weight:700; }
        .mission-section-count { margin-left:auto; font-size:0.78rem; font-weight:600; color:var(--text-sub); background:#ffffff; padding:3px 10px; border-radius:20px; }
        .mission-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
        .mission-grid.single-col { grid-template-columns:1fr; }
        .mission-item { background:#ffffff; border:1px solid #ede5d6; border-radius:16px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; }
        .mission-item.completed { background:rgba(35,132,92,0.08); border-color:rgba(35,132,92,0.455); }
        .mission-icon { font-size:1.5rem; line-height:1; flex-shrink:0; margin-top:2px; }
        .mission-body { flex:1; min-width:0; }
        .mission-title-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
        .mission-title { font-weight:700; font-size:0.95rem; }
        .mission-reward { font-size:0.72rem; font-weight:700; color:var(--accent); background:rgba(35,132,92,0.12); padding:2px 8px; border-radius:20px; white-space:nowrap; }
        .mission-item.completed .mission-reward { background:rgba(38,162,52,0.15); color:#20852b; }
        .mission-desc { font-size:0.82rem; color:var(--text-sub); margin-top:4px; }
        .mission-footer { display:flex; align-items:center; gap:8px; margin-top:10px; }
        .mission-progress-bar { flex:1; height:5px; background:#ece4d6; border-radius:3px; overflow:hidden; }
        .mission-progress-fill { height:100%; background:linear-gradient(90deg,#23845c,#008289); border-radius:3px; transition:width 0.6s; }
        .mission-item.completed .mission-progress-fill { background:linear-gradient(90deg,#20852b,#008267); }
        .mission-progress-text { font-size:0.75rem; color:var(--text-sub); white-space:nowrap; }
        .mission-item.completed .mission-progress-text { color:#20852b; font-weight:600; }
        .mission-reward-banner { margin:0 0 12px; padding:12px 16px; border:1px solid rgba(185,139,0,0.52); border-radius:14px; background:linear-gradient(135deg,rgba(180,135,0,0.13),rgba(204,122,0,0.08)); color:#996b00; font-size:0.9rem; }
        .mission-reward-preview { margin:0 0 12px; padding:12px 14px; border:1px dashed rgba(112,65,251,0.52); border-radius:14px; background:rgba(112,65,251,0.08); text-align:center; }
        .mission-reward-preview-title { margin-bottom:9px; color:#663efe; font-size:0.8rem; font-weight:700; text-align:center; }
        .mission-reward-chip-list { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:7px; }
        .mission-reward-chip { display:inline-flex; align-items:center; padding:5px 9px; border-radius:20px; background:#ffffff; color:var(--text); font-size:0.75rem; }
        .mission-reward-chip small { margin-left:3px; color:var(--text-sub); font-size:0.68rem; }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await window.SmartStudy?.LocalRepository?.ready;
            const loginSection = document.getElementById('login-section');
            const dashboardSection = document.getElementById('dashboard-section');
            const userIdInput = document.getElementById('userIdInput');
            const loginBtn = document.getElementById('loginBtn');

            const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const SUBJECT_LABELS = { reading: '국어', english: '영어 단어', grammar: '영어 문법', english_reading: '영어 독해', math: '수학', math_formula: '수학 공식', hanja: '한자' };

            function celebrateMissions(completed) {
                if (!Array.isArray(completed) || !completed.length || !window.SmartStudyCelebrate) return;
                const exp = completed.reduce((sum, m) => sum + (Number(m.exp) || 0), 0);
                const title = completed.length === 1 ? `미션 달성 · ${completed[0].title}` : `미션 ${completed.length}개 달성!`;
                SmartStudyCelebrate(title, `경험치 +${exp}를 받았어요. 내일도 이어가 볼까요?`, `+${exp}`);
            }

            // Same weekly course as today.html (weekday learning, Saturday mock exam, Sunday wrong-answer review).
            function renderWeek(activeUser, icon) {
                const schedule = window.SmartStudy?.WeeklySchedule;
                const box = document.getElementById('homeWeek');
                if (!schedule) { box.closest('.home-week').hidden = true; return; }
                const days = schedule.days(activeUser), today = schedule.day(Date.now());
                const names = ['월', '화', '수', '목', '금', '토', '일'];
                const kinds = { learning: '학습', mock: '모의고사', review: '복습' };
                const done = days.filter(d => d.complete).length;
                document.getElementById('homeWeekCount').textContent = `주간 달성 ${done}/7일`;
                document.getElementById('homeWeekBar').style.width = `${Math.round((done / 7) * 100)}%`;
                box.innerHTML = days.map((d, i) => {
                    const state = (d.complete ? 'is-done' : d.date === today ? 'is-partial' : d.date < today ? 'is-missed' : 'is-future') + (d.date === today ? ' is-today' : '');
                    const mark = d.complete ? icon('check', 16) : d.date.slice(8).replace(/^0/, '');
                    const label = d.complete ? '완료' : d.date === today ? '진행 중' : d.date < today ? '미완료' : '대기';
                    return `<span class="week-plan-day ${state} kind-${d.kind}" title="${d.date} ${kinds[d.kind]} · ${label}" aria-label="${names[i]}요일 ${kinds[d.kind]} ${label}"><small class="week-plan-name">${names[i]}</small><b>${mark}</b><small class="week-plan-kind">${kinds[d.kind]}</small></span>`;
                }).join('');
            }

            // Home-only header: brand on the left, one-line profile chip (avatar · name · logout) on the right.
            function decorateHomeHeader(activeUser) {
                const icon = (name, size) => window.AppShell ? AppShell.icon(name, { size }) : '';
                const logo = document.querySelector('#app-header .nav-logo-link');
                if (logo && !logo.classList.contains('home-brand')) {
                    logo.classList.add('home-brand');
                    logo.innerHTML = '<span class="home-brand-mark" aria-hidden="true">S</span><span class="logo-text">Smart Study</span>';
                }
                const profile = document.querySelector('#app-header .user-profile-mini');
                if (profile && !profile.classList.contains('home-profile')) {
                    profile.classList.add('home-profile');
                    profile.innerHTML = `<span class="home-avatar" aria-hidden="true">${escapeHtml(Array.from(activeUser)[0] || '?')}</span><span class="home-name">${escapeHtml(activeUser)}</span><button type="button" class="home-logout" aria-label="로그아웃" title="로그아웃">${icon('logout', 16)}</button>`;
                    profile.querySelector('.home-logout').addEventListener('click', () => { window.UserSession.logout(); window.location.href = 'index.html'; });
                }
            }

            function renderHome(activeUser, user) {
                const icon = (name, size) => window.AppShell ? AppShell.icon(name, { size }) : '';
                document.getElementById('homeDate').textContent = new Date().toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul', month: 'long', day: 'numeric', weekday: 'long' });
                document.getElementById('homeHello').textContent = `${activeUser}, 오늘도 한 걸음`;
                const level = user.level || 1;
                const required = UserSession.getRequiredEXP ? UserSession.getRequiredEXP(level) : 100;
                document.getElementById('homeLevel').textContent = `Lv.${level}`;
                document.getElementById('homeLevelBar').style.width = `${Math.min(100, Math.round(((user.exp || 0) / required) * 100))}%`;

                const progress = Achievements.summary(user);
                const streakEl = document.getElementById('homeStreak');
                streakEl.hidden = progress.current < 1;
                streakEl.innerHTML = `${icon('flame', 16)}<span>${progress.current}일 연속</span>`;
                document.getElementById('homeLevelLeft').textContent = `다음 레벨까지 ${Math.max(0, required - (user.exp || 0))} EXP`;
                renderWeek(activeUser, icon);

                const plan = window.SmartStudy?.LocalRepository?.getPreference(`SmartStudy_DailyPlan_${encodeURIComponent(activeUser)}_${MissionManager.periodKey('daily')}`, null);
                const tasks = Array.isArray(plan?.tasks) ? plan.tasks : [];
                const done = tasks.filter(t => t.status === 'completed').length;
                const next = tasks.find(t => t.status !== 'completed');
                const box = document.getElementById('homeNext');
                if (!tasks.length) {
                    box.innerHTML = `<p class="ss-eyebrow">오늘 학습</p><h2>오늘 계획을 만들어 볼까요?</h2><p class="ss-sub">보호자가 정한 시간에 맞춰 과목 순서를 안내해요.</p><a class="ss-btn ss-btn-primary" href="today.html">오늘 학습 시작 ${icon('arrow-right', 18)}</a>`;
                } else if (!next) {
                    box.innerHTML = `<p class="ss-eyebrow">오늘 학습 · ${done}/${tasks.length}</p><h2>오늘 계획을 모두 끝냈어요!</h2><p class="ss-sub">더 하고 싶다면 과목 탭에서 자유롭게 골라요.</p><div class="ss-meter ss-meter-lg"><i style="width:100%"></i></div><a class="ss-btn ss-btn-soft" href="today.html">오늘 기록 보기</a>`;
                } else {
                    const title = next.context?.title ? escapeHtml(next.context.title) : '단원 선택 필요';
                    box.innerHTML = `<p class="ss-eyebrow">다음 할 일 · ${done + 1}/${tasks.length}</p><h2>${escapeHtml(SUBJECT_LABELS[next.subject] || next.subject)}<span class="home-next-min">약 ${Number(next.minutes) || 0}분</span></h2><p class="ss-sub">${title}</p><div class="ss-meter ss-meter-lg" aria-label="오늘 완료 ${done}/${tasks.length}"><i style="width:${Math.round((done / tasks.length) * 100)}%"></i></div><a class="ss-btn ss-btn-primary" href="today.html">${done || next.startedAt ? '이어서 하기' : '오늘 학습 시작'} ${icon('arrow-right', 18)}</a>`;
                }
                document.querySelectorAll('#dashboard-section [data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon, 20); });
                window.AppShell?.mountTabs();
            }

            function updateUI({ reconcile = true } = {}) {
                try {
                    const activeUser = UserSession.getActiveUser();
                    if (activeUser) {
                        loginSection.style.display = 'none';
                        dashboardSection.style.display = 'block';
                        
                        // 출석 체크 및 미션 갱신
                        if (reconcile && typeof UserSession.checkIn === 'function') UserSession.checkIn();
                        if (reconcile && typeof MissionManager.checkMissions === 'function') celebrateMissions(MissionManager.checkMissions());
                        
                        // UI 초기화 (AppUI는 ui-core.js에서 전역 노출됨)
                        if (window.AppUI) AppUI.init({
                            title: '오늘의 학습 대시보드',
                            headerActionHtml: '<button type="button" class="notification-settings-btn" aria-label="알림 상태 및 설정 열기">🔔 알림</button><button type="button" class="cloud-connect-btn header-cloud-connect" aria-label="계정 연결">🔐 <span class="cloud-label">계정 연결</span></button>'
                        });
                        decorateHomeHeader(activeUser);
                        bindCloudButtons();
                        refreshCloudButtonState();

                        refreshAdminBanner(activeUser);
                        
                        // 대시보드 데이터 채우기
                        const user = UserSession.getUserData(activeUser);
                        const rawTime = Number(user.totalStudyTime) || 0;
                        const safeTime = (rawTime > 0 && rawTime < 259200) ? rawTime : 0;
                        
                        const timeEl = document.getElementById('dashTotalTime');
                        const attemptsEl = document.getElementById('dashTotalAttempts');
                        const correctEl = document.getElementById('dashTotalCorrect');
                        
                        if (timeEl) timeEl.innerText = Math.round(safeTime / 60) + '분';
                        if (attemptsEl) attemptsEl.innerText = user.totalAttempts + '회';
                        if (correctEl) correctEl.innerText = user.totalCorrect + '개';

                        // 오답 요약
                        const wrong = WrongNote.getAll();
                        const totalWrong = Object.values(wrong).reduce((sum, items) => sum + (Array.isArray(items) ? items.length : 0), 0);
                        const wrongSummary = document.getElementById('wrongSummary');
                        if (wrongSummary) {
                            if (totalWrong > 0) {
                                wrongSummary.innerHTML = `<b>${totalWrong}개</b><small>다시 풀어 볼 문제</small>`;
                            } else {
                                wrongSummary.innerHTML = `<b>0개</b><small>틀린 문제가 생기면 모아 둘게요</small>`;
                            }
                        }

                        // 오늘의 학습 리포트 카드 업데이트
                        const dailyCard = document.getElementById('dailyReportCard');
                        const subjectSummary = document.getElementById('dailySubjectSummary');
                        const streakBadge = document.getElementById('dailyStreakBadge');
                        const studied = user.dailyStats?.subjectsStudied || [];
                        if (dailyCard && studied.length > 0) {
                            dailyCard.style.display = 'block';
                            const times = user.dailyStats?.studyTime || {};
                            const toMin = s => Math.round((times[s] || 0) / 60);
                            subjectSummary.innerHTML = studied
                                .map(s => {
                                    const info = SubjectRegistry.get(s);
                                    return `<span>${info.icon} ${info.name} <strong>${toMin(s)}분</strong></span>`;
                                })
                                .join('&nbsp;&nbsp;·&nbsp;&nbsp;');
                            const streak = user.attendance?.currentStreak || 0;
                            if (streakBadge) streakBadge.textContent = streak >= 2 ? `🔥 ${streak}일 연속` : '';
                        }

                        renderHome(activeUser, user);

                        // 미션 목록 렌더링
                        if (typeof MissionManager.renderMissionList === 'function') {
                            MissionManager.renderMissionList('missionContainer');
                        }
                    } else {
                        loginSection.style.display = 'flex';
                        dashboardSection.style.display = 'none';
                        window.AppShell?.mountTabs();
                    }
                } catch (e) {
                    console.error('[Dashboard Error]', e);
                    const errOverlay = document.createElement('div');
                    errOverlay.style.cssText = 'position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:rgba(255,0,0,0.18); color:#2b2620; padding:30px; border-radius:20px; z-index:9999; text-align:center; box-shadow:0 10px 30px rgba(43,38,32,0.105);';
                    errOverlay.innerHTML = `<h3>⚠️ 학습 데이터를 불러오는 중 오류가 발생했습니다.</h3><p>${e.message}</p><button onclick="location.reload();" style="margin-top:20px; padding:10px 20px; cursor:pointer; background:#ffffff; border:none; border-radius:10px; font-weight:bold;">기록을 유지하고 다시 시도</button>`;
                    document.body.appendChild(errOverlay);
                }
            }

            loginBtn.addEventListener('click', async () => {
                const id = userIdInput.value.trim();
                if (!id) { alert('이름을 입력해주세요!'); return; }
                UserSession.setActiveUser(id);
                if (window.FireSync) {
                    FireSync.onLogin(id).catch(error => console.warn('[Cloud Sync]', error));
                }
                updateUI();
            });

            async function connectCloud(event) {
                const button = event.currentTarget;
                const buttons = [...document.querySelectorAll('.cloud-connect-btn, #cloudLoginBtn')];
                buttons.forEach(item => { item.disabled = true; setCloudButtonState(item, 'loading'); });
                try {
                    const db = await FireSync.connectCloud();
                    if (db) {
                        buttons.forEach(item => setCloudButtonState(item, 'connected'));
                        updateUI();
                    } else {
                        // Mobile Google authentication continues by redirect.
                        buttons.forEach(item => setCloudButtonState(item, 'redirecting'));
                    }
                } catch (error) {
                    buttons.forEach(item => setCloudButtonState(item, 'disconnected'));
                    alert(`클라우드 연결에 실패했습니다. 로컬 학습은 계속할 수 있습니다.\n${error.message}`);
                } finally { buttons.forEach(item => { item.disabled = false; }); }
            }
            function setCloudButtonState(button, state) {
                if (!button) return;
                button.dataset.cloudState = state;
                if (state === 'connected') {
                    button.innerHTML = '✅ <span class="cloud-label">계정 연결됨</span>';
                    button.setAttribute('aria-label', '계정 연결됨');
                    return;
                }
                if (state === 'loading') {
                    button.innerHTML = '⏳ <span class="cloud-label">연결 확인 중...</span>';
                    button.setAttribute('aria-label', '계정 연결 확인 중');
                    return;
                }
                if (state === 'redirecting') {
                    button.innerHTML = '↗️ <span class="cloud-label">Google 로그인 이동 중...</span>';
                    button.setAttribute('aria-label', 'Google 로그인 이동 중');
                    return;
                }
                button.innerHTML = '🔐 <span class="cloud-label">계정 연결</span>';
                button.setAttribute('aria-label', '계정 연결');
            }
            async function refreshCloudButtonState() {
                const buttons = [...document.querySelectorAll('.cloud-connect-btn, #cloudLoginBtn')];
                if (!buttons.length || !window.SmartStudy?.FirebaseClient) return;
                buttons.forEach(button => setCloudButtonState(button, 'loading'));
                try {
                    const user = await SmartStudy.FirebaseClient.getCurrentUser();
                    buttons.forEach(button => setCloudButtonState(button, user ? 'connected' : 'disconnected'));
                } catch (error) {
                    console.warn('[Cloud Auth State]', error);
                    buttons.forEach(button => setCloudButtonState(button, 'disconnected'));
                } finally {
                    buttons.forEach(button => { button.disabled = false; });
                }
            }
            async function refreshAdminBanner(activeUser) {
                const banner = document.getElementById('adminBanner');
                if (!banner) return;
                banner.style.display = 'none';
                if (activeUser !== '우준아빠' || !window.SmartStudy?.FirebaseClient) return;
                try {
                    const authUser = await SmartStudy.FirebaseClient.getCurrentUser();
                    if (!authUser || UserSession.getActiveUser() !== '우준아빠') return;
                    const access = await SmartStudy.FirestoreRepository.getAccess(authUser.uid);
                    if (access?.role === 'admin' && UserSession.getActiveUser() === '우준아빠') banner.style.display = 'block';
                } catch (error) { console.warn('[Admin Access]', error); }
            }
            async function watchCloudAuthState() {
                if (!window.SmartStudy?.FirebaseClient) return;
                try {
                    const auth = await SmartStudy.FirebaseClient.getAuth();
                    auth.onAuthStateChanged(async user => {
                        const buttons = [...document.querySelectorAll('.cloud-connect-btn, #cloudLoginBtn')];
                        buttons.forEach(button => {
                            button.disabled = false;
                            setCloudButtonState(button, user ? 'connected' : 'disconnected');
                        });
                        const learner = UserSession.getActiveUser();
                        if (learner) updateUI();
                        if (user && learner && window.FireSync) FireSync.onLogin(learner).catch(error => console.warn('[Cloud Sync]', error));
                    });
                } catch (error) {
                    console.warn('[Cloud Auth Watch]', error);
                }
            }
            function bindCloudButtons() {
                document.querySelectorAll('.cloud-connect-btn').forEach(button => {
                    if (button.dataset.cloudBound === 'true') return;
                    button.dataset.cloudBound = 'true';
                    button.addEventListener('click', connectCloud);
                });
            }
            document.getElementById('cloudLoginBtn').addEventListener('click', connectCloud);
            bindCloudButtons();
            watchCloudAuthState();

            window.addEventListener('firesynced', event => {
                if (event.detail?.userId === UserSession.getActiveUser()) updateUI({ reconcile: false });
            });
            window.addEventListener('firemerged', event => {
                if (event.detail?.userId === UserSession.getActiveUser()) updateUI({ reconcile: false });
            });

            userIdInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loginBtn.click();
            });

            const activeUser = UserSession.getActiveUser();
            updateUI();
            if (activeUser && window.FireSync) FireSync.onLogin(activeUser).catch(error => console.warn('[Cloud Sync]', error));
            refreshCloudButtonState();
        });
    </script>

    <script>
        // Service Worker 등록 (PWA 오프라인 지원)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('[SW] Registered:', reg.scope))
                    .catch(err => console.warn('[SW] Registration failed:', err));
            });
        }
    </script>
